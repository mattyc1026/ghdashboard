function wbOnPresence(){
  const now=performance.now();
  DATA.presence.forEach(p=>{
    if(p.id===ME.uid) return;
    const cur=INK.remote.get(p.id);
    if(p.ink && p.ink.id){
      if(p.ink.shape){ INK.remote.set(p.id, {id:p.ink.id, shape:p.ink.shape, ended:0}); }
      else if(p.ink.pts){
        const pts=p.ink.v===2 ? p.ink.pts : [];
        if(!cur || cur.id!==p.ink.id){
          if(DATA.strokes.some(s=>s.id===p.ink.id)) return;
          INK.remote.set(p.id, {id:p.ink.id, pts, color:p.ink.color, size:p.ink.size, tool:p.ink.tool, shown:0, ended:0});
        } else if(pts.length>cur.pts.length){ cur.pts=pts; cur.ended=0; }
      }
    } else if(cur && !cur.ended){ cur.ended=now; }
    // laser: newly arrived points get a fresh time so the trail fades here too
    if(p.laser && p.laser.pts){
      let l=INK.lasers.get(p.id);
      if(!l){ l={pts:[], color:colorFor(p.name)}; INK.lasers.set(p.id, l); }
      const flat=p.laser.pts, last=l.pts[l.pts.length-1];
      // each update repeats the last few points; only the new ones are added
      let start=0;
      if(last) for(let i=flat.length-2;i>=0;i-=2){ if(flat[i]===last[0] && flat[i+1]===last[1]){ start=i+2; break; } }
      for(let i=start;i<flat.length;i+=2) l.pts.push([flat[i], flat[i+1], now]);
      if(l.pts.length>120) l.pts=l.pts.slice(-120);
    }
  });
  wbCursors(); wbKick();
}

const STK_TIMERS={};
function tiltOf(id){ let h=0; for(const c of String(id)) h=(h*33+c.charCodeAt(0))>>>0; return ((h%31)/10-1.5).toFixed(2)+'deg'; }
function addSticky(x,y){
  const id=uid();
  const doc={v:2, x:+x.toFixed(1), y:+y.toFixed(1), text:'', color:WB.sticky, by:ME.uid, at:Date.now()};
  DATA.stickies.push(Object.assign({id}, doc));
  renderStickies();
  wbAdd('stickies', id, doc);
  setTimeout(()=>{ const t=document.querySelector(`.stk[data-id="${id}"] textarea`); if(t) t.focus({preventScroll:true}); }, 40);
}
function renderStickies(){
  const layer=$('stickyLayer'); if(!layer || !WB.w) return;
  const ro=readOnly(), k=K();
  const have=new Set();
  DATA.stickies.forEach(s=>{
    have.add(s.id);
    let el=layer.querySelector(`.stk[data-id="${s.id}"]`);
    if(!el){
      el=document.createElement('div'); el.className='stk'; el.dataset.id=s.id; el.style.setProperty('--rot', tiltOf(s.id));
      el.innerHTML=`<div class="in"><div class="grip"><span class="by"></span>${ro?'':`<button aria-label="Delete sticky note">&times;</button>`}</div><textarea aria-label="Sticky note" ${ro?'readonly':''}></textarea></div>`;
      layer.appendChild(el);
      const ta=el.querySelector('textarea');
      ta.addEventListener('input', ()=>{
        clearTimeout(STK_TIMERS[s.id]);
        STK_TIMERS[s.id]=setTimeout(()=>SUB('stickies').doc(s.id).update({text:ta.value}).catch(fail), 250);
      });
      ta.addEventListener('blur', ()=>{ clearTimeout(STK_TIMERS[s.id]); const cur=DATA.stickies.find(x=>x.id===s.id); if(cur && cur.text!==ta.value) SUB('stickies').doc(s.id).update({text:ta.value}).catch(fail); });
      if(!ro){
        el.querySelector('.grip button').addEventListener('click', ev=>{
          ev.stopPropagation();
          const cur=DATA.stickies.find(x=>x.id===s.id); if(!cur) return;
          const {id, ...doc}=cur;
          SUB('stickies').doc(s.id).delete().catch(fail);
          pushUndo({t:'del', col:'stickies', id:s.id, doc});
        });
        dragSticky(el, s.id);
      }
    }
    if(!el.classList.contains('dragging')){
      const [wx,wy]=stickyPos(s), [sx,sy]=toScreen(wx,wy);
      el.style.transform=`translate(${sx}px,${sy}px) scale(${k})`;
    }
    el.style.backgroundColor=s.color||STICKY_COLORS[0];
    el.querySelector('.in').style.backgroundColor=s.color||STICKY_COLORS[0];
    el.querySelector('.by').textContent=nameOfUid(s.by);
    const ta=el.querySelector('textarea');
    if(document.activeElement!==ta && ta.value!==(s.text||'')) ta.value=s.text||'';
  });
  layer.querySelectorAll('.stk').forEach(el=>{
    if(have.has(el.dataset.id) || el.classList.contains('leaving')) return;
    if(RM.matches) el.remove(); else { el.classList.add('leaving'); setTimeout(()=>el.remove(), 240); }
  });
}
/* Dragging moves the note with the finger and sets its place when let go.
   Other people see it glide there. */
function dragSticky(el, id){
  const grip=el.querySelector('.grip');
  let st=null;
  grip.addEventListener('pointerdown', e=>{
    if(e.target.tagName==='BUTTON') return;
    e.preventDefault(); e.stopPropagation();
    const s=DATA.stickies.find(x=>x.id===id); if(!s) return;
    const [x,y]=stickyPos(s);
    st={px:e.clientX, py:e.clientY, x, y, before:{v:s.v||1, x:s.x, y:s.y}};
    el.classList.add('dragging');
    grip.setPointerCapture(e.pointerId);
  });
  grip.addEventListener('pointermove', e=>{
    if(!st) return;
    const k=K();
    st.nx=st.x+(e.clientX-st.px)/k; st.ny=st.y+(e.clientY-st.py)/k;
    const [sx,sy]=toScreen(st.nx, st.ny);
    el.style.transform=`translate(${sx}px,${sy}px) scale(${k})`;
  });
  const end=()=>{
    if(!st) return;
    const d=st; st=null;
    el.classList.remove('dragging');
    const s=DATA.stickies.find(x=>x.id===id);
    if(s && d.nx!=null){
      const after={v:2, x:+d.nx.toFixed(1), y:+d.ny.toFixed(1)};
      Object.assign(s, after);
      SUB('stickies').doc(id).update(after).catch(fail);
      pushUndo({t:'upd', col:'stickies', id, before:d.before, after});
    }
  };
  grip.addEventListener('pointerup', end); grip.addEventListener('pointercancel', end);
}

/* ----- save as image ----- */
function wbExport(){
  const b=wbBounds();
  if(!b){ toast('The whiteboard is empty.'); return; }
  const pad=40, sc=2, W=Math.ceil((b[2]-b[0]+pad*2)*sc), H=Math.ceil((b[3]-b[1]+pad*2)*sc);
  const lim=8000, f=Math.min(1, lim/W, lim/H);
  const c=document.createElement('canvas'); c.width=Math.ceil(W*f); c.height=Math.ceil(H*f);
  const ctx=c.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,c.width,c.height);
  ctx.setTransform(sc*f,0,0,sc*f,(pad-b[0])*sc*f,(pad-b[1])*sc*f);
  const dark=document.documentElement.classList.contains('dark');
  if(dark) document.documentElement.classList.remove('dark');
  [...DATA.strokes.map(s=>['s',s]), ...DATA.shapes.map(s=>['h',s]), ...DATA.texts.map(s=>['t',s])].sort((a,b)=>(a[1].at||0)-(b[1].at||0))
    .forEach(([k,s])=>{ if(k==='s') drawStroke(ctx, ptsOf(s), s.color, s.size, s.tool); else if(k==='h') drawShape(ctx, s); else drawText(ctx, s); });
  DATA.stickies.forEach(s=>{
    const [x,y]=stickyPos(s);
    ctx.save(); ctx.fillStyle=s.color||STICKY_COLORS[0]; ctx.shadowColor='rgba(0,0,0,.18)'; ctx.shadowBlur=10; ctx.shadowOffsetY=3;
    ctx.fillRect(x,y,150,120); ctx.restore();
    ctx.save(); ctx.fillStyle='#1d1a00'; ctx.font="500 14px 'DM Sans', system-ui, sans-serif"; ctx.textBaseline='top';
    let line='', yy=y+26; const words=String(s.text||'').split(/(\s+)/);
    words.forEach(w=>{ if(w.includes('\n')){ ctx.fillText(line,x+10,yy); yy+=19; line=''; return; } const t=line+w; if(ctx.measureText(t).width>130 && line){ ctx.fillText(line,x+10,yy); yy+=19; line=w.trimStart(); } else line=t; });
    if(line) ctx.fillText(line,x+10,yy);
    ctx.restore();
  });
  if(dark) document.documentElement.classList.add('dark');
  c.toBlob(blob=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=((MTG && MTG.title) || 'Whiteboard').replace(/[^\w ,.-]+/g,'')+' whiteboard.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
}

/* ---------- practice portal ----------
   Everyone has their own practice copy of the portal in a frame. When
   someone presents, their copy streams its screen: the page and every
   change to it, scrolling, typing, pop-ups, and where they touch. Everyone
   following sees a live, exact copy of the presenter's screen, with their
   touches drawn as soft circles and the items they tap lit up. The presenter
   can also draw highlight boxes, and can hide the Follow switch so no one
   can stop following. */
let PP={frame:null, ready:false, follow:true, role:'none'};
const phoneMQ=window.matchMedia('(max-width:900px)');
let PP_BACK='agenda';
function presenterLive(){
  const p=MTG && MTG.presenter;
  if(!p || !p.uid) return null;
  if(p.uid===ME.uid) return p;
  const pres=DATA.presence.find(x=>x.id===p.uid);
  return (pres && (Date.now()-(pres.at||0))<ALIVE_MS) ? p : null;
}
const iPresent=()=>{ const p=presenterLive(); return !!(p && p.uid===ME.uid); };
const followLocked=()=>!!(MTG && MTG.followLock);
function iFollow(){ const p=presenterLive(); return !!(p && p.uid!==ME.uid && (PP.follow || followLocked())); }
function renderPracticePane(){

    <div class="ppFrameWrap" id="ppWrap">

        <div class="mirrorWait" id="mirrorWait"></div></div>

function startPresenting(){

window.addEventListener('message', e=>{
  if(e.origin!==location.origin || !PP.frame || e.source!==PP.frame.contentWindow) return;

/* ----- sending (presenter) -----
   The screen goes out in small numbered pieces under the meeting's stream.
   A fresh full copy goes out every minute and whenever someone starts
   following, and older pieces are deleted, so joining late is quick. */
const MIR={epoch:0, seq:0, buf:[], timer:0, chain:Promise.resolve(), every:null, reqTimer:null};
const STREAM=()=>SUB('stream');
const docKey=(e,s)=>e+'_'+String(s).padStart(7,'0');
async function packText(str){
  if(window.CompressionStream){
    try{
      const cs=new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));
      const buf=new Uint8Array(await new Response(cs).arrayBuffer());
      let bin=''; for(let i=0;i<buf.length;i+=0x8000) bin+=String.fromCharCode.apply(null, buf.subarray(i,i+0x8000));
      return {z:1, d:btoa(bin)};
    }catch(e){}
  }
  return {z:0, d:str};
}
async function unpackText(z, d){
  if(!z) return d;
  const bin=atob(d), buf=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
  const ds=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(ds).text();
}
function mirStartSending(){
  clearInterval(MIR.every);
  MIR.every=setInterval(()=>ppPost({type:'snap'}), 60000);
}
function mirStopSending(){
  clearInterval(MIR.every); MIR.every=null;
  clearTimeout(MIR.timer); MIR.timer=0; MIR.buf=[];
  if(MIR.epoch && MTG_ID){
    MIR.epoch=0;
    MIR.chain=MIR.chain.then(()=>mirPrune(Infinity)).catch(()=>{});
  }
}
/* Pinching to zoom on a phone or tablet zooms this page, not the practice
   copy inside it, so the presenter's zoom is read here and sent as the part
   of the practice copy that is in view. */
function mirOuterZoom(){
  if(!MIR.epoch || !iPresent() || !PP.frame || !window.visualViewport) return;
  const v=visualViewport, r=PP.frame.getBoundingClientRect();
  let vv=[+v.scale.toFixed(3), Math.round(v.offsetLeft-r.left), Math.round(v.offsetTop-r.top)];
  if(v.scale<=1.01) vv=[1,0,0];
  const key=vv.join(',');
  if(key===MIR.vvKey) return;
  MIR.vvKey=key; mirQueue([{vv}]);
}
if(window.visualViewport){ visualViewport.addEventListener('resize', mirOuterZoom); visualViewport.addEventListener('scroll', mirOuterZoom); }
function mirRequestSnap(){ clearTimeout(MIR.reqTimer); MIR.reqTimer=setTimeout(()=>ppPost({type:'snap'}), 250); }
function mirSnap(snap){
  const epoch=Date.now(), json=JSON.stringify(snap);
  clearTimeout(MIR.timer); MIR.timer=0; MIR.buf=[];
  MIR.epoch=epoch; MIR.seq=0;
  MIR.chain=MIR.chain.then(async()=>{
    const pk=await packText(json), CH=700000, parts=Math.max(1, Math.ceil(pk.d.length/CH));
    const b=db.batch();
    for(let i=0;i<parts;i++) b.set(STREAM().doc(docKey(epoch,i)), {e:epoch, s:i, kind:'snap', parts, z:pk.z, d:pk.d.slice(i*CH,(i+1)*CH), at:Date.now()});
    await b.commit();
    // pieces that follow are numbered after the snapshot's parts
    if(MIR.epoch===epoch) MIR.seq=parts;
    MIR.vvKey=''; mirOuterZoom();
    mirPrune(epoch).catch(()=>{});
  }).catch(e=>console.error('mirror snapshot', e));
}
function mirQueue(ops){
  if(!MIR.epoch) return;
  MIR.buf.push(...ops);
  if(!MIR.timer) MIR.timer=setTimeout(mirFlush, 110);
}
function mirFlush(){
  MIR.timer=0;
  if(!MIR.epoch || !MIR.buf.length) return;
  const ops=MIR.buf; MIR.buf=[];
  const epoch=MIR.epoch;
  MIR.chain=MIR.chain.then(async()=>{
    if(MIR.epoch!==epoch) return;
    const s=MIR.seq++;
    const pk=await packText(JSON.stringify(ops));
    await STREAM().doc(docKey(epoch,s)).set({e:epoch, s, kind:'ops', z:pk.z, d:pk.d, at:Date.now()});
  }).catch(e=>console.error('mirror ops', e));
}
async function mirPrune(keepFrom){
  const s=await STREAM().get();
  const old=s.docs.filter(d=>(d.data().e||0)<keepFrom);
  for(let i=0;i<old.length;i+=400){ const b=db.batch(); old.slice(i,i+400).forEach(d=>b.delete(d.ref)); await b.commit(); }
}

/* ----- watching (follower) ----- */
const REP={on:false, unsub:null, epoch:0, next:0, docs:new Map(), nodes:new Map(), vw:0, vh:0, scale:1, ox:0, oy:0,
  head:null, scroll:new Map(), raf:0, busy:false, touches:new Map(), cursor:null, waitTimer:0};
const SVGNS='http://www.w3.org/2000/svg';
async function portalHead(){
  if(REP.head!=null) return REP.head;
  try{
    const html=await (await fetch(PORTAL_URL, {cache:'force-cache'})).text();
    const d=new DOMParser().parseFromString(html, 'text/html');
    REP.head=[...d.head.querySelectorAll('meta[charset],style,link[rel="stylesheet"],link[rel="preconnect"]')].map(n=>n.outerHTML).join('');
  }catch(e){ REP.head=''; }
  return REP.head;
}
function repStart(){
  if(REP.on) return;
  REP.on=true; REP.epoch=0; REP.next=0; REP.docs.clear();
  $('mirrorWait').textContent='';
  REP.waitTimer=setTimeout(()=>{ if(REP.on && !REP.epoch) $('mirrorWait').textContent='Connecting to '+((presenterLive()||{}).name||'the presenter')+'…'; }, 600);
  MREF().update({snapReq:Date.now()}).catch(()=>{});
  REP.unsub=STREAM().onSnapshot(snap=>{
    snap.docChanges().forEach(ch=>{ if(ch.type!=='removed'){ const d=ch.doc.data(); REP.docs.set(docKey(d.e,d.s), d); } });
    repProcess();
  }, e=>console.error('stream', e));
}
function repStop(){
  if(!REP.on) return;
  REP.on=false;
  if(REP.unsub){ REP.unsub(); REP.unsub=null; }
  clearTimeout(REP.waitTimer);
  REP.docs.clear(); REP.epoch=0; REP.nodes.clear();
  const g=$('gestures'); if(g) g.innerHTML='';
  REP.touches.clear(); REP.cursor=null; REP.focus=null; REP.vv=[1,0,0];
  const f=$('mirrorFrame'); if(f){ f.removeAttribute('srcdoc'); f.dataset.ready=''; }
}
async function repProcess(){
  if(REP.busy || !REP.on) return;
  REP.busy=true;
  try{
    // the newest complete full copy wins
    let best=0;
    REP.docs.forEach(d=>{ if(d.kind==='snap' && d.e>best){ let ok=true; for(let i=0;i<d.parts;i++) if(!REP.docs.has(docKey(d.e,i))) ok=false; if(ok) best=d.e; } });
    if(best && best>REP.epoch){
      const first=REP.docs.get(docKey(best,0)); let d='';
      for(let i=0;i<first.parts;i++) d+=REP.docs.get(docKey(best,i)).d;
      const snap=JSON.parse(await unpackText(first.z, d));
      await repBuild(snap);
      REP.epoch=best; REP.next=first.parts;
      [...REP.docs.keys()].forEach(k=>{ if(+k.split('_')[0]<best) REP.docs.delete(k); });
      clearTimeout(REP.waitTimer); $('mirrorWait').textContent='';
    }
    if(REP.epoch){
      for(;;){
        const k=docKey(REP.epoch, REP.next), d=REP.docs.get(k);
        if(!d) break;
        REP.docs.delete(k); REP.next++;
        if(d.kind==='ops') repApply(JSON.parse(await unpackText(d.z, d.d)));
      }
    }
  }catch(e){ console.error('mirror', e); }
  REP.busy=false;
  // more may have arrived while this ran
  if(REP.on && [...REP.docs.values()].some(d=>(d.e===REP.epoch && d.s===REP.next) || (d.kind==='snap' && d.e>REP.epoch))) setTimeout(repProcess, 0);
}
function repDoc(){ const f=$('mirrorFrame'); return f && f.contentDocument; }
async function repBuild(snap){
  const f=$('mirrorFrame'); if(!f) return;
  if(f.dataset.ready!=='1'){
    const head=await portalHead();
    await new Promise(res=>{ f.onload=()=>res(); f.srcdoc='<!DOCTYPE html><html><head>'+head+'<style>html,body,*{scroll-behavior:auto!important}</style></head><body></body></html>'; });
    f.dataset.ready='1';
  }
  const doc=f.contentDocument;
  REP.nodes.clear(); REP.scroll.clear();
  syncAttrs(doc.documentElement, snap.html);
  const body=doc.body;
  syncAttrs(body, snap.body.a);
  REP.nodes.set(snap.body.i, body);
  while(body.firstChild) body.removeChild(body.firstChild);
  (snap.body.k||[]).forEach(c=>{ const n=repMake(doc,c); if(n) body.appendChild(n); });
  repAfterBuild(doc.body);
  repViewport(snap.vw, snap.vh);
  doc.scrollingElement.scrollTop=snap.sy[0]; doc.scrollingElement.scrollLeft=snap.sy[1];
  repZoom(snap.vv||[1,0,0]);
  REP.focus=snap.fo||null; repFocusRing();
}
/* Pinch zoom on the presenter's phone zooms the copy here the same way. */
function repZoom(vv){
  REP.vv=vv;
  const z=$('mirrorZoom'); if(!z) return;
  z.style.transition=RM.matches?'':'transform .12s linear';
  z.style.transform=vv[0]===1 && !vv[1] && !vv[2] ? '' : `scale(${vv[0]}) translate(${-vv[1]}px,${-vv[2]}px)`;
}
/* The field the presenter is typing in gets a soft ring. */
function repFocusRing(){
  const layer=$('gestures'); if(!layer) return;
  let ring=layer.querySelector('.gFocus');
  const el=REP.focus ? REP.nodes.get(REP.focus) : null;
  if(!el || !el.isConnected || !el.getBoundingClientRect){ if(ring) ring.remove(); return; }
  const r=el.getBoundingClientRect();
  if(!ring){ ring=document.createElement('div'); ring.className='gFocus'; layer.appendChild(ring); }
  ring.style.left=(r.left-2)+'px'; ring.style.top=(r.top-2)+'px'; ring.style.width=(r.width+4)+'px'; ring.style.height=(r.height+4)+'px';
}
function syncAttrs(el, a){
  if(!el || !a) return;
  [...el.attributes].forEach(at=>{ if(!(at.name in a)) el.removeAttribute(at.name); });
  for(const k in a){ if(el.getAttribute(k)!==a[k]){ try{ el.setAttribute(k, a[k]); }catch(e){} } }
}
function repMake(doc, o){
  if(o.x!=null){ const t=doc.createTextNode(o.x); REP.nodes.set(o.i, t); return t; }
  let el;
  try{ el=o.s ? doc.createElementNS(SVGNS, o.t) : doc.createElement(o.t); }catch(e){ return null; }
  for(const k in o.a){ try{ el.setAttribute(k, o.a[k]); }catch(e){} }
  REP.nodes.set(o.i, el);
  if(o.f!=null){
    el.setAttribute('srcdoc', '<body style="margin:0;display:flex;align-items:center;justify-content:center;height:100vh;font:600 15px system-ui,sans-serif;color:#7a879c;background:#f3f5f9">'+esc(o.f)+'</body>');
    return el;
  }
  (o.k||[]).forEach(c=>{ const n=repMake(doc,c); if(n) el.appendChild(n); });
  if(o.v!=null) el._v=o.v;
  if(o.c!=null) el._c=o.c;
  if(o.sc) el._sc=o.sc;
  return el;
}
function repAfterBuild(root){
  // form values and scroll positions can only be set once nodes are in place
  const walk=n=>{
    if(n._v!=null){ try{ n.value=n._v; }catch(e){} delete n._v; }
    if(n._c!=null){ n.checked=n._c; delete n._c; }
    if(n._sc){ n.scrollTop=n._sc[0]; n.scrollLeft=n._sc[1]; delete n._sc; }
    for(const c of n.children||[]) walk(c);
  };
  walk(root);
}
function repApply(ops){
  const doc=repDoc(); if(!doc) return;
  ops.forEach(op=>{
    if(op.k){
      const [pid, kids]=op.k;
      const parent=REP.nodes.get(pid); if(!parent || parent.nodeType!==1) return;
      while(parent.firstChild) parent.removeChild(parent.firstChild);
      kids.forEach(c=>{ const n=repMake(doc,c); if(n) parent.appendChild(n); });
      repAfterBuild(parent);
    } else if(op.a){
      const el=REP.nodes.get(op.a[0]); if(el && el.nodeType===1) syncAttrs(el, op.a[1]);
    } else if(op.h){
      syncAttrs(doc.documentElement, op.h);
    } else if(op.x){
      const t=REP.nodes.get(op.x[0]); if(t) t.data=op.x[1];
    } else if(op.v){
      const el=REP.nodes.get(op.v[0]); if(el){ try{ el.value=op.v[1]; }catch(e){} el.checked=op.v[2]; }
    } else if(op.sc){
      const [id, t, l]=op.sc;
      const el=id===0 ? doc.scrollingElement : REP.nodes.get(id);
      if(el){ REP.scroll.set(el, [t,l]); repTick(); }
    } else if(op.vp){
      repViewport(op.vp[0], op.vp[1]);
    } else if(op.vv){
      repZoom(op.vv);
    } else if('fo' in op){
      REP.focus=op.fo;
    } else if(op.p){
      gesture(op.p);
    }
  });
  repFocusRing();
}
/* Scrolling glides to where the presenter is rather than jumping. */
function repTick(){ if(!REP.raf) REP.raf=requestAnimationFrame(repFrame); }
function repFrame(){
  REP.raf=0;
  let again=false;
  REP.scroll.forEach((v,el)=>{
    if(!el.isConnected){ REP.scroll.delete(el); return; }
    const dt=v[0]-el.scrollTop, dl=v[1]-el.scrollLeft;
    if(Math.abs(dt)<1 && Math.abs(dl)<1 || RM.matches){ el.scrollTop=v[0]; el.scrollLeft=v[1]; REP.scroll.delete(el); return; }
    el.scrollTop+=dt*0.35; el.scrollLeft+=dl*0.35; again=true;
  });
  if(HL_RENDER_NEEDED()) renderHighlights();
  repFocusRing();
  if(again) repTick();
}
function repViewport(w,h){ REP.vw=w; REP.vh=h; mirFit(); }
/* The presenter's screen is shown at its own size, scaled to fit here. */
function mirFit(){
  const wrap=$('ppMirror'), box=$('mirrorBox'), f=$('mirrorFrame');
  if(!wrap || !box || !REP.vw) return;
  const W=wrap.clientWidth, H=wrap.clientHeight;
  const sc=Math.min(W/REP.vw, H/REP.vh);
  REP.scale=sc; REP.ox=(W-REP.vw*sc)/2; REP.oy=(H-REP.vh*sc)/2;
  box.style.width=REP.vw+'px'; box.style.height=REP.vh+'px';
  box.style.transform=`translate(${REP.ox}px,${REP.oy}px) scale(${sc})`;
  f.style.width=REP.vw+'px'; f.style.height=REP.vh+'px';
  renderHighlights();
}

/* ----- gestures drawn on the follower's screen ----- */
function gesture(p){
  const layer=$('gestures'); if(!layer) return;
  if(p.k==='w'){
    // a mouse wheel or trackpad scroll: a dot that glides the way the page moved
    const w=document.createElement('div'); w.className='gWheel';
    w.style.setProperty('--x', p.x+'px'); w.style.setProperty('--y', p.y+'px');
    w.style.setProperty('--dx', (-(p.dx||0)*36)+'px'); w.style.setProperty('--dy', (-(p.dy||0)*36)+'px');
    layer.appendChild(w); setTimeout(()=>w.remove(), 600);
    return;
  }
  if(p.k==='h'){
    // mouse moving without a click: a small ring follows it
    let c=REP.cursor;
    if(!c){ c=document.createElement('div'); c.className='gCursor'; layer.appendChild(c); REP.cursor=c; }
    c.style.transform=`translate(${p.x}px,${p.y}px)`;
    c.classList.remove('idle'); clearTimeout(c._t); c._t=setTimeout(()=>c.classList.add('idle'), 1600);
    return;
  }
  if(p.k==='d'){
    const t=document.createElement('div'); t.className='gTouch';
    t.innerHTML='<span></span>';
    t.style.transform=`translate(${p.x}px,${p.y}px)`;
    layer.appendChild(t);
    REP.touches.set(p.id, t);
    if(REP.cursor) REP.cursor.classList.add('idle');
  } else if(p.k==='m'){
    const t=REP.touches.get(p.id); if(t) t.style.transform=`translate(${p.x}px,${p.y}px)`;
  } else if(p.k==='u'){
    const t=REP.touches.get(p.id); REP.touches.delete(p.id);
    if(t){ t.style.transform=`translate(${p.x}px,${p.y}px)`; t.classList.add('lift'); setTimeout(()=>t.remove(), 420); }
    if(p.tap) tapGlow(p.tap);
  }
}
function tapGlow(id){
  const el=REP.nodes.get(id), layer=$('gestures');
  if(!el || !el.isConnected || !el.getBoundingClientRect || !layer) return;
  const r=el.getBoundingClientRect();
  if(!r.width && !r.height) return;
  const g=document.createElement('div'); g.className='gTap';
  g.style.left=r.left+'px'; g.style.top=r.top+'px'; g.style.width=r.width+'px'; g.style.height=r.height+'px';
  layer.appendChild(g);
  setTimeout(()=>g.remove(), 1300);
}

/* ----- highlight boxes the presenter draws -----
   Each box remembers the scrolling area it was drawn over and how far that
   area was scrolled, so it moves with the page under it and disappears with
   the pop-up it was drawn on. */
let HL={mode:false, draft:null};
const HL_RENDER_NEEDED=()=>!!(MTG && MTG.hl && MTG.hl.length);
function setHlMode(on){
  HL.mode=!!on;
  const L=$('hlLayer'); if(L) L.classList.toggle('drawing', HL.mode);
  ppRenderBar(); renderHighlights();
}
function clearHighlights(){ MREF().update({hl:[]}).catch(fail); }
function ownScroll(sid){
  try{ const w=PP.frame && PP.frame.contentWindow; return w && w.GH_MIRROR ? w.GH_MIRROR.scrollOf(sid) : null; }catch(e){ return null; }
}
function repScroll(sid){
  const doc=repDoc(); if(!doc) return null;
  const el=sid ? REP.nodes.get(sid) : doc.scrollingElement;
  return (el && el.isConnected) ? [el.scrollTop, el.scrollLeft] : null;
}
function renderHighlights(){
  const L=$('hlLayer'); if(!L) return;
  const list=(MTG && MTG.hl) || [];
  const watching=REP.on && REP.epoch && !$('ppMirror').classList.contains('hidden');
  const mine=iPresent();
  let boxes=[];
  if(mine || watching){
    boxes=list.map(h=>{
      const sc=mine ? ownScroll(h.sid) : repScroll(h.sid);
      if(!sc) return null;
      let x=h.x-(sc[1]-h.sl), y=h.y-(sc[0]-h.st), w=h.w, hh=h.h;
      if(!mine){ x=REP.ox+x*REP.scale; y=REP.oy+y*REP.scale; w*=REP.scale; hh*=REP.scale; }
      return {id:h.id, x, y, w, h:hh};
    }).filter(Boolean);
  }
  if(HL.draft) boxes.push(Object.assign({id:'_draft', draft:true}, HL.draft));
  keyed(L, boxes, b=>b.id, b=>`<div class="hlBox${b.draft?' draft':''}"></div>`, (el,b)=>{
    el.style.transform=`translate(${b.x}px,${b.y}px)`; el.style.width=b.w+'px'; el.style.height=b.h+'px';
    el.onclick = (mine && HL.mode && !b.draft) ? (e)=>{ e.stopPropagation(); MREF().update({hl:(MTG.hl||[]).filter(x=>x.id!==b.id)}).catch(fail); } : null;
  });
  L.classList.toggle('drawing', mine && HL.mode);
}
(function(){
  // drawing highlight boxes over the presenter's own practice copy
  let start=null;
  document.addEventListener('pointerdown', e=>{
    const L=$('hlLayer');
    if(!L || !HL.mode || !iPresent() || e.target!==L) return;
    e.preventDefault();
    const r=L.getBoundingClientRect();
    start={x:e.clientX-r.left, y:e.clientY-r.top, id:e.pointerId};
    L.setPointerCapture(e.pointerId);
    HL.draft={x:start.x, y:start.y, w:0, h:0};
    renderHighlights();
  });
  document.addEventListener('pointermove', e=>{
    if(!start || e.pointerId!==start.id) return;
    const r=$('hlLayer').getBoundingClientRect();
    const x=e.clientX-r.left, y=e.clientY-r.top;
    HL.draft={x:Math.min(x,start.x), y:Math.min(y,start.y), w:Math.abs(x-start.x), h:Math.abs(y-start.y)};
    renderHighlights();
  });
  const end=e=>{
    if(!start || e.pointerId!==start.id) return;
    const d=HL.draft; start=null; HL.draft=null;
    if(d && d.w>10 && d.h>10){
      let a={sid:0, st:0, sl:0};
      try{ a=PP.frame.contentWindow.GH_MIRROR.anchorAt(d.x+d.w/2, d.y+d.h/2); }catch(err){}
      const box={id:uid(), x:Math.round(d.x), y:Math.round(d.y), w:Math.round(d.w), h:Math.round(d.h), sid:a.sid, st:a.st, sl:a.sl};
      MTG.hl=(MTG.hl||[]).concat([box]);
      MREF().update({hl:MTG.hl}).catch(fail);
      ppRenderBar();
    }
    renderHighlights();
  };
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
  // the presenter's boxes follow their own scrolling too
  setInterval(()=>{ if(iPresent() && HL_RENDER_NEEDED() && TAB==='practice') renderHighlights(); }, 120);
})();
/* Wipes the practice jobs for everyone and starts them again from the
   built-in set. Every open practice copy notices and reloads. */
async function resetPractice(){
  if(!await askYesNo('Reset the practice jobs?', 'All practice jobs go back to the starting set for everyone.', 'Reset', true)) return;
  const tref=db.collection('gh_portal').doc('training');
  try{
    const s=await tref.collection('workOrders').get();
    for(let i=0;i<s.docs.length;i+=400){ const b=db.batch(); s.docs.slice(i,i+400).forEach(d=>b.delete(d.ref)); await b.commit(); }
    await tref.set({schema:2, resetAt:Date.now()});
    toast('Practice jobs reset.');
  }catch(e){ fail(e); }
}

boot();
</script>
