<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Good &amp; Handy Meetings</title>
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script>
/* Display settings are shared with the portal on this device. */
(function(){
  try{
    var r=document.documentElement;
    if(localStorage.getItem('gh_dark_mode')==='1') r.classList.add('dark');
    if(localStorage.getItem('gh_high_contrast')==='1') r.classList.add('hc');
    var M=[15,18,21,25,29], D=[14,16,18,21,24];
    var i=M.indexOf(parseInt(localStorage.getItem('gh_text_scale'),10));
    if(i<0) i=M.length-1;
    r.style.setProperty('--mScale', M[i]+'px');
    r.style.setProperty('--dScale', D[i]+'px');
  }catch(e){}
})();
</script>
<style>
/* ---- Colour ----
   Navy and orange come from the logo. Each of the three tools has a colour
   of its own, agenda orange, whiteboard blue and practice red. Like the
   portal's job cards, each tool's colour washes in from one side and fades
   away across its surfaces. */
:root{
  --navy:#0f2647; --navy-2:#1b3f73; --orange:#e8791a;
  --cream:#e9edf3; --paper:#ffffff; --ink:#141f33; --muted:#5f6e87;
  --line:#dbe2ec; --line-soft:#eaeef4; --grid-line:rgba(15,38,71,.045);
  --red:#c0392b; --green:#1f8a55; --blue:#2f6fd6;
  --c-agenda:#e8791a; --c-board:#2f6fd6; --c-practice:#c0392b;
  --on-c:#ffffff;
  --board:#fbfcfe; --board-mark:rgba(47,111,214,.18);
  /* raised and recessed surfaces */
  --raise-hi:rgba(255,255,255,.95); --raise-lo:rgba(15,38,71,.07);
  --raise-sh:0 1px 2px rgba(15,38,71,.08),0 6px 16px rgba(15,38,71,.08);
  --well:#e3e8f0; --well-in:inset 0 2px 5px rgba(15,38,71,.13),inset 0 1px 1px rgba(15,38,71,.08),inset 0 -1px 0 rgba(255,255,255,.85);
  --f-display:'DM Serif Display',Georgia,serif;
  --f-body:'DM Sans',system-ui,-apple-system,sans-serif;
  --radius:14px; --radius-sm:9px;
  --sh-1:0 1px 2px rgba(15,38,71,.06),0 2px 6px rgba(15,38,71,.06);
  --sh-2:0 10px 28px rgba(15,38,71,.16);
  --ease:cubic-bezier(.2,.8,.2,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --tc:var(--c-agenda);
}
html.dark{
  color-scheme:dark;
  --navy:#dbe5f5; --navy-2:#16233a; --orange:#ff9a45;
  --cream:#0e1522; --paper:#161f30; --ink:#e7edf7; --muted:#94a3bb;
  --line:#2b3a54; --line-soft:#1f2c42; --grid-line:rgba(219,229,245,.04);
  --red:#ff8f7d; --green:#4fd48a; --blue:#7aa8ff;
  --c-agenda:#ff9a45; --c-board:#7aa8ff; --c-practice:#ff8f7d;
  --on-c:#0e1522;
  --board:#121b2b; --board-mark:rgba(122,168,255,.18);
  --raise-hi:rgba(255,255,255,.07); --raise-lo:rgba(0,0,0,.35);
  --raise-sh:0 1px 2px rgba(0,0,0,.5),0 8px 18px rgba(0,0,0,.35);
  --well:#0b111c; --well-in:inset 0 2px 6px rgba(0,0,0,.6),inset 0 1px 1px rgba(0,0,0,.4),inset 0 -1px 0 rgba(255,255,255,.05);
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 12px 30px rgba(0,0,0,.55);
}
html.hc{ --line:#0f2647; --muted:#2b3a54; --ink:#000; }
html.dark.hc{ --line:#dbe5f5; --muted:#c9d4e6; --ink:#fff; }
body[data-tab=agenda]{--tc:var(--c-agenda);}
body[data-tab=board]{--tc:var(--c-board);}
body[data-tab=practice]{--tc:var(--c-practice);}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:var(--f-body);color:var(--ink);font-size:var(--dScale,16px);line-height:1.5;
  background-color:var(--cream);
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:24px 24px;min-height:100vh;}
/* The open tool's colour washes down from the top of the page and fades. */
body::before{content:"";position:fixed;left:0;right:0;top:0;height:min(460px,60vh);pointer-events:none;z-index:0;
  background:linear-gradient(180deg,color-mix(in srgb, var(--tc) 16%, transparent),transparent);transition:background .4s;}
@media (max-width:900px){ body{font-size:var(--mScale,18px);} }
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
@media (max-width:900px){ input,select,textarea{font-size:max(16px,1em);} }
.hidden{display:none !important;}
:focus-visible{outline:2.5px solid var(--tc);outline-offset:2px;}

/* ---- top bar, with the tool colours as a stripe under it ---- */
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top));
  background:var(--navy);color:#fff;}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;
  background:linear-gradient(90deg,var(--c-agenda),var(--c-board) 50%,var(--c-practice));}
html.dark header.top{background:#0b1220;color:var(--ink);}
header.top a.back{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.9em;opacity:.92;
  padding:4px 8px 4px 2px;border-radius:8px;transition:background .15s;}
header.top a.back:hover{background:rgba(255,255,255,.1);}
header.top .ttl{flex:1 1 auto;}
header.top .who{font-size:.85em;opacity:.9;white-space:nowrap;}
main{position:relative;max-width:1280px;margin:0 auto;padding:22px 18px 18px;}
@media (max-width:900px){ main{padding:16px 12px 12px;} header.top{padding-left:12px;padding-right:12px;} }

/* ---- buttons, fields ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid var(--navy);background:var(--navy);color:#fff;
  font-weight:700;border-radius:var(--radius-sm);padding:9px 16px;min-height:40px;cursor:pointer;white-space:nowrap;
  transition:transform .12s var(--ease),filter .15s,background-color .15s,border-color .15s,box-shadow .15s;box-shadow:var(--sh-1);}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:scale(.96);}
html.dark .btn{color:var(--paper);}
.btn.tc{background:linear-gradient(135deg,var(--tc),color-mix(in srgb, var(--tc) 75%, #fff));border-color:var(--tc);color:var(--on-c);}
html.dark .btn.tc{background:linear-gradient(135deg,var(--tc),color-mix(in srgb, var(--tc) 70%, #000));}
.btn.secondary{background:var(--paper);color:var(--navy);border-color:var(--line);}
.btn.secondary:hover{border-color:var(--tc);filter:none;}
html.dark .btn.secondary{color:var(--navy);}
.btn.danger{background:color-mix(in srgb, var(--red) 12%, var(--paper));color:var(--red);border-color:var(--red);}
html.dark .btn.danger{color:var(--red);}
.btn.orange{background:linear-gradient(135deg,var(--orange),#f5a04f);border-color:var(--orange);color:#fff;}
html.dark .btn.orange{color:#1a0d00;}
.btn.sm{padding:6px 11px;min-height:34px;font-size:.85em;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.btn .ic,.iconBtn .ic{width:1.05em;height:1.05em;flex:0 0 auto;}
.iconBtn{display:inline-flex;align-items:center;justify-content:center;width:2.1em;height:2.1em;border-radius:var(--radius-sm);
  border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;flex:0 0 auto;transition:background-color .15s,color .15s,transform .12s var(--ease);}
.iconBtn:hover{background:color-mix(in srgb, var(--tc) 12%, transparent);color:var(--tc);}
.iconBtn:active{transform:scale(.9);}
.iconBtn[disabled]{opacity:.3;pointer-events:none;}
input[type=text],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:var(--radius-sm);
  padding:9px 11px;min-height:42px;outline:none;transition:border-color .15s,box-shadow .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--tc);box-shadow:0 0 0 3px color-mix(in srgb, var(--tc) 20%, transparent);}
textarea{resize:vertical;min-height:70px;line-height:1.45;}
input.chk{appearance:none;-webkit-appearance:none;width:1.3em;height:1.3em;margin:0;border:2px solid color-mix(in srgb, var(--tc) 55%, var(--line));
  border-radius:.4em;background:var(--paper);cursor:pointer;flex:0 0 auto;display:grid;place-items:center;
  transition:background-color .18s,border-color .18s,transform .18s var(--ease);}
input.chk::after{content:"";width:.62em;height:.34em;border:solid var(--on-c);border-width:0 0 .16em .16em;transform:translateY(-.06em) rotate(-45deg) scale(0);transition:transform .22s var(--ease-out);}
input.chk:checked{background:var(--tc);border-color:var(--tc);animation:pop .28s var(--ease-out);}
input.chk:checked::after{transform:translateY(-.06em) rotate(-45deg) scale(1);}
input.chk:disabled{cursor:default;opacity:.7;}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.strike{background:linear-gradient(currentColor,currentColor) 0 58%/0 .09em no-repeat;transition:background-size .3s var(--ease),color .3s;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;}
.done .strike{background-size:100% .09em;color:var(--muted);}
.panel{background:linear-gradient(100deg,color-mix(in srgb, var(--tc) 12%, var(--paper)),var(--paper) 60%);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh-1);padding:16px 18px 18px;}
.count{background:color-mix(in srgb, var(--tc) 14%, var(--paper));color:var(--tc);border-radius:999px;padding:0 9px;font-weight:700;font-size:.8em;min-width:1.8em;text-align:center;
  font-variant-numeric:tabular-nums;}
.small{font-size:.82em;color:var(--muted);}
.row{display:flex;gap:8px;align-items:center;}
.grow{flex:1 1 auto;min-width:0;}
.emptyMsg{color:var(--muted);font-size:.9em;padding:6px 2px;}

/* ---- meeting list ---- */
.listHead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 18px;}
.listHead h1{font-family:var(--f-display);font-weight:400;font-size:2.1em;margin:0;color:var(--navy);line-height:1.1;}
.mtgRow{display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,color-mix(in srgb, var(--muted) 10%, var(--paper)),var(--paper) 55%);border:1px solid var(--line);border-left:6px solid var(--line);
  border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;cursor:pointer;box-shadow:var(--sh-1);
  transition:transform .18s var(--ease),box-shadow .18s,border-color .18s;}
.mtgRow:hover{transform:translateY(-2px);box-shadow:var(--sh-2);}
.mtgRow:active{transform:scale(.99);}
.mtgRow.live{border-left-color:var(--orange);background:linear-gradient(90deg,color-mix(in srgb, var(--orange) 18%, var(--paper)),var(--paper) 65%);}
.mtgRow .name{font-family:var(--f-display);font-size:1.25em;color:var(--navy);line-height:1.25;}
.mtgRow .meta{font-size:.82em;color:var(--muted);}
.liveTag{display:inline-flex;align-items:center;gap:6px;background:var(--orange);color:#fff;font-size:.72em;font-weight:700;padding:3px 10px 3px 8px;border-radius:20px;}
html.dark .liveTag{color:#1a0d00;}
.liveTag::before{content:"";width:.5em;height:.5em;border-radius:50%;background:currentColor;animation:breathe 2.4s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
.endedTag{background:var(--line-soft);color:var(--muted);font-size:.72em;font-weight:700;padding:3px 10px;border-radius:20px;}
.sectionLabel{font-size:1em;font-weight:700;color:var(--navy);margin:26px 2px 10px;display:flex;align-items:center;gap:8px;}
.sectionLabel .count{--tc:var(--orange);}

/* ---- meeting screen ---- */
.mtgHead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:14px;}
.mtgHead h1{font-family:var(--f-display);font-weight:400;font-size:1.9em;margin:0;color:var(--navy);line-height:1.15;cursor:text;}
.mtgHead .when{font-size:.85em;color:var(--muted);}
.mtgHead .spacer{flex:1 1 auto;}
.people{display:flex;flex-wrap:wrap;gap:6px;}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid color-mix(in srgb, var(--pc) 45%, var(--line));
  background:linear-gradient(90deg,color-mix(in srgb, var(--pc) 18%, var(--paper)),var(--paper));border-radius:999px;padding:3px 11px 3px 4px;font-size:.8em;font-weight:700;color:var(--navy);
  animation:chipIn .3s var(--ease-out);}
.chip .dot{width:1.7em;height:1.7em;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:.78em;font-weight:700;
  text-transform:uppercase;background:var(--pc);position:relative;}
.chip .dot::after{content:"";position:absolute;right:-1px;bottom:-1px;width:.55em;height:.55em;border-radius:50%;background:#3bd16f;border:2px solid var(--paper);}
@keyframes chipIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.tabs{position:relative;display:flex;gap:6px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none;padding:2px;}
.tabs::-webkit-scrollbar{display:none;}
.tabs button{border:1.5px solid var(--line);background:var(--paper);padding:9px 16px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;
  border-radius:999px;display:inline-flex;align-items:center;gap:8px;position:relative;
  transition:background-color .22s var(--ease),color .22s,border-color .22s,transform .12s var(--ease),box-shadow .22s;}
.tabs button .ic{width:1.15em;height:1.15em;color:var(--c);transition:color .22s;}
.tabs button:hover{border-color:var(--c);color:var(--navy);}
.tabs button:active{transform:scale(.96);}
.tabs button.on{background:linear-gradient(120deg,var(--c),color-mix(in srgb, var(--c) 62%, var(--paper)));border-color:var(--c);color:var(--on-c);box-shadow:0 4px 14px color-mix(in srgb, var(--c) 35%, transparent);}
.tabs button.on .ic{color:var(--on-c);}
.tabs .liveDot{width:.55em;height:.55em;border-radius:50%;background:var(--c-practice);display:inline-block;animation:breathe 1.6s ease-in-out infinite;}
.tabs button.on .liveDot{background:var(--on-c);}
@media (max-width:900px){
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible;}
  .tabs button{border-radius:var(--radius-sm);padding:9px 6px;justify-content:center;font-size:.8em;white-space:normal;text-align:center;line-height:1.2;flex-direction:column;gap:3px;}
}
.pane{animation:paneIn .26s var(--ease-out);}
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- agenda + notes ----
   Agenda items are raised headers. Each one's notes sit under it, indented,
   in a recessed well, with the writer's name on the left. */
.agenda{max-width:980px;}
#agList{display:flex;flex-direction:column;}
.agSec{margin-bottom:18px;}
.agItem{--ib:color-mix(in srgb, var(--tc) 16%, var(--paper));position:relative;display:flex;align-items:center;gap:12px;padding:13px 14px 13px 16px;border-radius:var(--radius);
  background:linear-gradient(90deg,var(--ib),var(--paper) 72%);border:1px solid color-mix(in srgb, var(--tc) 22%, var(--line));
  box-shadow:inset 0 1px 0 var(--raise-hi),inset 0 -1px 0 var(--raise-lo),var(--raise-sh);
  transition:box-shadow .25s var(--ease),border-color .25s var(--ease),transform .2s var(--ease);}
.agItem.current{--ib:color-mix(in srgb, var(--tc) 30%, var(--paper));border-color:var(--tc);
  box-shadow:inset 0 1px 0 var(--raise-hi),inset 0 -1px 0 var(--raise-lo),var(--raise-sh),0 0 0 3px color-mix(in srgb, var(--tc) 20%, transparent);}
.agItem .txt{flex:1 1 auto;min-width:0;cursor:pointer;overflow-wrap:anywhere;font-size:1.32em;font-weight:700;line-height:1.25;color:var(--navy);letter-spacing:-.005em;}
.agItem.general .txt{cursor:default;}
.agItem .nc{font-size:.8em;font-weight:700;color:var(--tc);white-space:nowrap;}
@media (max-width:900px){ .agItem .txt{font-size:1.1em;overflow-wrap:break-word;} .agItem .nc{display:none;} .agItem{padding:11px 12px;gap:10px;} }
.agItem .tools{display:flex;opacity:0;pointer-events:none;transition:opacity .18s;}
.agItem:hover .tools,.agItem:focus-within .tools{opacity:1;pointer-events:auto;}
@media (max-width:900px), (hover:none){
  .agItem{flex-wrap:wrap;}
  .agItem .txt{flex:1 1 0;}
  .agItem .tools{display:none;flex:0 0 100%;justify-content:flex-end;opacity:1;pointer-events:auto;margin:-4px -6px -6px 0;}
  .agItem.current .tools{display:flex;}
}
.well{margin:10px 0 0 2.4em;border-radius:12px;background:linear-gradient(90deg,color-mix(in srgb, var(--tc) 8%, var(--well)),var(--well) 70%);box-shadow:var(--well-in);padding:6px 14px 10px;}
@media (max-width:900px){ .well{margin-left:1.1em;padding:4px 10px 8px;} }
.notes{display:flex;flex-direction:column;}
.note{display:grid;grid-template-columns:minmax(4.5em,max-content) 1fr auto;column-gap:14px;align-items:baseline;padding:9px 2px;border-bottom:1px solid color-mix(in srgb, var(--line) 70%, transparent);}
.note:last-child{border-bottom:0;}
.note .who{font-weight:700;color:var(--pc);font-size:.86em;white-space:nowrap;}
.note .body{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0;}
.note .tm{display:block;font-size:.72em;color:var(--muted);font-weight:500;margin-top:1px;}
.note .tools{display:flex;opacity:0;transition:opacity .15s;}
.note:hover .tools,.note:focus-within .tools{opacity:1;}
@media (hover:none){ .note .tools{opacity:1;} }
@media (max-width:560px){ .note{grid-template-columns:1fr auto;} .note .who{grid-column:1/-1;} }
.note.editing{grid-template-columns:1fr;}
.note textarea{background:var(--paper);}
.compose{display:flex;gap:8px;align-items:flex-end;padding-top:8px;}
.compose textarea{min-height:42px;height:42px;resize:none;background:color-mix(in srgb, var(--paper) 70%, var(--well));box-shadow:inset 0 1px 3px rgba(15,38,71,.08);overflow:hidden;}
.addAgenda{display:flex;gap:8px;margin-top:4px;max-width:980px;}
.addAgenda input{font-size:1.1em;font-weight:700;border-radius:var(--radius);min-height:50px;
  background:linear-gradient(90deg,color-mix(in srgb, var(--tc) 8%, var(--paper)),var(--paper) 70%);box-shadow:inset 0 1px 0 var(--raise-hi),var(--sh-1);}
.addAgenda .btn{min-height:50px;border-radius:var(--radius);}

/* ---- whiteboard ---- */
.wbWrap{position:relative;}
.wbBar{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-bottom:10px;
  background:linear-gradient(90deg,color-mix(in srgb, var(--c-board) 14%, var(--paper)),var(--paper) 55%);border:1px solid var(--line);
  border-radius:16px;padding:6px;box-shadow:inset 0 1px 0 var(--raise-hi),var(--raise-sh);}
.wbBar .sep{width:1px;height:1.9em;background:var(--line);margin:0 3px;flex:0 0 auto;}
@media (max-width:900px){
  .wbBar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;font-size:.78em;border-radius:14px;}
  .wbBar::-webkit-scrollbar{display:none;}
  .wbBar .grow{display:none;}
  .menuPop{position:fixed;right:10px;top:auto;margin-top:6px;}
}
.tool{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:2.35em;height:2.35em;padding:0 6px;border-radius:11px;flex:0 0 auto;
  border:1.5px solid transparent;background:transparent;color:var(--navy);cursor:pointer;font-weight:700;font-size:.85em;
  transition:background-color .18s,border-color .18s,transform .12s var(--ease),color .18s,box-shadow .18s;}
.tool:hover{background:color-mix(in srgb, var(--c-board) 12%, transparent);}
.tool:active{transform:scale(.9);}
.tool.on{background:linear-gradient(135deg,var(--c-board),color-mix(in srgb, var(--c-board) 70%, #fff));color:var(--on-c);box-shadow:0 3px 10px color-mix(in srgb, var(--c-board) 35%, transparent);}
.tool .ic{width:1.3em;height:1.3em;}
.tool[disabled]{opacity:.35;pointer-events:none;}
.swatch{width:1.85em;height:1.85em;border-radius:50%;border:2.5px solid var(--paper);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0;
  transition:transform .18s var(--ease),box-shadow .18s;flex:0 0 auto;}
.swatch:hover{transform:scale(1.1);}
.swatch.on{box-shadow:0 0 0 2.5px var(--navy);transform:scale(1.12);}
.sizeDot{border-radius:50%;background:currentColor;display:inline-block;}
.menuPop{position:absolute;right:6px;top:calc(100% + 6px);z-index:30;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-2);
  padding:8px;min-width:220px;animation:modalIn .2s var(--ease-out);}
.menuPop .mi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--navy);text-align:left;}
.menuPop .mi:hover{background:color-mix(in srgb, var(--c-board) 10%, transparent);}
.menuPop .mi .ic{width:1.2em;height:1.2em;color:var(--c-board);}
.menuPop .seg{display:flex;gap:4px;padding:4px 6px 8px;}
.menuPop .seg button{flex:1;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 4px;font-weight:700;font-size:.8em;cursor:pointer;color:var(--navy);}
.menuPop .seg button.on{border-color:var(--c-board);background:color-mix(in srgb, var(--c-board) 12%, var(--paper));color:var(--c-board);}
.menuPop .lbl{font-size:.78em;font-weight:700;color:var(--muted);padding:6px 10px 2px;}
.board{position:relative;width:100%;height:560px;background-color:var(--board);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:inset 0 1px 0 var(--raise-hi),var(--sh-1);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;}
.board.bg-dots{background-image:radial-gradient(var(--board-mark) 1.3px, transparent 1.5px);}
.board.bg-grid{background-image:linear-gradient(var(--board-mark) 1px,transparent 1px),linear-gradient(90deg,var(--board-mark) 1px,transparent 1px);}
.board canvas{position:absolute;inset:0;width:100%;height:100%;}
.board.t-pen,.board.t-marker,.board.t-shape,.board.t-laser{cursor:crosshair;}
.board.t-eraser{cursor:none;} .board.t-sticky{cursor:copy;} .board.t-text{cursor:text;}
.board.t-hand,.board.panning{cursor:grab;} .board.panning{cursor:grabbing;}
.board.t-select{cursor:default;} .board.t-select.overItem{cursor:move;}
.stickyLayer,.cursorLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.stk{--rot:0deg;position:absolute;left:0;top:0;width:150px;pointer-events:auto;border-radius:4px 4px 12px 4px;transform-origin:0 0;
  box-shadow:0 2px 3px rgba(0,0,0,.12),0 8px 18px rgba(0,0,0,.14);display:flex;flex-direction:column;color:#1d1a00;
  background-image:linear-gradient(170deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%);
  transition:box-shadow .2s,background-color .2s;}
.stk .in{display:flex;flex-direction:column;transform:rotate(var(--rot));transform-origin:50% 50%;border-radius:inherit;background:inherit;box-shadow:inherit;
  animation:stkIn .34s var(--ease-out);transition:transform .2s var(--ease);}
.stk{background:none;box-shadow:none;}
.stk.dragging .in{transform:rotate(0deg) scale(1.04);box-shadow:0 6px 10px rgba(0,0,0,.14),0 22px 40px rgba(0,0,0,.24);}
.stk.dragging{z-index:5;}
.stk.glide{transition:transform .32s var(--ease);}
.stk.leaving .in{animation:stkOut .22s var(--ease) forwards;pointer-events:none;}
@keyframes stkIn{from{opacity:0;transform:translateY(8px) rotate(var(--rot)) scale(.6)}to{opacity:1}}
@keyframes stkOut{to{opacity:0;transform:rotate(var(--rot)) scale(.6)}}
.stk .grip{height:22px;cursor:grab;display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 9px;font-size:10px;font-weight:700;
  color:rgba(0,0,0,.5);touch-action:none;}
.stk.dragging .grip{cursor:grabbing;}
.stk .grip button{border:0;background:transparent;color:rgba(0,0,0,.5);cursor:pointer;font-size:17px;line-height:1;padding:0 4px;border-radius:6px;}
.stk .grip button:hover{background:rgba(0,0,0,.08);}
.stk textarea{border:0;background:transparent;resize:none;min-height:88px;padding:2px 10px 10px;font-size:14px;line-height:1.35;color:#1d1a00;box-shadow:none;font-weight:500;}
.stk textarea:focus{outline:none;box-shadow:none;}
.board.readonly .stk .grip{cursor:default;}
.textEdit{position:absolute;left:0;top:0;z-index:6;transform-origin:0 0;border:1.5px dashed var(--c-board);border-radius:6px;background:color-mix(in srgb, var(--board) 85%, transparent);
  font-weight:600;line-height:1.25;padding:2px 4px;min-width:60px;min-height:0;resize:none;overflow:hidden;white-space:pre;box-shadow:none;}
.cur{position:absolute;left:0;top:0;transition:transform .12s linear, opacity .5s;pointer-events:none;}
.cur svg{width:18px;height:18px;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3));}
.cur span{position:absolute;left:14px;top:14px;background:var(--pc);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap;}
.cur.idle{opacity:0;}
.zoomBox{position:absolute;right:10px;bottom:10px;z-index:7;display:flex;align-items:center;gap:2px;background:color-mix(in srgb, var(--paper) 92%, transparent);
  border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:var(--sh-1);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.zoomBox button{border:0;background:transparent;color:var(--navy);font-weight:700;min-width:2.1em;height:2.1em;border-radius:9px;cursor:pointer;font-size:.85em;font-variant-numeric:tabular-nums;}
.zoomBox button:hover{background:color-mix(in srgb, var(--c-board) 12%, transparent);}
.zoomBox .ic{width:1.15em;height:1.15em;vertical-align:middle;}
.selBar{position:absolute;z-index:8;display:flex;gap:4px;padding:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-2);
  transform:translate(-50%,-100%);animation:modalIn .18s var(--ease-out);}
.selBar .swatch{width:1.5em;height:1.5em;}
body.wbFull{overflow:hidden;}
body.wbFull .wbWrap{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:var(--cream);padding:max(8px,env(safe-area-inset-top)) 8px 8px;animation:paneIn .26s var(--ease-out);}
body.wbFull .board{flex:1 1 auto;height:auto !important;}
body.wbFull .wbBar{margin-bottom:8px;}
body.wbTab:not(.wbFull){overscroll-behavior:none;}

/* ---- practice portal ---- */
.ppBar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px;padding:6px 8px;border-radius:14px;
  background:linear-gradient(90deg,color-mix(in srgb, var(--tc) 14%, var(--paper)),transparent 70%);}
.ppBar .status{font-size:.88em;font-weight:700;color:var(--tc);display:inline-flex;align-items:center;gap:8px;}
.ppBar .status .ic{width:1.15em;height:1.15em;}
.ppFrameWrap{position:relative;border:1px solid var(--line);border-top:4px solid var(--tc);border-radius:var(--radius);overflow:hidden;box-shadow:var(--sh-1);background:var(--paper);
  height:520px;min-height:360px;overscroll-behavior:contain;}
.ppFrameWrap iframe{width:1px;min-width:100%;max-width:100%;height:100%;border:0;display:block;}
body.ppTab{overflow-x:hidden;}
.ppFrameWrap iframe.ppOwn.behind{visibility:hidden;}
.ppExitBtn{display:none !important;}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:.85em;font-weight:700;color:var(--navy);white-space:nowrap;}
body.ppFull{overflow:hidden;}
body.ppFull .ppStage{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:var(--cream);
  padding:max(6px,env(safe-area-inset-top)) 8px 0 8px;animation:paneIn .26s var(--ease-out);}
body.ppFull .ppBar{margin:0 0 4px;flex:0 0 auto;}
body.ppFull .ppFrameWrap{flex:1 1 auto;height:auto !important;min-height:0;border-radius:var(--radius) var(--radius) 0 0;border-bottom:0;}
body.ppFull .ppExitBtn{display:inline-flex !important;}
body.ppFull .ppFullBtn{display:none;}
body.ppTab:not(.ppFull){overscroll-behavior:none;}
@media (max-width:900px){ body.ppFull .ppLbl{display:none;} body.ppFull .ppBar{font-size:.8em;gap:6px;} }
/* the presenter's screen, live */
.mirror{position:absolute;inset:0;background:color-mix(in srgb, var(--tc) 6%, var(--cream));overflow:hidden;z-index:2;}
.mirrorBox{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 0 0 1px var(--line),var(--sh-2);background:var(--paper);overflow:hidden;}
.mirrorZoom{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;}
.mirrorZoom iframe{position:absolute;inset:0;border:0;display:block;pointer-events:none;background:var(--paper);}
.mirrorWait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;pointer-events:none;}
.mirrorWait:empty{display:none;}
.gestures{position:absolute;inset:0;pointer-events:none;overflow:visible;}
.gTouch{position:absolute;left:0;top:0;width:0;height:0;transition:transform 70ms linear;}
.gTouch span{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle, rgba(70,78,92,.30) 0 55%, rgba(70,78,92,.16) 70%, rgba(70,78,92,0) 72%);
  box-shadow:0 0 0 1.5px rgba(70,78,92,.28);animation:gDown .16s var(--ease-out) both;}
.gTouch.lift span{animation:gUp .4s var(--ease) forwards;}
@keyframes gDown{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes gUp{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.35)}}
.gWheel{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;background:rgba(70,78,92,.22);box-shadow:0 0 0 1.5px rgba(70,78,92,.3);
  animation:gWheel .55s var(--ease) forwards;}
@keyframes gWheel{0%{opacity:0;transform:translate(var(--x),var(--y)) scale(.7)}25%{opacity:1}100%{opacity:0;transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) scale(1)}}
.gCursor{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:rgba(70,78,92,.22);box-shadow:0 0 0 1.5px rgba(70,78,92,.35);
  transition:transform 90ms linear, opacity .4s;}
.gCursor.idle{opacity:0;}
.gTap{position:absolute;border-radius:8px;background:rgba(47,111,214,.14);box-shadow:0 0 0 2px rgba(47,111,214,.55);
  animation:gTap 1.25s var(--ease) forwards;}
@keyframes gTap{0%{opacity:0;transform:scale(.98)}12%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0}}
.gFocus{position:absolute;border-radius:8px;box-shadow:0 0 0 2.5px rgba(232,121,26,.75),0 0 14px rgba(232,121,26,.35);transition:all .15s var(--ease);}
.hlLayer{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden;}
.hlLayer.drawing{pointer-events:auto;cursor:crosshair;background:rgba(255,214,0,.04);}
.hlBox{position:absolute;left:0;top:0;border-radius:8px;background:rgba(255,212,0,.24);box-shadow:0 0 0 2.5px rgba(242,178,0,.9),0 0 18px rgba(255,200,0,.35);}
.hlLayer.drawing .hlBox:not(.draft){cursor:pointer;}
.hlBox.draft{background:rgba(255,212,0,.16);box-shadow:0 0 0 2px rgba(242,178,0,.7);}

/* ---- modal + toast ---- */
.overlay{position:fixed;inset:0;background:rgba(10,18,32,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;
  animation:fadeIn .18s ease-out;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);}
.modal{background:linear-gradient(160deg,color-mix(in srgb, var(--tc) 10%, var(--paper)),var(--paper) 50%);border-radius:var(--radius);box-shadow:var(--sh-2);width:100%;max-width:440px;padding:20px;border-top:5px solid var(--tc);
  animation:modalIn .28s var(--ease-out);}
.modal h2{font-family:var(--f-display);font-weight:400;margin:0 0 12px;color:var(--navy);font-size:1.45em;}
.modal .msg{margin:0 0 14px;white-space:pre-wrap;}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;
  padding:11px 18px;border-radius:999px;box-shadow:var(--sh-2);z-index:90;font-weight:600;font-size:.9em;max-width:calc(100vw - 32px);
  animation:toastIn .3s var(--ease-out);border-left:5px solid var(--tc);}
.toast.out{transition:opacity .25s,transform .25s;opacity:0;transform:translate(-50%,8px);}
html.dark .toast{color:var(--paper);}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.gate{max-width:460px;margin:60px auto;text-align:center;}
.gate h1{font-family:var(--f-display);font-weight:400;color:var(--navy);}
.gate .err{font-size:.8em;color:var(--red);margin-top:10px;overflow-wrap:anywhere;}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}

<script>
'use strict';
/* =========================================================================
   MEETINGS
   A live workspace for in-person meetings: an agenda with shared notes, a
   whiteboard, and the practice copy of the portal. Every device in the
   meeting sees the same thing as it changes. It runs on the portal's
   Firebase project and sign-in, which this page shares because both sites
   live at the same address.

   Firestore layout, all under gh_portal/meetings/items/{meetingId}:
     the meeting itself  {title, createdAt, createdBy, status, presenter, hl, followLock, bg, currentAgenda}
     agenda/{id}         {text, order, done}
     notes/{id}          {text, agendaId, by, byName, at}
     strokes/{id}        {v:2, pts:[x,y,pressure,...], color, size, tool, by, at}
     shapes/{id}         {kind, x1, y1, x2, y2, color, size, by, at}
     texts/{id}          {x, y, text, color, size, by, at}
     stickies/{id}       {v:2, x, y, text, color, by, at}
     presence/{uid}      {name, at, ink, laser, cur}
     stream/{id}         the presenter's screen, while someone presents
   Whiteboard items are stored in board units. The first whiteboards stored
   positions as fractions of a 16:10 board; those are read as 1000 x 625.
========================================================================= */

/* ---------- lists that move smoothly ----------
   Lists are updated item by item instead of being redrawn. Items that move
   glide to their new place, new ones fade in, and removed ones fold away, so
   a change made on another device is easy to follow rather than a jump. */
function keyed(container, items, key, make, patch){
  if(!container) return;
  const animate=!RM.matches && container._ready;
  const old=new Map();
  [...container.children].forEach(el=>{ if(el.dataset.k && !el._leaving) old.set(el.dataset.k, el); else if(!el._leaving) el.remove(); });
  const first=new Map();
  if(animate) old.forEach((el,k)=>first.set(k, el.getBoundingClientRect()));
  const seen=new Set(), added=[];
  let prev=null;
  items.forEach((it,i)=>{
    const k=String(key(it)); seen.add(k);
    let el=old.get(k);
    if(!el){
      const t=document.createElement('template'); t.innerHTML=make(it,i).trim();
      el=t.content.firstElementChild; el.dataset.k=k; added.push(el);
    }
    if(patch) patch(el, it, i, items.length);
    const want=prev ? prev.nextSibling : container.firstChild;
    if(want!==el) container.insertBefore(el, want);
    prev=el;
  });
  old.forEach((el,k)=>{ if(!seen.has(k)) leave(el, animate); });
  container._ready=true;
  if(!animate) return;
  old.forEach((el,k)=>{
    if(!seen.has(k)) return;
    const a=first.get(k), b=el.getBoundingClientRect();
    const dx=a.left-b.left, dy=a.top-b.top;
    if(Math.abs(dx)>.5 || Math.abs(dy)>.5) el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}], {duration:320, easing:EASE});
  });
  added.forEach(el=>el.animate([{opacity:0, transform:'translateY(8px) scale(.98)'},{opacity:1, transform:'none'}], {duration:280, easing:EASE}));
}
function leave(el, animate){
  if(!animate){ el.remove(); return; }
  el._leaving=true;
  const h=el.offsetHeight, cs=getComputedStyle(el);
  el.style.overflow='hidden';
  el.animate([{opacity:1, height:h+'px', paddingTop:cs.paddingTop, paddingBottom:cs.paddingBottom},
              {opacity:0, height:'0px', paddingTop:'0px', paddingBottom:'0px', marginTop:'0px', marginBottom:'0px'}],
             {duration:240, easing:EASE}).onfinish=()=>el.remove();
}
function emptyState(container, show, text){
  if(!container) return;
  let e=container.parentNode.querySelector(`[data-empty-for="${container.id}"]`);
  if(show && !e){ e=document.createElement('div'); e.className='emptyMsg'; e.dataset.emptyFor=container.id; e.textContent=text; container.after(e); }
  if(!show && e) e.remove();
}

/* ---------- start-up: same Firebase project and sign-in as the portal ---------- */
function boot(){
  let cfg=null;
  try{ cfg=JSON.parse(localStorage.getItem(CFG_KEY)||'null'); }catch(e){}
  if(!cfg || typeof firebase==='undefined'){ gate('This device is not connected to the portal.'); return; }
  try{
    if(!cfg.storageBucket && cfg.projectId) cfg.storageBucket=cfg.projectId+'.appspot.com';
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    db=firebase.firestore();
  }catch(e){ gate('Meetings could not connect.', e && (e.message||e.code)); return; }
  try{ USERS=(JSON.parse(localStorage.getItem(PORTAL_DB_KEY)||'{}')||{}).users||{}; }catch(e){ USERS={}; }
  firebase.auth().onAuthStateChanged(user=>{
    if(!user){ ME=null; stopAll(); gate('Sign in to the portal on this device first.'); return; }
    const rec=Object.values(USERS).find(u=>u.uid===user.uid);
    ME={uid:user.uid, name:rec ? rec.username : (user.email||'').split('@')[0], isAdmin:!!(rec && rec.isAdmin)};
    showMe();
    // The portal's user list, for names and colours.
    db.collection('gh_portal').doc('main').get().then(s=>{
      const raw=s.exists && s.data().meta;
      if(!raw) return;
      try{
        const u=JSON.parse(raw).users||{};
        if(Object.keys(u).length){ USERS=u; const r=Object.values(u).find(x=>x.uid===ME.uid); if(r){ ME.name=r.username; ME.isAdmin=!!r.isAdmin; showMe(); } if(MTG) render(); }
      }catch(e){}
    }).catch(()=>{});
    route();
  });
  window.addEventListener('hashchange', route);
}
function showMe(){ $('whoami').textContent=ME.name; }
function stopAll(){ leaveMeeting(); if(LIST_UNSUB){ LIST_UNSUB(); LIST_UNSUB=null; } }
function route(){
  if(!ME) return;
  const m=location.hash.match(/^#m=([\w-]+)/);
  if(m){ openMeeting(m[1]); } else { leaveMeeting(); showList(); }
}

/* ---------- meeting list ---------- */
function showList(){
  $('backLink').href='index.html'; $('backText').textContent='Dashboard';
  $('backLink').onclick=null;
  document.body.dataset.tab='agenda';
  document.title='Good & Handy Meetings';
  $('main').innerHTML=`<div class="listHead"><h1>Meetings</h1><button class="btn orange" onclick="newMeeting()">${icon('plus')}New Meeting</button></div>
    <div id="liveWrap"><div class="sectionLabel">Live <span class="count" id="liveCount">0</span></div><div id="liveList"></div></div>
    <div class="sectionLabel">Past Meetings <span class="count" id="pastCount">0</span></div><div id="pastList"></div>`;
  renderList();
  if(LIST_UNSUB) return;
  LIST_UNSUB=ROOT().onSnapshot(snap=>{
    MEETINGS=snap.docs.map(d=>Object.assign({id:d.id}, d.data())).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    if(!MTG_ID) renderList();
  }, e=>{ console.error(e); if(!MTG_ID) gate('Meetings could not connect.', e && (e.code||e.message)); });
}
function renderList(){
  if(!$('liveList')) return;
  const live=MEETINGS.filter(m=>m.status!=='ended'), past=MEETINGS.filter(m=>m.status==='ended');
  const make=m=>`<div class="mtgRow" onclick="location.hash='m=${m.id}'"><div class="grow"><div class="name"></div><div class="meta"></div></div><span class="tag"></span></div>`;
  const patch=(el,m)=>{
    el.classList.toggle('live', m.status!=='ended');
    el.querySelector('.name').textContent=m.title||'Meeting';
    el.querySelector('.meta').textContent=fmtDate(m.createdAt||Date.now())+', '+fmtTime(m.createdAt||Date.now())+(m.createdByName?', '+m.createdByName:'');
    const t=el.querySelector('.tag'); t.className='tag '+(m.status!=='ended'?'liveTag':'endedTag'); t.textContent=m.status!=='ended'?'Live':'Ended';
  };
  $('liveWrap').classList.toggle('hidden', !live.length);
  $('liveCount').textContent=live.length; $('pastCount').textContent=past.length;
  keyed($('liveList'), live, m=>m.id, make, patch);
  keyed($('pastList'), past, m=>m.id, make, patch);
  emptyState($('pastList'), !past.length, 'No past meetings.');
}
async function newMeeting(){
  const d=new Date();
  const title=await askText('New Meeting', 'Meeting, '+d.toLocaleDateString([], {month:'short', day:'numeric'}), 'Start');
  if(title===null) return;
  const ref=ROOT().doc();
  try{
    await ref.set({title:title||'Meeting', createdAt:Date.now(), createdBy:ME.uid, createdByName:ME.name, status:'live', presenter:null, hl:[], followLock:false, bg:'dots', currentAgenda:null});
    location.hash='m='+ref.id;
  }catch(e){ fail(e); }
}

/* ---------- opening a meeting ---------- */
function openMeeting(id){
  if(MTG_ID===id) return;
  leaveMeeting();
  MTG_ID=id; MTG=null;
  DATA=emptyData();
  try{ TAB=sessionStorage.getItem('gh_mtg_tab_'+id)||'agenda'; }catch(e){ TAB='agenda'; }
  if(!['agenda','board','practice'].includes(TAB)) TAB='agenda';
  $('backLink').href='#'; $('backText').textContent='Meetings';
  $('backLink').onclick=e=>{ e.preventDefault(); location.hash=''; };
  $('main').innerHTML='<div class="small" style="padding:20px">Loading…</div>';
  MTG_UNSUBS.push(MREF().onSnapshot(s=>{
    if(!s.exists){ if(MTG){ toast('This meeting was deleted.'); } location.hash=''; return; }
    const prev=MTG;
    MTG=Object.assign({id:s.id}, s.data());
    document.title=(MTG.title||'Meeting')+', Good & Handy';
    if(!prev) render(); else onMeetingChange(prev);
  }, e=>{ console.error(e); gate('This meeting could not load.', e && (e.code||e.message)); }));
  SUBS.forEach(n=>{
    MTG_UNSUBS.push(SUB(n).onSnapshot(s=>{
      DATA[n]=s.docs.map(d=>Object.assign({id:d.id}, d.data()));
      if(MTG) onDataChange(n);
    }, e=>console.error(n, e)));
  });
  startPresence();
}
function leaveMeeting(){
  MTG_UNSUBS.forEach(u=>{ try{ u(); }catch(e){} }); MTG_UNSUBS=[];
  stopPresence();
  if(MTG_ID && db && ME){ try{ SUB('presence').doc(ME.uid).delete().catch(()=>{}); }catch(e){} }
  ppTeardown();
  wbTeardown();
  MTG=null; MTG_ID=null;
  document.body.classList.remove('ppFull','ppTab','wbFull','wbTab');
}
function startPresence(){
  stopPresence();
  const beat=()=>{ if(MTG_ID && ME) SUB('presence').doc(ME.uid).set({name:ME.name, at:Date.now()}, {merge:true}).catch(()=>{}); };
  beat();
  presenceTimer=setInterval(beat, PRESENCE_MS);
}
function stopPresence(){ clearInterval(presenceTimer); presenceTimer=null; }
window.addEventListener('pagehide', ()=>{ if(MTG_ID && ME && db){ try{ SUB('presence').doc(ME.uid).delete(); }catch(e){} } });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && MTG_ID) startPresence(); });
function livePeople(){
  const now=Date.now();
  return DATA.presence.filter(p=>p.id===ME.uid || (now-(p.at||0))<ALIVE_MS).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
}
/* Fast-changing things (a line being drawn, the laser, cursors) go out
   through one write at a time, always the newest, so a slow connection
   never builds up a backlog. */
const LIVE={busy:false, pending:null};
function liveSend(fields){
  if(!MTG_ID || !ME) return;
  LIVE.pending=Object.assign(LIVE.pending||{}, fields);
  if(!LIVE.busy) liveFlush();
}
function liveFlush(){
  if(!LIVE.pending || !MTG_ID) return;
  const f=LIVE.pending; LIVE.pending=null; LIVE.busy=true;
  f.at=Date.now(); f.name=ME.name;
  SUB('presence').doc(ME.uid).set(f, {merge:true}).catch(()=>{}).then(()=>setTimeout(()=>{ LIVE.busy=false; if(LIVE.pending) liveFlush(); }, 50));
}

/* ---------- meeting screen ---------- */
const TABS=[['agenda','list','Agenda & Notes'],['board','board','Whiteboard'],['practice','portal','Practice Portal']];
function render(){
  if(!MTG) return;
  const ro=readOnly();
  $('main').innerHTML=`
    <div class="mtgHead">
      <div><h1 id="mtgTitle" title="Rename">${esc(MTG.title||'Meeting')}</h1>
      <div class="when">${fmtDate(MTG.createdAt||Date.now())}, ${fmtTime(MTG.createdAt||Date.now())}</div></div>
      <div class="spacer"></div>
      <div class="people" id="people"></div>
      ${ro?`<button class="btn secondary sm" onclick="setStatus('live')">Reopen</button>`
          :`<button class="btn secondary sm" onclick="endMeeting()">End Meeting</button>`}
      ${(ME.isAdmin || MTG.createdBy===ME.uid)?`<button class="iconBtn" title="Delete meeting" aria-label="Delete meeting" onclick="deleteMeeting()">${icon('trash')}</button>`:''}
    </div>
    <div class="tabs" id="tabs">${TABS.map(([k,ic,l])=>`<button data-k="${k}" style="--c:var(--c-${k})" onclick="showTab('${k}')">${icon(ic)}<span>${l}</span><span class="liveDot hidden"></span></button>`).join('')}</div>
    <section id="pane-agenda" class="pane"></section>
    <section id="pane-board" class="pane"></section>
    <section id="pane-practice" class="pane"></section>`;
  $('mtgTitle').onclick=renameMeeting;
  renderPeople();
  renderAgendaPane(); renderBoardPane(); renderPracticePane();
  showTab(TAB, true);
}
function renderTabs(){
  const presenting=!!presenterLive();
  document.querySelectorAll('#tabs button').forEach(b=>{
    b.classList.toggle('on', b.dataset.k===TAB);
    const d=b.querySelector('.liveDot'); if(d) d.classList.toggle('hidden', !(b.dataset.k==='practice' && presenting));
  });
}
function showTab(k, initial){
  const changed=k!==TAB;
  TAB=k;
  try{ sessionStorage.setItem('gh_mtg_tab_'+MTG_ID, k); }catch(e){}
  document.body.dataset.tab=k;
  document.querySelectorAll('.pane').forEach(p=>{
    const show=p.id==='pane-'+k;
    if(show && (changed || initial)){ p.classList.remove('hidden'); p.style.animation='none'; void p.offsetWidth; p.style.animation=''; }
    else p.classList.toggle('hidden', !show);
  });
  renderTabs();
  document.body.classList.toggle('wbTab', k==='board');
  if(k!=='board') document.body.classList.remove('wbFull');
  if(k==='board'){
    if(phoneMQ.matches){ document.body.classList.add('wbFull'); renderWbBar(); }
    window.scrollTo(0,0); requestAnimationFrame(()=>{ wbFit(); });
  }
  document.body.classList.toggle('ppTab', k==='practice');
  if(k==='practice'){
    ppEnsure();
    if(phoneMQ.matches) ppSetFull(true);
    else { window.scrollTo(0,0); requestAnimationFrame(()=>{ ppFit(); mirFit(); }); }
  } else {
    if(k!=='board') PP_BACK=k;
    document.body.classList.remove('ppFull');
  }
}
function renderPeople(){
  const el=$('people'); if(!el) return;
  keyed(el, livePeople(), p=>p.id,
    p=>`<span class="chip" style="--pc:${colorFor(p.name)}"><span class="dot"></span><span class="nm"></span></span>`,
    (c,p)=>{ c.classList.toggle('me', p.id===ME.uid); c.querySelector('.dot').textContent=String(p.name||'?').slice(0,1); c.querySelector('.nm').textContent=p.name; });
}
function onMeetingChange(prev){
  if(prev.status!==MTG.status){ render(); return; }
  if(prev.title!==MTG.title){ const t=$('mtgTitle'); if(t) t.textContent=MTG.title||'Meeting'; }
  if(prev.currentAgenda!==MTG.currentAgenda) renderAgenda();
  if(prev.bg!==MTG.bg){ wbApplyBg(); wbRenderMenu(); }
  ppOnMeeting(prev);
  renderTabs();
}
function onDataChange(n){
  if(n==='agenda' || n==='notes') renderAgenda();
  else if(n==='strokes' || n==='shapes' || n==='texts') wbOnItems(n);
  else if(n==='stickies'){ wbOnItems(); renderStickies(); }
  else if(n==='presence'){ renderPeople(); wbOnPresence(); ppRenderBar(); renderTabs(); ppUpdateMode(); }
}
async function renameMeeting(){
  const t=await askText('Rename Meeting', MTG.title||'', 'Save');
  if(t) MREF().update({title:t}).catch(fail);
}
async function endMeeting(){
  if(await askYesNo('End this meeting?', '', 'End Meeting')) setStatus('ended');
}
function setStatus(st){
  const upd={status:st};
  if(st==='ended'){ upd.endedAt=Date.now(); upd.presenter=null; upd.hl=[]; upd.followLock=false; }
  MREF().update(upd).catch(fail);
}
async function deleteMeeting(){
  if(!await askYesNo('Delete this meeting?', 'Its agenda, notes and whiteboard are deleted for everyone.', 'Delete', true)) return;
  const ref=MREF();
  location.hash='';
  try{
    for(const n of ALL_SUBS){
      const s=await ref.collection(n).get();
      for(let i=0;i<s.docs.length;i+=400){
        const b=db.batch(); s.docs.slice(i,i+400).forEach(d=>b.delete(d.ref)); await b.commit();
      }
    }
    await ref.delete();
    toast('Meeting deleted.');
  }catch(e){ fail(e); }
}

/* ---------- agenda + notes ----------
   One running page: each agenda item is a raised header, and the notes
   about it sit under it, indented in a recessed well with the writer's
   name on the left. Each item has its own box for adding a note. */
let NOTE_EDIT=null;
function renderAgendaPane(){
  const ro=readOnly();
  $('pane-agenda').innerHTML=`<div class="agenda">
    <div id="agList"></div>
    ${ro?'':`<div class="addAgenda"><input type="text" id="agNew" maxlength="200" aria-label="New agenda item" onkeydown="if(event.key==='Enter'){event.preventDefault();addAgenda();}"><button class="btn tc" onclick="addAgenda()" aria-label="Add agenda item">${icon('plus')}Add</button></div>`}
  </div>`;
  renderAgenda();
}
const agSorted=()=>DATA.agenda.slice().sort((a,b)=>(a.order||0)-(b.order||0)||(a.at||0)-(b.at||0));
function renderAgenda(){
  const el=$('agList'); if(!el) return;
  const ro=readOnly(), list=agSorted();
  const notes=DATA.notes.slice().sort((a,b)=>(a.at||0)-(b.at||0));
  const secs=list.map(a=>({id:a.id, a, notes:notes.filter(n=>n.agendaId===a.id)}));
  const loose=notes.filter(n=>!n.agendaId || !DATA.agenda.some(a=>a.id===n.agendaId));
  if(loose.length || !list.length) secs.push({id:'_general', a:null, notes:loose});
  keyed(el, secs, s=>s.id, s=>{
    const g=!s.a;
    return `<section class="agSec">
      <div class="agItem${g?' general':''}">
        ${g?'':`<input type="checkbox" class="chk" ${ro?'disabled':''} aria-label="Done" onchange="SUB('agenda').doc('${s.id}').update({done:this.checked}).catch(fail)">`}
        <div class="txt" ${(g||ro)?'':`onclick="setCurrentAgenda('${s.id}')"`}><span class="strike">${g?'General':''}</span></div>
        <span class="nc"></span>

function noteKey(e, t){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); addNote(t); } }
function addNote(t){

async function deleteNote(id){

}
function addAgenda(){
  const inp=$('agNew'); const text=(inp.value||'').trim(); if(!text) return;
  const max=DATA.agenda.reduce((m,a)=>Math.max(m,a.order||0),0);
  const ref=SUB('agenda').doc();
  ref.set({text, order:max+1, done:false, by:ME.uid, at:Date.now()}).catch(fail);
  if(!MTG.currentAgenda) MREF().update({currentAgenda:ref.id}).catch(()=>{});

function moveAgenda(id, dir){
  const list=agSorted(); const i=list.findIndex(a=>a.id===id); const j=i+dir;
  if(i<0||j<0||j>=list.length) return;
  const b=db.batch();
  list.forEach((a,k)=>{ const ord = k===i ? j : k===j ? i : k; if((a.order||0)!==ord+1) b.update(SUB('agenda').doc(a.id), {order:ord+1}); });

}
async function editAgenda(id){
  const a=DATA.agenda.find(x=>x.id===id); if(!a) return;

async function deleteAgenda(id){

  const n=DATA.notes.filter(x=>x.agendaId===id).length;
  if(!await askYesNo('Delete this agenda item?', n ? a.text+'\nIts notes move to General.' : a.text, 'Delete', true)) return;

/* =========================================================================
   WHITEBOARD
   An endless board: drag with two fingers (or the hand tool, the space bar,
   or a trackpad) to move around, pinch or ctrl-scroll to zoom. Pen lines are
   smoothed and, with a stylus, get thinner and thicker with pressure; while
   a stylus is in use, a resting hand or finger moves the board instead of
   drawing. There are shapes, text, sticky notes, a laser pointer for
   pointing things out, and a select tool for moving and recolouring things.
   Everyone sees lines, shapes and the laser as they are being drawn, and
   each person's cursor with their name.
========================================================================= */
const WB_UNIT_W=1000, WB_UNIT_H=625;      // the first whiteboards' size
const SIZES=[2.5,5,10];
const WB={tool:'pen', color:COLORS[0], size:1, sticky:STICKY_COLORS[0], shape:'rect',
  view:{x:0, y:0, z:1}, w:0, h:0, dpr:1, sel:null, penSeen:false, space:false, menu:false,
  ptrs:new Map(), gesture:null, act:null, undo:[], redo:[], raf:0, mainDirty:true, ro:null};
const INK={remote:new Map(), lasers:new Map(), fading:[], myLaser:[]};

/* ----- coordinates ----- */
const K=()=>WB.view.z*WB.w/WB_UNIT_W;                  // screen pixels per board unit
const toScreen=(x,y)=>[(x-WB.view.x)*K(), (y-WB.view.y)*K()];
function toWorld(cx,cy){ const r=$('board').getBoundingClientRect(); return [(cx-r.left)/K()+WB.view.x, (cy-r.top)/K()+WB.view.y]; }
/* Lines from the first whiteboards stored fractions; newer ones store board
   units with a pressure value per point. Both come out as [x,y,p,...]. */
function ptsOf(s){
  if(s._w && s._wsrc===s.pts) return s._w;
  let out;
  if(s.v===2) out=s.pts||[];
  else{ out=[]; const p=s.pts||[]; for(let i=0;i<p.length;i+=2) out.push(p[i]*WB_UNIT_W, p[i+1]*WB_UNIT_H, .5); }
  s._w=out; s._wsrc=s.pts; return out;
}
function stickyPos(s){ return s.v===2 ? [s.x, s.y] : [s.x*WB_UNIT_W, s.y*WB_UNIT_H]; }

/* ----- the board on screen ----- */
function renderBoardPane(){
  const ro=readOnly();
  $('pane-board').innerHTML=`<div class="wbWrap" id="wbWrap">
    <div class="wbBar" id="wbBar"></div>
    <div class="board" id="board">
      <canvas id="cvMain"></canvas><canvas id="cvLive"></canvas>
      <div class="stickyLayer" id="stickyLayer"></div>
      <div class="cursorLayer" id="cursorLayer"></div>
      <div class="zoomBox" id="zoomBox">
        <button onclick="wbZoomBy(1/1.25)" aria-label="Zoom out">${icon('minus')}</button>
        <button id="zoomPct" onclick="wbZoomTo(1)" aria-label="Zoom to 100%">100%</button>
        <button onclick="wbZoomBy(1.25)" aria-label="Zoom in">${icon('plus')}</button>
        <button onclick="wbFitContent()" aria-label="Show everything" title="Show everything">${icon('fit')}</button>
      </div>
    </div></div>`;
  if(ro && !['hand','laser'].includes(WB.tool)) WB.tool='hand';
  renderWbBar();
  const b=$('board');
  b.classList.add('t-'+WB.tool);
  b.addEventListener('pointerdown', wbDown);
  b.addEventListener('pointermove', wbMove);
  b.addEventListener('pointerup', wbUp);
  b.addEventListener('pointercancel', wbUp);
  b.addEventListener('pointerleave', e=>{ if(!WB.ptrs.has(e.pointerId)){ WB.hover=null; wbKick(); } });
  b.addEventListener('wheel', wbWheel, {passive:false});
  b.addEventListener('dblclick', wbDbl);
  if(WB.ro) WB.ro.disconnect();
  WB.ro=new ResizeObserver(()=>wbSize()); WB.ro.observe(b);
  wbApplyBg();
  wbSize();
}
function wbTeardown(){
  if(WB.ro){ WB.ro.disconnect(); WB.ro=null; }
  WB.ptrs.clear(); WB.gesture=null; WB.act=null; WB.sel=null; WB.undo=[]; WB.redo=[];
  INK.remote.clear(); INK.lasers.clear(); INK.fading=[]; INK.myLaser=[];
  WB.view={x:0, y:0, z:1}; WB.fitted=false; WB.autoFit=false; WB.userMoved=false;
}
/* On a computer the board fills the rest of the window, so the page
   itself never scrolls while you draw. */
function wbFit(){
  const b=$('board'); if(!b) return;
  if(document.body.classList.contains('wbFull')){ b.style.height=''; wbSize(); return; }
  const top=b.getBoundingClientRect().top+window.scrollY;
  b.style.height=Math.max(phoneMQ.matches?340:420, window.innerHeight-top-18)+'px';
  wbSize();
}
window.addEventListener('resize', ()=>{ if(MTG && TAB==='board') wbFit(); });
function wbSetFull(on){
  if(!on && phoneMQ.matches){ document.body.classList.remove('wbFull'); showTab(PP_BACK && PP_BACK!=='board' ? PP_BACK : 'agenda'); return; }
  document.body.classList.toggle('wbFull', !!on); WB.menu=false; renderWbBar(); requestAnimationFrame(wbFit);
}
function wbSize(){
  const b=$('board'); if(!b) return;
  const r=b.getBoundingClientRect(); if(!r.width) return;
  const first=!WB.w;
  WB.w=r.width; WB.h=r.height; WB.dpr=Math.min(window.devicePixelRatio||1, 3);
  ['cvMain','cvLive'].forEach(id=>{ const c=$(id); c.width=Math.round(r.width*WB.dpr); c.height=Math.round(r.height*WB.dpr); });
  if(first && !WB.fitted){ WB.fitted=true; wbFitContent(true); }
  wbViewChanged();
}
function wbApplyBg(){
  const b=$('board'); if(!b) return;
  const bg=(MTG && MTG.bg) || 'dots';
  b.classList.toggle('bg-dots', bg==='dots'); b.classList.toggle('bg-grid', bg==='grid');
  wbBgPos();
}
function wbBgPos(){
  const b=$('board'); if(!b) return;
  if(!WB.w || !(K()>0)) return;
  const step=25*K(); let s=step; while(s<12) s*=2; while(s>60) s/=2;
  b.style.backgroundSize=`${s}px ${s}px`;
  b.style.backgroundPosition=`${-WB.view.x*K()%s}px ${-WB.view.y*K()%s}px`;
}
function wbViewChanged(user){
  if(user) WB.userMoved=true;
  WB.mainDirty=true; wbBgPos(); renderStickies(); wbCursors(); wbPlaceTextEdit(); wbPlaceSelBar();
  const z=$('zoomPct'); if(z) z.textContent=Math.round(WB.view.z*100)+'%';
  wbKick();
}
function wbZoomAt(cx, cy, z){
  z=Math.max(.15, Math.min(6, z));
  const r=$('board').getBoundingClientRect();
  const [wx,wy]=toWorld(cx,cy);
  WB.view.z=z;
  WB.view.x=wx-(cx-r.left)/K(); WB.view.y=wy-(cy-r.top)/K();
  wbViewChanged(true);
}
function wbZoomBy(f){ const r=$('board').getBoundingClientRect(); wbAnimateView(()=>{ wbZoomAt(r.left+r.width/2, r.top+r.height/2, WB.view.z*f); }); }
function wbZoomTo(z){ const r=$('board').getBoundingClientRect(); wbAnimateView(()=>wbZoomAt(r.left+r.width/2, r.top+r.height/2, z)); }
/* Zoom buttons glide to the new view instead of jumping. */
function wbAnimateView(apply){
  const from=Object.assign({}, WB.view); apply(); const to=Object.assign({}, WB.view);
  if(RM.matches) return;
  const t0=performance.now(), D=260;
  const step=now=>{
    const t=Math.min(1,(now-t0)/D), e=1-Math.pow(1-t,3);
    // zoom changes geometrically so the motion feels even
    WB.view.z=from.z*Math.pow(to.z/from.z, e);
    WB.view.x=from.x+(to.x-from.x)*e; WB.view.y=from.y+(to.y-from.y)*e;
    wbViewChanged();
    if(t<1) requestAnimationFrame(step);
  };
  WB.view=from; requestAnimationFrame(step);
}
function wbBounds(){
  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  const add=(a,b,c,d)=>{ x1=Math.min(x1,a); y1=Math.min(y1,b); x2=Math.max(x2,c); y2=Math.max(y2,d); };
  DATA.strokes.forEach(s=>{ const p=ptsOf(s); for(let i=0;i<p.length;i+=3) add(p[i],p[i+1],p[i],p[i+1]); });
  DATA.shapes.forEach(s=>add(Math.min(s.x1,s.x2),Math.min(s.y1,s.y2),Math.max(s.x1,s.x2),Math.max(s.y1,s.y2)));
  DATA.texts.forEach(t=>{ const b=textBox(t); add(b[0],b[1],b[2],b[3]); });
  DATA.stickies.forEach(s=>{ const [x,y]=stickyPos(s); add(x,y,x+150,y+120); });
  return x1===Infinity ? null : [x1,y1,x2,y2];
}
function wbFitContent(instant){
  if(!WB.w) return;
  const b=wbBounds();
  const apply=()=>{
    if(!b){ WB.view={x:0, y:0, z:1}; wbViewChanged(); return; }
    const pad=40, bw=Math.max(b[2]-b[0], 200), bh=Math.max(b[3]-b[1], 120);
    const z=Math.max(.15, Math.min(1.25, Math.min((WB.w-pad*2)/(bw*WB.w/WB_UNIT_W), (WB.h-pad*2)/(bh*WB.w/WB_UNIT_W))));
    WB.view.z=z;
    const k=K();
    WB.view.x=b[0]+bw/2-(WB.w/2)/k; WB.view.y=b[1]+bh/2-(WB.h/2)/k;
    if(b[2]-b[0]<200) WB.view.x=(b[0]+b[2])/2-(WB.w/2)/k;
    if(b[3]-b[1]<120) WB.view.y=(b[1]+b[3])/2-(WB.h/2)/k;
    wbViewChanged();
  };
  if(instant) apply(); else wbAnimateView(apply);
}

/* ----- toolbar ----- */
function renderWbBar(){

document.addEventListener('pointerdown', e=>{ if(WB.menu && !e.target.closest('#wbBar')){ WB.menu=false; renderWbBar(); } });
function setTool(k){
  if(WB.textEdit) wbCommitText();
  WB.tool=k; WB.menu=false;
  if(k!=='select') wbSelect(null);
  const b=$('board'); if(b){ b.className=b.className.replace(/\bt-\w+/g,'').trim()+' t-'+k; }

function setColor(c){

  renderWbBar();

/* ----- drawing ----- */
function bColor(c){
  // dark inks are drawn light on the dark board so they stay visible
  if(document.documentElement.classList.contains('dark') && (c===COLORS[0] || c==='#111111')) return '#dbe5f5';
  return c;
}
function setCtx(ctx){ const k=K()*WB.dpr; ctx.setTransform(k,0,0,k,-WB.view.x*k,-WB.view.y*k); }
/* A smooth line through the points; with pressure, segment widths follow it. */
function drawStroke(ctx, pts, color, size, tool, upto, alpha){
  const n=Math.min(pts.length, upto==null?Infinity:upto*3);
  if(n<3) return;
  ctx.save();
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle=bColor(color); ctx.globalAlpha=(tool==='marker'?.35:1)*(alpha==null?1:alpha);
  const base=size*(tool==='marker'?3:1);
  let varying=false;
  if(tool!=='marker') for(let i=5;i<n;i+=3) if(Math.abs(pts[i]-pts[2])>.04){ varying=true; break; }
  if(!varying){
    ctx.lineWidth=base;
    ctx.beginPath(); ctx.moveTo(pts[0],pts[1]);
    if(n===3) ctx.lineTo(pts[0]+.01,pts[1]);
    else if(n===6) ctx.lineTo(pts[3],pts[4]);
    else{
      for(let i=3;i<n-3;i+=3) ctx.quadraticCurveTo(pts[i],pts[i+1],(pts[i]+pts[i+3])/2,(pts[i+1]+pts[i+4])/2);
      ctx.lineTo(pts[n-3],pts[n-2]);
    }
    ctx.stroke();
  } else {
    let px=pts[0], py=pts[1];
    for(let i=3;i<n;i+=3){
      const mx=i+3<n?(pts[i]+pts[i+3])/2:pts[i], my=i+3<n?(pts[i+1]+pts[i+4])/2:pts[i+1];
      ctx.lineWidth=Math.max(.6, base*(0.35+pts[i+2]*1.3));
      ctx.beginPath(); ctx.moveTo(px,py); ctx.quadraticCurveTo(pts[i],pts[i+1],mx,my); ctx.stroke();
      px=mx; py=my;
    }
  }
  ctx.restore();
}
function drawShape(ctx, s, alpha){
  ctx.save();
  ctx.strokeStyle=bColor(s.color); ctx.lineWidth=s.size; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.globalAlpha=alpha==null?1:alpha;
  const x=Math.min(s.x1,s.x2), y=Math.min(s.y1,s.y2), w=Math.abs(s.x2-s.x1), h=Math.abs(s.y2-s.y1);
  ctx.beginPath();
  if(s.kind==='rect'){ const r=Math.min(10, w/4, h/4); if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h); }
  else if(s.kind==='ellipse'){ ctx.ellipse(x+w/2, y+h/2, w/2, h/2, 0, 0, Math.PI*2); }
  else { ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); }
  ctx.stroke();
  if(s.kind==='arrow'){
    const a=Math.atan2(s.y2-s.y1, s.x2-s.x1), L=Math.max(12, s.size*4);
    ctx.beginPath();
    ctx.moveTo(s.x2-L*Math.cos(a-.45), s.y2-L*Math.sin(a-.45)); ctx.lineTo(s.x2,s.y2); ctx.lineTo(s.x2-L*Math.cos(a+.45), s.y2-L*Math.sin(a+.45));
    ctx.stroke();
  }
  ctx.restore();
}
const TEXT_FONT=size=>`600 ${size}px 'DM Sans', system-ui, sans-serif`;
function textBox(t){
  const lines=String(t.text||'').split('\n'), size=t.size||28;
  const c=textBox.c||(textBox.c=document.createElement('canvas').getContext('2d'));
  c.font=TEXT_FONT(size);
  const w=Math.max(20, ...lines.map(l=>c.measureText(l).width));
  return [t.x, t.y, t.x+w, t.y+lines.length*size*1.25];
}
function drawText(ctx, t, alpha){
  ctx.save();
  ctx.globalAlpha=alpha==null?1:alpha;
  ctx.fillStyle=bColor(t.color); ctx.font=TEXT_FONT(t.size||28); ctx.textBaseline='top';
  String(t.text||'').split('\n').forEach((l,i)=>ctx.fillText(l, t.x, t.y+i*(t.size||28)*1.25));
  ctx.restore();
}
function wbDrawMain(){
  const c=$('cvMain'); if(!c || !WB.w) return;
  const ctx=c.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,c.width,c.height);
  setCtx(ctx);
  const moving=WB.act && WB.act.kind==='move' ? WB.act : null;
  const all=[...DATA.strokes.map(s=>['s',s]), ...DATA.shapes.map(s=>['h',s]), ...DATA.texts.map(s=>['t',s])].sort((a,b)=>(a[1].at||0)-(b[1].at||0));
  all.forEach(([k,s])=>{
    if(moving && moving.id===s.id) return;
    if(WB.textEdit && WB.textEdit.id===s.id) return;
    if(k==='s') drawStroke(ctx, ptsOf(s), s.color, s.size, s.tool);
    else if(k==='h') drawShape(ctx, s);
    else drawText(ctx, s);
  });
  WB.mainDirty=false;
}
function wbKick(){ if(!WB.raf) WB.raf=requestAnimationFrame(wbFrame); }
function wbFrame(){
  WB.raf=0;
  if(WB.mainDirty) wbDrawMain();
  const c=$('cvLive'); if(!c || !WB.w) return;
  const ctx=c.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,c.width,c.height);
  setCtx(ctx);
  const now=performance.now();
  let again=false;
  // other people's lines and shapes in progress, revealed smoothly
  INK.remote.forEach((r,u)=>{
    if(r.shape){ drawShape(ctx, r.shape); }
    else{
      const total=r.pts.length/3;
      if(r.shown<total){ r.shown=Math.min(total, r.shown+Math.max(1,(total-r.shown)*.22)); again=true; }
      drawStroke(ctx, r.pts, r.color, r.size, r.tool, Math.floor(r.shown));
    }
    if(r.ended){ if(now-r.ended>1500) INK.remote.delete(u); else again=true; }
  });
  // erased or undone things fade out
  INK.fading=INK.fading.filter(f=>{
    const t=(now-f.t0)/220; if(t>=1) return false;
    if(f.k==='s') drawStroke(ctx, ptsOf(f.s), f.s.color, f.s.size, f.s.tool, null, 1-t);
    else if(f.k==='h') drawShape(ctx, f.s, 1-t);
    else drawText(ctx, f.s, 1-t);
    again=true; return true;
  });
  // the thing being moved follows the finger
  const a=WB.act;
  if(a && a.kind==='move'){
    const it=a.item;
    ctx.save(); ctx.translate(a.dx, a.dy);
    if(a.col==='strokes') drawStroke(ctx, ptsOf(it), it.color, it.size, it.tool);
    else if(a.col==='shapes') drawShape(ctx, it);
    else if(a.col==='texts') drawText(ctx, it);
    ctx.restore();
  }
  if(a && a.kind==='draw') drawStroke(ctx, a.pts, a.color, a.size, a.tool);
  if(a && a.kind==='shape' && a.s) drawShape(ctx, a.s);
  // laser trails, mine and everyone else's
  const laser=(pts, color)=>{
    const life=750;
    const live=pts.filter(p=>now-p[2]<life);
    if(live.length<1) return false;
    ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
    for(let i=1;i<live.length;i++){
      const age=(now-live[i][2])/life;
      ctx.strokeStyle=color; ctx.globalAlpha=Math.max(0,1-age)*.85;
      ctx.lineWidth=(5/K())*(1-age*.6);
      ctx.shadowColor=color; ctx.shadowBlur=12;
      ctx.beginPath(); ctx.moveTo(live[i-1][0],live[i-1][1]); ctx.lineTo(live[i][0],live[i][1]); ctx.stroke();
    }
    const h=live[live.length-1];
    if(now-h[2]<life){ ctx.globalAlpha=Math.max(0,1-(now-h[2])/life); ctx.fillStyle=color; ctx.shadowBlur=16; ctx.beginPath(); ctx.arc(h[0],h[1],6/K(),0,Math.PI*2); ctx.fill(); }
    ctx.restore();
    return true;
  };
  if(laser(INK.myLaser, colorFor(ME.name))) again=true; else INK.myLaser=[];
  INK.lasers.forEach((l,u)=>{ if(laser(l.pts, l.color)) again=true; else INK.lasers.delete(u); });
  // selection outline
  if(WB.sel){
    const it=findItem(WB.sel.col, WB.sel.id);
    if(it){
      const b=itemBox(WB.sel.col, it), d=(a && a.kind==='move')?[a.dx,a.dy]:[0,0], pad=8/K();
      ctx.save(); ctx.setLineDash([6/K(),4/K()]); ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--c-board').trim()||'#2f6fd6';
      ctx.lineWidth=1.5/K(); ctx.strokeRect(b[0]-pad+d[0], b[1]-pad+d[1], b[2]-b[0]+pad*2, b[3]-b[1]+pad*2); ctx.restore();
    } else wbSelect(null);
  }
  // the eraser's circle
  if(WB.hover && WB.tool==='eraser' && !readOnly()){
    ctx.save(); ctx.beginPath(); ctx.arc(WB.hover[0], WB.hover[1], 14/K(), 0, Math.PI*2);
    ctx.strokeStyle='#2f6fd6'; ctx.lineWidth=1.5/K(); ctx.setLineDash([3/K(),3/K()]);
    ctx.fillStyle='rgba(47,111,214,.08)'; ctx.fill(); ctx.stroke(); ctx.restore();
  }
  if(again) wbKick();
}
function wbOnItems(){
  // a board that already has things on it opens showing all of them, once everything has loaded
  if(!WB.autoFit && !WB.userMoved){
    clearTimeout(WB.fitT);
    WB.fitT=setTimeout(()=>{ if(!WB.autoFit && !WB.userMoved && WB.w && wbBounds()){ WB.autoFit=true; wbFitContent(true); } }, 350);
  }
  DATA.strokes.forEach(s=>{ const r=INK.remote.get(s.by); if(r && r.id===s.id) INK.remote.delete(s.by); });
  DATA.shapes.forEach(s=>{ const r=INK.remote.get(s.by); if(r && r.id===s.id) INK.remote.delete(s.by); });
  WB.mainDirty=true; wbKick(); wbPlaceSelBar();
}

/* ----- finding things on the board ----- */
function findItem(col, id){ return (DATA[col]||[]).find(x=>x.id===id); }
function itemBox(col, it){
  if(col==='strokes'){ const p=ptsOf(it); let a=[Infinity,Infinity,-Infinity,-Infinity]; for(let i=0;i<p.length;i+=3){ a=[Math.min(a[0],p[i]),Math.min(a[1],p[i+1]),Math.max(a[2],p[i]),Math.max(a[3],p[i+1])]; } const h=it.size*(it.tool==='marker'?1.5:.5); return [a[0]-h,a[1]-h,a[2]+h,a[3]+h]; }
  if(col==='shapes') return [Math.min(it.x1,it.x2),Math.min(it.y1,it.y2),Math.max(it.x1,it.x2),Math.max(it.y1,it.y2)];
  return textBox(it);
}
function distSeg(px,py,ax,ay,bx,by){ const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy; let t=L?((px-ax)*dx+(py-ay)*dy)/L:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(px-ax-t*dx, py-ay-t*dy); }
function hitItem(x,y,r){
  const cand=[];
  DATA.texts.forEach(t=>{ const b=textBox(t); if(x>=b[0]-r && x<=b[2]+r && y>=b[1]-r && y<=b[3]+r) cand.push(['texts',t]); });
  DATA.shapes.forEach(s=>{
    const x1=Math.min(s.x1,s.x2), y1=Math.min(s.y1,s.y2), x2=Math.max(s.x1,s.x2), y2=Math.max(s.y1,s.y2), rr=r+s.size/2;
    let hit=false;
    if(s.kind==='line'||s.kind==='arrow') hit=distSeg(x,y,s.x1,s.y1,s.x2,s.y2)<rr;
    else if(s.kind==='rect') hit=(x>=x1-rr&&x<=x2+rr&&y>=y1-rr&&y<=y2+rr) && !(x>x1+rr&&x<x2-rr&&y>y1+rr&&y<y2-rr);
    else { const cx=(x1+x2)/2, cy=(y1+y2)/2, ax=Math.max(1,(x2-x1)/2), ay=Math.max(1,(y2-y1)/2); const d=Math.hypot((x-cx)/ax,(y-cy)/ay); hit=Math.abs(d-1)*Math.min(ax,ay)<rr; }
    if(hit) cand.push(['shapes',s]);
  });
  DATA.strokes.forEach(s=>{
    const p=ptsOf(s), rr=r+s.size*(s.tool==='marker'?1.5:.5);
    for(let i=0;i<p.length;i+=3){
      const d=i+3<p.length ? distSeg(x,y,p[i],p[i+1],p[i+3],p[i+4]) : Math.hypot(x-p[i],y-p[i+1]);
      if(d<rr){ cand.push(['strokes',s]); break; }
    }
  });
  cand.sort((a,b)=>(b[1].at||0)-(a[1].at||0));   // the newest is on top
  return cand[0]||null;
}

/* ----- pointer input ----- */
function wbDown(e){
  if(e.target.closest('.stk,.zoomBox,.selBar,.textEdit')) return;
  if(e.button>0 && e.button!==1) return;
  const b=$('board');
  b.setPointerCapture(e.pointerId);
  if(e.pointerType==='pen') WB.penSeen=true;
  WB.ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY, type:e.pointerType});
  // two fingers: move and zoom the board, dropping a line just started
  if(WB.ptrs.size===2){
    if(WB.act && (WB.act.kind==='draw' && WB.act.pts.length<30 || WB.act.kind==='shape' || WB.act.kind==='pan')) WB.act=null;
    if(!WB.act){ wbStartPinch(); wbKick(); return; }
  }
  if(WB.ptrs.size>2) return;
  const [x,y]=toWorld(e.clientX, e.clientY);
  const touchPan = e.pointerType==='touch' && WB.penSeen;
  const tool = (e.button===1 || WB.space || touchPan || readOnly() && WB.tool!=='laser') ? 'hand' : WB.tool;
  if(WB.textEdit && tool!=='text') wbCommitText();
  e.preventDefault();
  if(tool==='hand'){ WB.act={kind:'pan', sx:e.clientX, sy:e.clientY, vx:WB.view.x, vy:WB.view.y}; b.classList.add('panning'); return; }
  if(tool==='pen'||tool==='marker'){
    WB.act={kind:'draw', id:uid(), pts:[+x.toFixed(1), +y.toFixed(1), pressureOf(e)], color:WB.color, size:SIZES[WB.size], tool};
    wbKick(); return;
  }
  if(tool==='eraser'){ WB.act={kind:'erase', hit:new Set()}; WB.hover=[x,y]; wbEraseAt(x,y); wbKick(); return; }
  if(tool==='shape'){ WB.act={kind:'shape', id:uid(), x0:x, y0:y, s:null}; return; }
  if(tool==='laser'){ WB.act={kind:'laser'}; INK.myLaser.push([x,y,performance.now()]); wbSendLaser(); wbKick(); return; }
  if(tool==='text'){
    const h=hitItem(x,y,6/K());
    if(h && h[0]==='texts') wbOpenText(h[1]); else wbOpenText(null, x, y);
    return;
  }
  if(tool==='sticky'){ addSticky(x-75, y-20); return; }
  if(tool==='select'){
    const h=hitItem(x,y,8/K());
    if(h){ wbSelect({col:h[0], id:h[1].id}); WB.act={kind:'move', col:h[0], id:h[1].id, item:h[1], sx:x, sy:y, dx:0, dy:0}; WB.mainDirty=true; }
    else { wbSelect(null); WB.act={kind:'pan', sx:e.clientX, sy:e.clientY, vx:WB.view.x, vy:WB.view.y}; b.classList.add('panning'); }
    wbKick();
  }
}
const pressureOf=e=>+((e.pointerType==='pen' && e.pressure>0) ? e.pressure : .5).toFixed(2);
function wbStartPinch(){
  const [a,b]=[...WB.ptrs.values()];
  const r=$('board').getBoundingClientRect();
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  WB.gesture={d:Math.hypot(a.x-b.x,a.y-b.y)||1, z:WB.view.z, world:toWorld(mx,my), mx, my, left:r.left, top:r.top};
}
function wbMove(e){
  const p=WB.ptrs.get(e.pointerId);
  if(p){ p.x=e.clientX; p.y=e.clientY; }
  const [x,y]=toWorld(e.clientX, e.clientY);
  if(e.pointerType!=='touch'){ WB.hover=[x,y]; wbSendCursor(x,y); }
  if(WB.gesture && WB.ptrs.size>=2){
    const [a,b]=[...WB.ptrs.values()], g=WB.gesture;
    const d=Math.hypot(a.x-b.x,a.y-b.y)||1, mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    WB.view.z=Math.max(.15, Math.min(6, g.z*d/g.d));
    WB.view.x=g.world[0]-(mx-g.left)/K(); WB.view.y=g.world[1]-(my-g.top)/K();
    wbViewChanged(true); return;
  }
  const a=WB.act;
  if(!a){ if(WB.tool==='eraser') wbKick(); else if(WB.tool==='select'){ const b=$('board'); b.classList.toggle('overItem', !!hitItem(x,y,8/K())); } return; }
  if(a.kind==='pan'){ WB.view.x=a.vx-(e.clientX-a.sx)/K(); WB.view.y=a.vy-(e.clientY-a.sy)/K(); wbViewChanged(true); return; }
  const evs=(e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
  if(a.kind==='draw'){
    const min=1.1/K();
    evs.forEach(ev=>{
      const [wx,wy]=toWorld(ev.clientX, ev.clientY), n=a.pts.length;
      if(Math.hypot(a.pts[n-3]-wx, a.pts[n-2]-wy)<min) return;
      a.pts.push(+wx.toFixed(1), +wy.toFixed(1), pressureOf(ev));
    });
    liveSend({ink:{id:a.id, v:2, pts:a.pts.slice(0,4500), color:a.color, size:a.size, tool:a.tool}, cur:{x:+x.toFixed(1), y:+y.toFixed(1)}});
    wbKick(); return;
  }
  if(a.kind==='erase'){ evs.forEach(ev=>{ const w=toWorld(ev.clientX, ev.clientY); WB.hover=w; wbEraseAt(w[0],w[1]); }); wbKick(); return; }
  if(a.kind==='shape'){
    let x2=x, y2=y;
    if(e.shiftKey){
      if(WB.shape==='line'||WB.shape==='arrow'){ const ang=Math.round(Math.atan2(y-a.y0,x-a.x0)/(Math.PI/4))*(Math.PI/4), L=Math.hypot(x-a.x0,y-a.y0); x2=a.x0+L*Math.cos(ang); y2=a.y0+L*Math.sin(ang); }
      else{ const s=Math.max(Math.abs(x-a.x0),Math.abs(y-a.y0)); x2=a.x0+Math.sign(x-a.x0||1)*s; y2=a.y0+Math.sign(y-a.y0||1)*s; }
    }
    a.s={kind:WB.shape, x1:+a.x0.toFixed(1), y1:+a.y0.toFixed(1), x2:+x2.toFixed(1), y2:+y2.toFixed(1), color:WB.color, size:SIZES[WB.size]};
    liveSend({ink:{id:a.id, shape:a.s}, cur:{x:+x.toFixed(1), y:+y.toFixed(1)}});
    wbKick(); return;
  }
  if(a.kind==='laser'){ evs.forEach(ev=>{ const w=toWorld(ev.clientX, ev.clientY); INK.myLaser.push([w[0],w[1],performance.now()]); }); wbSendLaser(); wbKick(); return; }
  if(a.kind==='move'){ a.dx=x-a.sx; a.dy=y-a.sy; wbKick(); wbPlaceSelBar(); }
}
function wbUp(e){
  WB.ptrs.delete(e.pointerId);
  const b=$('board'); if(b) b.classList.remove('panning');
  if(WB.gesture){ if(WB.ptrs.size<2){ WB.gesture=null; WB.act=null; } return; }
  const a=WB.act; WB.act=null;
  if(!a) return;
  if(a.kind==='draw'){
    liveSend({ink:null});
    if(a.pts.length<3){ wbKick(); return; }
    const doc={v:2, pts:a.pts, color:a.color, size:a.size, tool:a.tool, by:ME.uid, at:Date.now()};
    DATA.strokes.push(Object.assign({id:a.id}, doc)); WB.mainDirty=true; wbKick();
    wbAdd('strokes', a.id, doc);
  } else if(a.kind==='shape'){
    liveSend({ink:null});
    const s=a.s;
    if(s && Math.hypot(s.x2-s.x1, s.y2-s.y1)>4/K()){
      const doc=Object.assign({}, s, {by:ME.uid, at:Date.now()});
      DATA.shapes.push(Object.assign({id:a.id}, doc)); WB.mainDirty=true;
      wbAdd('shapes', a.id, doc);
    }
    wbKick();
  } else if(a.kind==='laser'){ wbSendLaser(true); }
  else if(a.kind==='move'){
    if(Math.abs(a.dx)>.5 || Math.abs(a.dy)>.5) wbMoveItem(a.col, a.item, a.dx, a.dy);
    WB.mainDirty=true; wbKick(); wbPlaceSelBar();
  } else wbKick();
}
function wbWheel(e){
  e.preventDefault();
  if(e.ctrlKey || e.metaKey){
    wbZoomAt(e.clientX, e.clientY, WB.view.z*Math.exp(-e.deltaY*(e.deltaMode===1?.05:.0025)));
  } else {
    const f=e.deltaMode===1?16:1;
    WB.view.x+=e.deltaX*f/K(); WB.view.y+=e.deltaY*f/K(); wbViewChanged(true);
  }
}
function wbDbl(e){
  if(readOnly() || WB.tool!=='select') return;
  const [x,y]=toWorld(e.clientX, e.clientY);
  const h=hitItem(x,y,6/K());
  if(h && h[0]==='texts') wbOpenText(h[1]);
}
document.addEventListener('keydown', e=>{
  if(!MTG || TAB!=='board') return;
  const typing=e.target.closest && e.target.closest('input,textarea,select,[contenteditable]');
  if(e.code==='Space' && !typing){ if(!WB.space){ WB.space=true; const b=$('board'); if(b) b.classList.add('t-hand'); } e.preventDefault(); return; }
  if(typing || readOnly()) return;
  const mod=e.metaKey||e.ctrlKey;
  if(mod && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey ? wbRedo() : wbUndo(); }
  else if(mod && e.key.toLowerCase()==='y'){ e.preventDefault(); wbRedo(); }
  else if((e.key==='Delete'||e.key==='Backspace') && WB.sel){ e.preventDefault(); wbDeleteSel(); }
  else if(e.key==='Escape'){ wbSelect(null); if(document.body.classList.contains('wbFull')) wbSetFull(false); }
});
document.addEventListener('keyup', e=>{ if(e.code==='Space' && WB.space){ WB.space=false; const b=$('board'); if(b) b.classList.remove('t-hand'); } });

/* ----- saving, with undo and redo ----- */
function pushUndo(entry){ WB.undo.push(entry); if(WB.undo.length>100) WB.undo.shift(); WB.redo=[]; renderWbBar(); }
function wbAdd(col, id, doc, noUndo){
  SUB(col).doc(id).set(doc).catch(fail);
  if(!noUndo) pushUndo({t:'add', col, id, doc});
}
function wbRemove(col, it, noUndo){
  INK.fading.push({k:col==='strokes'?'s':col==='shapes'?'h':'t', s:it, t0:performance.now()});
  DATA[col]=DATA[col].filter(x=>x.id!==it.id); WB.mainDirty=true; wbKick();
  const {id, _w, _wsrc, ...doc}=it;
  SUB(col).doc(it.id).delete().catch(fail);
  if(!noUndo) pushUndo({t:'del', col, id:it.id, doc});
}
function movedDoc(col, it, dx, dy){
  if(col==='strokes'){ const p=ptsOf(it).slice(); for(let i=0;i<p.length;i+=3){ p[i]=+(p[i]+dx).toFixed(1); p[i+1]=+(p[i+1]+dy).toFixed(1); } return {v:2, pts:p}; }
  if(col==='shapes') return {x1:+(it.x1+dx).toFixed(1), y1:+(it.y1+dy).toFixed(1), x2:+(it.x2+dx).toFixed(1), y2:+(it.y2+dy).toFixed(1)};
  return {x:+(it.x+dx).toFixed(1), y:+(it.y+dy).toFixed(1)};
}
function wbMoveItem(col, it, dx, dy){
  const before=col==='strokes' ? {v:it.v||1, pts:it.pts} : col==='shapes' ? {x1:it.x1,y1:it.y1,x2:it.x2,y2:it.y2} : {x:it.x, y:it.y};
  const after=movedDoc(col, it, dx, dy);
  Object.assign(it, after); WB.mainDirty=true;
  SUB(col).doc(it.id).update(after).catch(fail);
  pushUndo({t:'upd', col, id:it.id, before, after});
}
function wbUndo(){
  const u=WB.undo.pop(); if(!u) return;
  wbApplyHistory(u, true); WB.redo.push(u); renderWbBar();
}
function wbRedo(){
  const u=WB.redo.pop(); if(!u) return;
  wbApplyHistory(u, false); WB.undo.push(u); renderWbBar();
}
function wbApplyHistory(u, back){
  const add=(u.t==='add')!==back;
  if(u.t==='add' || u.t==='del'){
    if(add){ SUB(u.col).doc(u.id).set(u.doc).catch(fail); if(u.col!=='stickies'){ DATA[u.col].push(Object.assign({id:u.id}, u.doc)); WB.mainDirty=true; } }
    else{
      const it=findItem(u.col, u.id);
      if(u.col==='stickies'){ SUB('stickies').doc(u.id).delete().catch(fail); }
      else if(it) wbRemove(u.col, it, true); else SUB(u.col).doc(u.id).delete().catch(fail);
    }
  } else if(u.t==='upd'){
    const it=findItem(u.col, u.id), v=back?u.before:u.after;
    if(it){ Object.assign(it, v); WB.mainDirty=true; }
    SUB(u.col).doc(u.id).update(v).catch(fail);
    if(u.col==='stickies') renderStickies();
  }
  if(WB.sel && !findItem(WB.sel.col, WB.sel.id)) wbSelect(null);
  wbKick(); wbPlaceSelBar();
}
function wbEraseAt(x,y){
  const r=14/K();
  for(;;){
    const h=hitItem(x,y,r);
