/* ----- sending (presenter) -----
   The screen goes out in small numbered pieces under the meeting's stream.
   A fresh full copy goes out every minute and whenever someone starts
   following, and older pieces are deleted, so joining late is quick. */
const MIR={epoch:0, seq:0, buf:[], timer:0, chain:Promise.resolve(), every:null, reqTimer:null};
const STREAM=()=>SUB('stream');
const docKey=(e,s)=>e+'_'+String(s).padStart(7,'0');
async function packText(str){
  if(window.CompressionStream){
    try{
      const cs=new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));
      const buf=new Uint8Array(await new Response(cs).arrayBuffer());
      let bin=''; for(let i=0;i<buf.length;i+=0x8000) bin+=String.fromCharCode.apply(null, buf.subarray(i,i+0x8000));
      return {z:1, d:btoa(bin)};
    }catch(e){}
  }
  return {z:0, d:str};
}
async function unpackText(z, d){
  if(!z) return d;
  const bin=atob(d), buf=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
  const ds=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(ds).text();
}
function mirStartSending(){
  clearInterval(MIR.every);
  MIR.every=setInterval(()=>ppPost({type:'snap'}), 60000);
}
function mirStopSending(){
  clearInterval(MIR.every); MIR.every=null;
  clearTimeout(MIR.timer); MIR.timer=0; MIR.buf=[];
  if(MIR.epoch && MTG_ID){
    MIR.epoch=0;
    MIR.chain=MIR.chain.then(()=>mirPrune(Infinity)).catch(()=>{});
  }
}
/* Pinching to zoom on a phone or tablet zooms this page, not the practice
   copy inside it, so the presenter's zoom is read here and sent as the part
   of the practice copy that is in view. */
function mirOuterZoom(){
  if(!MIR.epoch || !iPresent() || !PP.frame || !window.visualViewport) return;
  const v=visualViewport, r=PP.frame.getBoundingClientRect();
  let vv=[+v.scale.toFixed(3), Math.round(v.offsetLeft-r.left), Math.round(v.offsetTop-r.top)];
  if(v.scale<=1.01) vv=[1,0,0];
  const key=vv.join(',');
  if(key===MIR.vvKey) return;
  MIR.vvKey=key; mirQueue([{vv}]);
}
if(window.visualViewport){ visualViewport.addEventListener('resize', mirOuterZoom); visualViewport.addEventListener('scroll', mirOuterZoom); }
function mirRequestSnap(){ clearTimeout(MIR.reqTimer); MIR.reqTimer=setTimeout(()=>ppPost({type:'snap'}), 250); }
function mirSnap(snap){
  const epoch=Date.now(), json=JSON.stringify(snap);
  clearTimeout(MIR.timer); MIR.timer=0; MIR.buf=[];
  MIR.epoch=epoch; MIR.seq=0;
  MIR.chain=MIR.chain.then(async()=>{
    const pk=await packText(json), CH=700000, parts=Math.max(1, Math.ceil(pk.d.length/CH));
    const b=db.batch();
    for(let i=0;i<parts;i++) b.set(STREAM().doc(docKey(epoch,i)), {e:epoch, s:i, kind:'snap', parts, z:pk.z, d:pk.d.slice(i*CH,(i+1)*CH), at:Date.now()});
    // not waited on: a slow connection must never hold up the pieces behind it
    b.commit().then(()=>mirPrune(epoch)).catch(e=>console.error('mirror snapshot', e));
    // pieces that follow are numbered after the snapshot's parts
    if(MIR.epoch===epoch) MIR.seq=parts;
    MIR.vvKey=''; mirOuterZoom();
  }).catch(e=>console.error('mirror snapshot', e));
}
function mirQueue(ops){
  if(!MIR.epoch) return;
  MIR.buf.push(...ops);
  if(!MIR.timer) MIR.timer=setTimeout(mirFlush, 280);
}
function mirFlush(){
  MIR.timer=0;
  if(!MIR.epoch || !MIR.buf.length) return;
  const ops=MIR.buf; MIR.buf=[];
  const epoch=MIR.epoch;
  MIR.chain=MIR.chain.then(async()=>{
    if(MIR.epoch!==epoch) return;
    const s=MIR.seq++;
    const pk=await packText(JSON.stringify(ops));
    STREAM().doc(docKey(epoch,s)).set({e:epoch, s, kind:'ops', z:pk.z, d:pk.d, at:Date.now()}).catch(e=>console.error('mirror ops', e));
  }).catch(e=>console.error('mirror ops', e));
}
async function mirPrune(keepFrom){
  const s=await STREAM().get();
  const old=s.docs.filter(d=>(d.data().e||0)<keepFrom);
  for(let i=0;i<old.length;i+=400){ const b=db.batch(); old.slice(i,i+400).forEach(d=>b.delete(d.ref)); await b.commit(); }
}

/* ----- watching (follower) ----- */
const REP={on:false, unsub:null, epoch:0, next:0, docs:new Map(), nodes:new Map(), vw:0, vh:0, scale:1, ox:0, oy:0,
  head:null, scroll:new Map(), raf:0, busy:false, touches:new Map(), cursor:null, waitTimer:0};
const SVGNS='http://www.w3.org/2000/svg';
async function portalHead(){
  if(REP.head!=null) return REP.head;
  try{
    const html=await (await fetch(PORTAL_URL, {cache:'force-cache'})).text();
    const d=new DOMParser().parseFromString(html, 'text/html');
    REP.head=[...d.head.querySelectorAll('meta[charset],style,link[rel="stylesheet"],link[rel="preconnect"]')].map(n=>n.outerHTML).join('');
  }catch(e){ REP.head=''; }
  return REP.head;
}
function repStart(){
  if(REP.on) return;
  REP.on=true; REP.epoch=0; REP.next=0; REP.docs.clear(); REP.startedAt=Date.now(); REP.gapAt=0; REP.askedAt=Date.now();
  $('mirrorWait').textContent='';
  REP.waitTimer=setTimeout(()=>{ if(REP.on && !REP.epoch) $('mirrorWait').textContent='Connecting to '+((presenterLive()||{}).name||'the presenter')+'…'; }, 600);
  MREF().update({snapReq:Date.now()}).catch(()=>{});
  REP.unsub=STREAM().onSnapshot(snap=>{
    snap.docChanges().forEach(ch=>{ if(ch.type!=='removed'){ const d=ch.doc.data(); REP.docs.set(docKey(d.e,d.s), d); } });
    repProcess();
  }, e=>console.error('stream', e));
}
/* If a piece goes missing, or nothing arrives at all, a fresh full copy is
   asked for instead of waiting forever. */
function repWatch(){
  if(!REP.on) return;
  const now=Date.now();
  let stuck=false;
  if(!REP.epoch) stuck = now-REP.startedAt>4000;
  else {
    const ahead=[...REP.docs.values()].some(d=>d.e===REP.epoch && d.s>REP.next);
    if(ahead){ if(!REP.gapAt) REP.gapAt=now; stuck = now-REP.gapAt>2500; } else REP.gapAt=0;
  }
  if(stuck && now-(REP.askedAt||0)>5000){ REP.askedAt=now; REP.gapAt=0; MREF().update({snapReq:now}).catch(()=>{}); }
}
setInterval(repWatch, 1000);
function repStop(){
  if(!REP.on) return;
  REP.on=false;
  if(REP.unsub){ REP.unsub(); REP.unsub=null; }
  clearTimeout(REP.waitTimer);
  REP.docs.clear(); REP.epoch=0; REP.nodes.clear();
  const g=$('gestures'); if(g) g.innerHTML='';
  REP.touches.clear(); REP.cursor=null; REP.focus=null; REP.vv=[1,0,0];
  const f=$('mirrorFrame'); if(f){ f.removeAttribute('srcdoc'); f.dataset.ready=''; }
}
async function repProcess(){
  if(REP.busy || !REP.on) return;
  REP.busy=true;
  try{
    // the newest complete full copy wins
    let best=0;
    REP.docs.forEach(d=>{ if(d.kind==='snap' && d.e>best){ let ok=true; for(let i=0;i<d.parts;i++) if(!REP.docs.has(docKey(d.e,i))) ok=false; if(ok) best=d.e; } });
    if(best && best>REP.epoch){
      const first=REP.docs.get(docKey(best,0)); let d='';
      for(let i=0;i<first.parts;i++) d+=REP.docs.get(docKey(best,i)).d;
      const snap=JSON.parse(await unpackText(first.z, d));
      await repBuild(snap);
      REP.epoch=best; REP.next=first.parts; REP.gapAt=0;
      [...REP.docs.keys()].forEach(k=>{ if(+k.split('_')[0]<best) REP.docs.delete(k); });
      clearTimeout(REP.waitTimer); $('mirrorWait').textContent='';
    }
    if(REP.epoch){
      for(;;){
        const k=docKey(REP.epoch, REP.next), d=REP.docs.get(k);
        if(!d) break;
        REP.docs.delete(k); REP.next++;
        if(d.kind==='ops') repApply(JSON.parse(await unpackText(d.z, d.d)));
      }
    }
  }catch(e){ console.error('mirror', e); }
  REP.busy=false;
  // more may have arrived while this ran
  if(REP.on && [...REP.docs.values()].some(d=>(d.e===REP.epoch && d.s===REP.next) || (d.kind==='snap' && d.e>REP.epoch))) setTimeout(repProcess, 0);
}
function repDoc(){ const f=$('mirrorFrame'); return f && f.contentDocument; }
async function repBuild(snap){
  const f=$('mirrorFrame'); if(!f) return;
  if(f.dataset.ready!=='1'){
    const head=await portalHead();
    await new Promise(res=>{ f.onload=()=>res(); f.srcdoc='<!DOCTYPE html><html><head>'+head+'<style>html,body,*{scroll-behavior:auto!important}</style></head><body></body></html>'; });
    f.dataset.ready='1';
  }
  const doc=f.contentDocument;
  REP.nodes.clear(); REP.scroll.clear();
  syncAttrs(doc.documentElement, snap.html);
  const body=doc.body;
  syncAttrs(body, snap.body.a);
  REP.nodes.set(snap.body.i, body);
  while(body.firstChild) body.removeChild(body.firstChild);
  (snap.body.k||[]).forEach(c=>{ const n=repMake(doc,c); if(n) body.appendChild(n); });
  repAfterBuild(doc.body);
  repViewport(snap.vw, snap.vh);
  doc.scrollingElement.scrollTop=snap.sy[0]; doc.scrollingElement.scrollLeft=snap.sy[1];
  repZoom(snap.vv||[1,0,0]);
  REP.focus=snap.fo||null; repFocusRing();
}
/* Pinch zoom on the presenter's phone zooms the copy here the same way. */
function repZoom(vv){
  REP.vv=vv;
  const z=$('mirrorZoom'); if(!z) return;
  z.style.transition=RM.matches?'':'transform .12s linear';
  z.style.transform=vv[0]===1 && !vv[1] && !vv[2] ? '' : `scale(${vv[0]}) translate(${-vv[1]}px,${-vv[2]}px)`;
}
/* The field the presenter is typing in gets a soft ring. */
function repFocusRing(){
  const layer=$('gestures'); if(!layer) return;
  let ring=layer.querySelector('.gFocus');
  const el=REP.focus ? REP.nodes.get(REP.focus) : null;
  if(!el || !el.isConnected || !el.getBoundingClientRect){ if(ring) ring.remove(); return; }
  const r=el.getBoundingClientRect();
  if(!ring){ ring=document.createElement('div'); ring.className='gFocus'; layer.appendChild(ring); }
  ring.style.left=(r.left-2)+'px'; ring.style.top=(r.top-2)+'px'; ring.style.width=(r.width+4)+'px'; ring.style.height=(r.height+4)+'px';
}
function syncAttrs(el, a){
  if(!el || !a) return;
  [...el.attributes].forEach(at=>{ if(!(at.name in a)) el.removeAttribute(at.name); });
  for(const k in a){ if(el.getAttribute(k)!==a[k]){ try{ el.setAttribute(k, a[k]); }catch(e){} } }
}
function repMake(doc, o){
  if(o.x!=null){ const t=doc.createTextNode(o.x); REP.nodes.set(o.i, t); return t; }
  let el;
  try{ el=o.s ? doc.createElementNS(SVGNS, o.t) : doc.createElement(o.t); }catch(e){ return null; }
  for(const k in o.a){ try{ el.setAttribute(k, o.a[k]); }catch(e){} }
  REP.nodes.set(o.i, el);
  if(o.f!=null){
    el.setAttribute('srcdoc', '<body style="margin:0;display:flex;align-items:center;justify-content:center;height:100vh;font:600 15px system-ui,sans-serif;color:#7a879c;background:#f3f5f9">'+esc(o.f)+'</body>');
    return el;
  }
  (o.k||[]).forEach(c=>{ const n=repMake(doc,c); if(n) el.appendChild(n); });
  if(o.v!=null) el._v=o.v;
  if(o.c!=null) el._c=o.c;
  if(o.sc) el._sc=o.sc;
  return el;
}
function repAfterBuild(root){
  // form values and scroll positions can only be set once nodes are in place
  const walk=n=>{
    if(n._v!=null){ try{ n.value=n._v; }catch(e){} delete n._v; }
    if(n._c!=null){ n.checked=n._c; delete n._c; }
    if(n._sc){ n.scrollTop=n._sc[0]; n.scrollLeft=n._sc[1]; delete n._sc; }
    for(const c of n.children||[]) walk(c);
  };
  walk(root);
}
function repApply(ops){
  const doc=repDoc(); if(!doc) return;
  ops.forEach(op=>{
    if(op.k){
      const [pid, kids]=op.k;
      const parent=REP.nodes.get(pid); if(!parent || parent.nodeType!==1) return;
      while(parent.firstChild) parent.removeChild(parent.firstChild);
      kids.forEach(c=>{ const n=repMake(doc,c); if(n) parent.appendChild(n); });
      repAfterBuild(parent);
    } else if(op.a){
      const el=REP.nodes.get(op.a[0]); if(el && el.nodeType===1) syncAttrs(el, op.a[1]);
    } else if(op.h){
      syncAttrs(doc.documentElement, op.h);
    } else if(op.x){
      const t=REP.nodes.get(op.x[0]); if(t) t.data=op.x[1];
    } else if(op.v){
      const el=REP.nodes.get(op.v[0]); if(el){ try{ el.value=op.v[1]; }catch(e){} el.checked=op.v[2]; }
    } else if(op.sc){
      const [id, t, l]=op.sc;
      const el=id===0 ? doc.scrollingElement : REP.nodes.get(id);
      if(el){ REP.scroll.set(el, [t,l]); repTick(); }
    } else if(op.vp){
      repViewport(op.vp[0], op.vp[1]);
    } else if(op.vv){
      repZoom(op.vv);
    } else if('fo' in op){
      REP.focus=op.fo;
    } else if(op.p){
      gesture(op.p);
    }
  });
  repFocusRing();
}
/* Scrolling glides to where the presenter is rather than jumping. */
function repTick(){ if(!REP.raf) REP.raf=requestAnimationFrame(repFrame); }
function repFrame(){
  REP.raf=0;
  let again=false;
  REP.scroll.forEach((v,el)=>{
    if(!el.isConnected){ REP.scroll.delete(el); return; }
    const dt=v[0]-el.scrollTop, dl=v[1]-el.scrollLeft;
    if(Math.abs(dt)<1 && Math.abs(dl)<1 || RM.matches){ el.scrollTop=v[0]; el.scrollLeft=v[1]; REP.scroll.delete(el); return; }
    el.scrollTop+=dt*0.35; el.scrollLeft+=dl*0.35; again=true;
  });
  if(HL_RENDER_NEEDED()) renderHighlights();
  repFocusRing();
  if(again) repTick();
}
function repViewport(w,h){ REP.vw=w; REP.vh=h; mirFit(); }
/* The presenter's screen is shown at its own size, scaled to fit here. */
function mirFit(){
  const wrap=$('ppMirror'), box=$('mirrorBox'), f=$('mirrorFrame');
  if(!wrap || !box || !REP.vw) return;
  const W=wrap.clientWidth, H=wrap.clientHeight;
  const sc=Math.min(W/REP.vw, H/REP.vh);
  REP.scale=sc; REP.ox=(W-REP.vw*sc)/2; REP.oy=(H-REP.vh*sc)/2;
  box.style.width=REP.vw+'px'; box.style.height=REP.vh+'px';
  box.style.transform=`translate(${REP.ox}px,${REP.oy}px) scale(${sc})`;
  f.style.width=REP.vw+'px'; f.style.height=REP.vh+'px';
  renderHighlights();
}

/* ----- gestures drawn on the follower's screen ----- */
function gesture(p){
  const layer=$('gestures'); if(!layer) return;
  if(p.k==='w'){
    // a mouse wheel or trackpad scroll: a dot that glides the way the page moved
    const w=document.createElement('div'); w.className='gWheel';
    w.style.setProperty('--x', p.x+'px'); w.style.setProperty('--y', p.y+'px');
    w.style.setProperty('--dx', (-(p.dx||0)*36)+'px'); w.style.setProperty('--dy', (-(p.dy||0)*36)+'px');
    layer.appendChild(w); setTimeout(()=>w.remove(), 600);
    return;
  }
  if(p.k==='h'){
    // mouse moving without a click: a small ring follows it
    let c=REP.cursor;
    if(!c){ c=document.createElement('div'); c.className='gCursor'; layer.appendChild(c); REP.cursor=c; }
    c.style.transform=`translate(${p.x}px,${p.y}px)`;
    c.classList.remove('idle'); clearTimeout(c._t); c._t=setTimeout(()=>c.classList.add('idle'), 1600);
    return;
  }
  if(p.k==='d'){
    const t=document.createElement('div'); t.className='gTouch';
    t.innerHTML='<span></span>';
    t.style.transform=`translate(${p.x}px,${p.y}px)`;
    layer.appendChild(t);
    REP.touches.set(p.id, t);
    if(REP.cursor) REP.cursor.classList.add('idle');
  } else if(p.k==='m'){
    const t=REP.touches.get(p.id); if(t) t.style.transform=`translate(${p.x}px,${p.y}px)`;
  } else if(p.k==='u'){
    const t=REP.touches.get(p.id); REP.touches.delete(p.id);
    if(t){ t.style.transform=`translate(${p.x}px,${p.y}px)`; t.classList.add('lift'); setTimeout(()=>t.remove(), 420); }
    if(p.tap) tapGlow(p.tap);
  }
}
function tapGlow(id){
  const el=REP.nodes.get(id), layer=$('gestures');
  if(!el || !el.isConnected || !el.getBoundingClientRect || !layer) return;
  const r=el.getBoundingClientRect();
  if(!r.width && !r.height) return;
  const g=document.createElement('div'); g.className='gTap';
  g.style.left=r.left+'px'; g.style.top=r.top+'px'; g.style.width=r.width+'px'; g.style.height=r.height+'px';
  layer.appendChild(g);
  setTimeout(()=>g.remove(), 1300);
}

/* ----- highlight boxes the presenter draws -----
   Each box remembers the scrolling area it was drawn over and how far that
   area was scrolled, so it moves with the page under it and disappears with
   the pop-up it was drawn on. While Highlight is on, the presenter can draw
   boxes, drag them to move them, pull the corner to resize, and remove them;
   Done hands the portal back. */
let HL={mode:false, draft:null, drag:null};
const HL_RENDER_NEEDED=()=>!!(MTG && MTG.hl && MTG.hl.length) || !!HL.draft;
function setHlMode(on){
  HL.mode=!!on; HL.drag=null; HL.draft=null;
  const L=$('hlLayer'); if(L) L.classList.toggle('drawing', HL.mode);
  ppRenderBar(); renderHighlights();
}
function clearHighlights(){ MTG.hl=[]; renderHighlights(); ppRenderBar(); MREF().update({hl:[]}).catch(fail); }
function ownScroll(sid){
  try{ const w=PP.frame && PP.frame.contentWindow; return w && w.GH_MIRROR ? w.GH_MIRROR.scrollOf(sid) : null; }catch(e){ return null; }
}
function repScroll(sid){
  const doc=repDoc(); if(!doc) return null;
  const el=sid ? REP.nodes.get(sid) : doc.scrollingElement;
  return (el && el.isConnected) ? [el.scrollTop, el.scrollLeft] : null;
}
function hlGeom(h){ return (HL.drag && HL.drag.id===h.id) ? Object.assign({}, h, HL.drag.cur) : h; }
function renderHighlights(){
  const L=$('hlLayer'); if(!L) return;
  const list=(MTG && MTG.hl) || [];
  const watching=REP.on && REP.epoch && !$('ppMirror').classList.contains('hidden');
  const mine=iPresent(), edit=mine && HL.mode;
  let boxes=[];
  if(mine || watching){
    boxes=list.map(h0=>{
      const h=hlGeom(h0);
      const sc=mine ? ownScroll(h.sid) : repScroll(h.sid);
      if(!sc) return null;
      let x=h.x-(sc[1]-h.sl), y=h.y-(sc[0]-h.st), w=h.w, hh=h.h;
      if(!mine){ x=REP.ox+x*REP.scale; y=REP.oy+y*REP.scale; w*=REP.scale; hh*=REP.scale; }
      return {id:h.id, x, y, w, h:hh};
    }).filter(Boolean);
  }
  if(HL.draft && edit) boxes.push(Object.assign({id:'_draft', draft:true}, HL.draft));
  // placed by hand (left and top), so nothing can slide a new box to the corner
  const seen=new Set();
  boxes.forEach(b=>{
    seen.add(b.id);
    let el=L.querySelector(`.hlBox[data-id="${b.id}"]`);
    if(!el){
      el=document.createElement('div'); el.className='hlBox'+(b.draft?' draft':''); el.dataset.id=b.id;
      if(!b.draft) el.innerHTML='<button class="hlX" aria-label="Remove highlight">&times;</button><span class="hlRs" aria-hidden="true"></span>';
      L.appendChild(el);
    }
    el.style.left=b.x+'px'; el.style.top=b.y+'px'; el.style.width=Math.max(0,b.w)+'px'; el.style.height=Math.max(0,b.h)+'px';
    el.classList.toggle('moving', !!(HL.drag && HL.drag.id===b.id));
  });
  [...L.children].forEach(el=>{ if(!seen.has(el.dataset.id)) el.remove(); });
  L.classList.toggle('drawing', edit);
}
function hlSave(list){
  MTG.hl=list;
  MREF().update({hl:list}).catch(fail);
}
(function(){
  let start=null;
  const layerXY=e=>{ const r=$('hlLayer').getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  document.addEventListener('pointerdown', e=>{
    const L=$('hlLayer');
    if(!L || !HL.mode || !iPresent() || !L.contains(e.target) || start) return;
    e.preventDefault();
    const [x,y]=layerXY(e);
    const box=e.target.closest('.hlBox:not(.draft)');
    if(e.target.closest('.hlX') && box){
      hlSave((MTG.hl||[]).filter(h=>h.id!==box.dataset.id)); renderHighlights(); ppRenderBar(); return;
    }
    try{ L.setPointerCapture(e.pointerId); }catch(err){}
    if(box){
      const h=(MTG.hl||[]).find(v=>v.id===box.dataset.id); if(!h) return;
      start={kind:e.target.closest('.hlRs')?'size':'move', id:e.pointerId, x, y};
      HL.drag={id:h.id, kind:start.kind, orig:{x:h.x, y:h.y, w:h.w, h:h.h}, cur:{x:h.x, y:h.y, w:h.w, h:h.h}, sentAt:0};
      renderHighlights(); return;
    }
    start={kind:'draw', id:e.pointerId, x, y};
    HL.draft={x, y, w:0, h:0};
    renderHighlights();
  });
  document.addEventListener('pointermove', e=>{
    if(!start || e.pointerId!==start.id) return;
    const [x,y]=layerXY(e), dx=x-start.x, dy=y-start.y;
    if(start.kind==='draw'){ HL.draft={x:Math.min(x,start.x), y:Math.min(y,start.y), w:Math.abs(dx), h:Math.abs(dy)}; }
    else if(HL.drag){
      const o=HL.drag.orig;
      HL.drag.cur = start.kind==='move' ? {x:Math.round(o.x+dx), y:Math.round(o.y+dy), w:o.w, h:o.h}
                                        : {x:o.x, y:o.y, w:Math.max(24, Math.round(o.w+dx)), h:Math.max(24, Math.round(o.h+dy))};
      // followers see the box move while it is dragged
      const now=Date.now();
      if(now-HL.drag.sentAt>220){ HL.drag.sentAt=now; const c=HL.drag.cur, id=HL.drag.id; MREF().update({hl:(MTG.hl||[]).map(h=>h.id===id?Object.assign({}, h, c):h)}).catch(()=>{}); }
    }
    renderHighlights();
  });
  const end=e=>{
    if(!start || e.pointerId!==start.id) return;
    const kind=start.kind; start=null;
    if(kind==='draw'){
      const d=HL.draft; HL.draft=null;
      if(d && d.w>10 && d.h>10){
        let a={sid:0, st:0, sl:0};
        try{ a=PP.frame.contentWindow.GH_MIRROR.anchorAt(d.x+d.w/2, d.y+d.h/2); }catch(err){}
        hlSave((MTG.hl||[]).concat([{id:uid(), x:Math.round(d.x), y:Math.round(d.y), w:Math.round(d.w), h:Math.round(d.h), sid:a.sid, st:a.st, sl:a.sl}]));
        ppRenderBar();
      }
    } else if(HL.drag){
      const c=HL.drag.cur, id=HL.drag.id; HL.drag=null;
      hlSave((MTG.hl||[]).map(h=>h.id===id?Object.assign({}, h, c):h));
    }
    renderHighlights();
  };
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
  // scrolling with a mouse or trackpad still scrolls the portal under the boxes
  document.addEventListener('wheel', e=>{
    const L=$('hlLayer');
    if(!L || !HL.mode || !L.contains(e.target) || !PP.frame) return;
    e.preventDefault();
    try{
      const d=PP.frame.contentDocument, [x,y]=layerXY(e);
      let el=d.elementFromPoint(x,y);
      while(el && el!==d.body && el!==d.documentElement){
        const cs=d.defaultView.getComputedStyle(el);
        if(/(auto|scroll)/.test(cs.overflowY+cs.overflowX) && (el.scrollHeight>el.clientHeight+1 || el.scrollWidth>el.clientWidth+1)) break;
        el=el.parentElement;
      }
      if(!el || el===d.body || el===d.documentElement) el=d.scrollingElement;
      const f=e.deltaMode===1?16:1;
      el.scrollBy(e.deltaX*f, e.deltaY*f);
    }catch(err){}
  }, {passive:false, capture:true});
  // the presenter's boxes follow their own scrolling too
  setInterval(()=>{ if(iPresent() && HL_RENDER_NEEDED() && TAB==='practice') renderHighlights(); }, 120);
})();
/* Wipes the practice jobs for everyone and starts them again from the

const taskById=id=>TASKS.find(t=>t.id===id);

/* ----- the person doing the tasks ----- */
const TK={active:false, doc:null, log:[], seen:{}, level:{}, hint:null, lastHead:0, timer:0, msg:'', answer:false, collapsed:false, hooked:null, popFor:null};
const myTasks=()=>DATA.tasks.find(t=>t.id===(ME && ME.uid));
function tkDismissKey(){ return 'gh_mtg_tasks_closed_'+MTG_ID; }
function tkDismissed(d){ try{ return sessionStorage.getItem(tkDismissKey())===String(d.at); }catch(e){ return false; } }
function taskOnData(){
  // tasks that no longer exist are dropped from anything already assigned
  DATA.tasks.forEach(x=>{ x.tasks=(x.tasks||[]).filter(id=>taskById(id)); });
  const d=myTasks();
  TK.doc=d||null;
  if(!d || d.status==='cancelled'){ tkHidePop(); if(TK.active) tkExit(); renderTaskProgress(); return; }
  if(d.status==='new') tkShowPop(d); else tkHidePop();
  if((d.status==='active' || d.status==='done') && !TK.active && !tkDismissed(d)) tkEnter(false);
  renderTaskPanel(); renderTaskProgress();
}
function tkShowPop(d){
  if(TK.popFor===d.at && $('tkPop')) return;
  TK.popFor=d.at; tkHidePop(true);
  const el=document.createElement('button'); el.type='button'; el.id='tkPop'; el.className='tkPop';
  el.innerHTML=`<span class="tkPopIc">${icon('check')}</span><span class="tkPopBody"><b>New Practice Task${d.tasks.length>1?'s':''}</b>
    <span class="tkPopFrom">From ${esc(d.byName||'')}</span>
    <span class="tkPopList">${d.tasks.map(id=>taskById(id)).filter(Boolean).map(t=>`<span>${esc(t.title)}</span>`).join('')}</span></span>`;
  el.onclick=tkStart;
  document.body.appendChild(el);
}
function tkHidePop(instant){
  const el=$('tkPop'); if(!el) return;
  if(instant || RM.matches){ el.remove(); return; }
  el.classList.add('out'); setTimeout(()=>el.remove(), 260);
}
function tkStart(){
  const d=myTasks(); if(!d) return;
  tkHidePop();
  try{ sessionStorage.removeItem(tkDismissKey()); }catch(e){}
  SUB('tasks').doc(ME.uid).update({status:'active', startedAt:Date.now(), done:{}, attempts:0, hints:0, answers:[]}).catch(fail);
  d.status='active'; d.done={}; d.attempts=0; d.hints=0; d.answers=[];
  tkEnter(true);
}
function tkEnter(fresh){
  TK.active=true; TK.log=[]; TK.seen={}; TK.level={}; TK.hint=null; TK.msg=''; TK.answer=!!(TK.doc && (TK.doc.answers||[]).length); TK.lastHead=Date.now(); TK.collapsed=false;
  if(TAB!=='practice') showTab('practice');
  ppSetPrivate(true, fresh);
  clearInterval(TK.timer); TK.timer=setInterval(tkTick, 1000);
  renderTaskPanel(); ppRenderBar();
}
function tkExit(){
  TK.active=false; clearInterval(TK.timer); TK.timer=0; TK.hint=null;
  ppSetPrivate(false, false);
  renderTaskPanel(); ppRenderBar();
}
function tkBackToShared(){
  const d=myTasks(); if(d){ try{ sessionStorage.setItem(tkDismissKey(), String(d.at)); }catch(e){} }
  tkExit();
}
/* Every function the practice copy runs is noted, so a task can tell what
   was tapped (opening a job, a search, copying an email) as well as what changed. */
const TK_WATCH=['openWorkOrder','goToWorkOrderInWorkflow','selectSearchResult','runGlobalSearch','toggleSearchBar','switchTab','openNewWorkOrder',
  'startHeaderCustEdit','openNoteSheet','openFieldNote','openJobDetailsEdit','addJDBulk','toggleDocsView','setFieldView','toggleAdminView','openScheduleWidget',
  'openScheduleEdit','openPresiteTool','openEstimateSplit','openEsignSplit','openInvoiceSplit','doneSplit','approveEstimate','declineEstimate','modifyEstimate',
  'confirmJobComplete','openSendInvoice','copyToClipboard','copyText','checkInDay','checkOutDay'];
function tkHook(){
  const W=PP.frame && PP.frame.contentWindow;
  if(!W || !W.GH_PRIVATE || TK.hooked===W) return;
  TK.hooked=W;
  TK_WATCH.forEach(n=>{
    const f=W[n]; if(typeof f!=='function' || f._tk) return;
    const w=function(...a){ try{ TK.log.push({f:n, a:a.map(x=>(x && typeof x==='object')?null:x), t:Date.now()}); if(TK.log.length>600) TK.log.shift(); }catch(e){} return f.apply(this, a); };
    w._tk=true; W[n]=w;
  });
}
function tkState(){
  const W=PP.frame && PP.frame.contentWindow;
  if(!W || !W.GH_PRIVATE || typeof W.getWO!=='function') return null;
  let DB=null; try{ DB=W.eval('DB'); }catch(e){}
  if(!DB || !DB.workOrders || !DB.workOrders.length) return null;
  const L=TK.log;
  const S={W, DB, d:W.document, L, today:tkIsoOff(0), tomorrow:tkIsoOff(1),
    wo:id=>W.getWO(id),
    state:n=>{ try{ return W.eval(n); }catch(e){ return undefined; } },
    called:(f, test)=>L.some(e=>e.f===f && (!test || test(e.a))),
    opened:id=>L.some(e=>['openWorkOrder','goToWorkOrderInWorkflow','selectSearchResult'].includes(e.f) && e.a[0]==id),
    after:(f1, f2, test2, test1)=>{ const i=L.findIndex(e=>e.f===f1 && (!test1 || test1(e.a))); return i>=0 && L.slice(i+1).some(e=>e.f===f2 && (!test2 || test2(e.a))); }
  };
  return S;
}
function tkRun(){
  const d=TK.doc, S=tkState();
  if(!d || !S) return null;
  const done=Object.assign({}, d.done||{});
  let changed=false;
  d.tasks.forEach(id=>{
    const t=taskById(id); if(!t || done[id]) return;
    let ok=false; try{ ok=!!t.check(S); }catch(e){}
    if(ok){ done[id]=Date.now(); changed=true; TK.lastHead=Date.now(); if(TK.hint && TK.hint.id===id) TK.hint=null; return; }
    let n=0; (t.steps||[]).forEach(f=>{ try{ if(f(S)) n++; }catch(e){} });
    if(n>(TK.seen[id]||0)){ TK.seen[id]=n; TK.lastHead=Date.now(); }
  });
  if(changed){
    d.done=done;
    const all=d.tasks.every(id=>done[id]);
    const upd={done};
    if(all){ upd.status='done'; upd.doneAt=Date.now(); d.status='done'; TK.hint=null; TK.msg=''; }
    SUB('tasks').doc(ME.uid).update(upd).catch(()=>{});
    renderTaskPanel(true);
  }
  return S;
}
function tkTick(){
  const d=TK.doc;
  if(!TK.active || !d || d.status!=='active') return;
  tkHook();
  const S=tkRun(); if(!S) return;
  if(d.status!=='active') return;
  if(TAB!=='practice' || document.visibilityState!=='visible'){ TK.lastHead=Date.now(); return; }
  // a nudge when no headway has been made for a while
  if(Date.now()-TK.lastHead>TK_STALL_MS){
    const id=d.tasks.find(x=>!(d.done||{})[x]), t=taskById(id);
    if(t){
      const lv=Math.min((TK.level[id]||0)+1, t.hints.length);
      if(lv>(TK.level[id]||0)){
        TK.level[id]=lv; TK.hint={id, lv, text:t.hints[lv-1].t}; TK.collapsed=false;
        d.hints=(d.hints||0)+1;
        SUB('tasks').doc(ME.uid).update({hints:d.hints}).catch(()=>{});
        // from the second nudge on, the place to look is lit up in the portal
        if(lv>=2){ let g=null; for(let i=lv-1;i>=0 && !g;i--) g=t.hints[i].g; if(g){ try{ tkGlow(S, g(S)); }catch(e){} } }
        renderTaskPanel();
      }
    }
    TK.lastHead=Date.now();
  }
}
function tkGlow(S, el){
  if(!el) return;
  const doc=S.d;
  // a card tucked behind others in a stacked list is brought to the front first
  try{ if(el.__rolo && el.dataset.woId) el.__rolo.goToId(+el.dataset.woId); }catch(e){}
  if(!doc.getElementById('tkGlowCss')){
    const st=doc.createElement('style'); st.id='tkGlowCss';
    st.textContent='.tkGlow{outline:3px solid #f2b200 !important;outline-offset:3px !important;animation:tkGlow 1.1s ease-in-out 5 !important;}@keyframes tkGlow{50%{outline-color:rgba(242,178,0,.15)}}';
    doc.head.appendChild(st);
  }
  el.classList.add('tkGlow');
  setTimeout(()=>el.classList.remove('tkGlow'), 6000);
}
function tkCheck(){
  const d=TK.doc; if(!d || d.status!=='active') return;
  tkHook();
  const S=tkRun();
  if(d.status==='done'){ renderTaskPanel(); return; }
  if(!S){ TK.msg='The practice portal is still loading.'; renderTaskPanel(); return; }
  d.attempts=(d.attempts||0)+1;
  SUB('tasks').doc(ME.uid).update({attempts:d.attempts}).catch(()=>{});
  const left=d.tasks.filter(id=>!(d.done||{})[id]).length;
  TK.msg=left===1 ? 'Not done yet. One task is still open.' : `Not done yet. ${left} tasks are still open.`;
  renderTaskPanel();
  const p=$('tkPanel'); if(p && !RM.matches) p.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(-3px)'},{transform:'translateX(0)'}], {duration:320});
}
function tkShowAnswer(){
  const d=TK.doc; if(!d || (d.attempts||0)<3) return;
  TK.answer=true;
  const open=d.tasks.filter(id=>!(d.done||{})[id]);
  d.answers=[...new Set((d.answers||[]).concat(open))];
  SUB('tasks').doc(ME.uid).update({answers:d.answers}).catch(()=>{});
  renderTaskPanel();
}
const tkWideMQ=window.matchMedia('(min-width:1100px)');
function renderTaskPanel(celebrate){
  let p=$('tkPanel');
  const d=TK.doc, show=!!(TK.active && d && (d.status==='active' || d.status==='done') && TAB==='practice' && MTG);
  /* On a wide screen the card sits beside the practice portal instead of over it. */
  const side=show && tkWideMQ.matches && !!$('ppStage');
  if(document.body.classList.contains('tkSide')!==side){ document.body.classList.toggle('tkSide', side); requestAnimationFrame(()=>{ ppFit(); mirFit(); }); }
  const bottom=show && !side;
  if(document.body.classList.contains('tkBottom')!==bottom){ document.body.classList.toggle('tkBottom', bottom); if(!bottom) document.body.style.removeProperty('--tkH'); requestAnimationFrame(()=>{ ppFit(); mirFit(); }); }
  if(!show){ if(p) p.remove(); return; }
  if(!p){
    p=document.createElement('div'); p.id='tkPanel'; p.className='tkPanel';
    // the practice portal ends where the card begins, so nothing is covered
    new ResizeObserver(()=>{ if(document.body.classList.contains('tkBottom') && p.isConnected){ document.body.style.setProperty('--tkH', (p.offsetHeight+16)+'px'); ppFit(); mirFit(); } }).observe(p);
  }
  const parent=side ? $('ppStage') : document.body;
  if(p.parentNode!==parent) parent.appendChild(p);
  p.classList.toggle('collapsed', TK.collapsed);
  const done=d.done||{}, n=d.tasks.filter(id=>done[id]).length, all=d.status==='done';
  const ans=new Set(d.answers||[]);
  const head=`<button type="button" class="tkHead" onclick="TK.collapsed=!TK.collapsed;renderTaskPanel()" aria-expanded="${!TK.collapsed}">
      <span class="tkHeadIc">${icon('check')}</span><span class="tkHeadT">Tasks</span><span class="tkCount">${n} of ${d.tasks.length}</span>
      <span class="tkChev">${icon('up')}</span></button>`;
  if(all){
    const mins=Math.max(1, Math.round(((d.doneAt||Date.now())-(d.startedAt||Date.now()))/60000));
    p.innerHTML=head+`<div class="tkBody"><div class="tkDone"><span class="tkDoneIc">${icon('check')}</span><div><b>All done</b><span>${mins} min</span></div></div>
      <button class="btn tkBtn" onclick="tkBackToShared()">Back to Shared Practice</button></div>`;
    if(celebrate && !RM.matches) p.querySelector('.tkDone').animate([{transform:'scale(.8)', opacity:0},{transform:'scale(1.05)', opacity:1},{transform:'scale(1)'}], {duration:420, easing:'cubic-bezier(.16,1,.3,1)'});
    return;
  }
  const items=d.tasks.map((id,i)=>{
    const t=taskById(id); if(!t) return '';
    const ok=!!done[id], hint=TK.hint && TK.hint.id===id && !ok ? TK.hint : null;
    return `<li class="tkItem ${ok?'ok':''}">
      <span class="tkNum">${ok?icon('check'):i+1}</span>
      <div class="tkTxt"><b>${esc(t.title)}</b><span>${esc(t.text)}</span>
        ${hint?`<div class="tkHint"><span class="tkBulb">${icon('bulb')}</span>${esc(hint.text)}</div>`:''}
        ${(!ok && TK.answer && ans.has(id))?`<ol class="tkAns">${t.answer.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:''}
      </div></li>`;
  }).join('');
  const tries=d.attempts||0;
  p.innerHTML=head+`<div class="tkBody"><ol class="tkList">${items}</ol>
    ${TK.msg?`<div class="tkMsg">${esc(TK.msg)}</div>`:''}
    <div class="tkFoot"><button class="btn tkBtn" onclick="tkCheck()">${icon('check')}Check</button>
      ${tries>=3 && !TK.answer?`<button class="btn secondary sm" onclick="tkShowAnswer()">Show Answer</button>`:''}
      <span class="tkTries">${tries?`Tries: ${tries}`:''}</span></div></div>`;
}

/* ----- assigning (admins) ----- */
const TKS={open:false, people:new Set(), tasks:new Set()};
function openTaskSheet(){ TKS.open=true; renderTaskSheet(true); }
function closeTaskSheet(){ TKS.open=false; const s=$('tkSheet'); if(s){ if(RM.matches) s.remove(); else { s.classList.add('out'); setTimeout(()=>s.remove(), 220); } } }
function tkPeople(){
  const live=new Set(livePeople().map(p=>p.id));
  return Object.values(USERS||{}).filter(u=>u.uid && u.username).map(u=>({uid:u.uid, name:u.username, admin:!!u.isAdmin, here:live.has(u.uid)}))
    .sort((a,b)=>(b.here-a.here) || a.name.localeCompare(b.name));
}
function tkToggle(set, key){ if(TKS[set].has(key)) TKS[set].delete(key); else TKS[set].add(key); renderTaskSheet(); }
function tkTaskBlocked(t){
  const people=tkPeople().filter(p=>TKS.people.has(p.uid));
  if(t.admin && people.some(p=>!p.admin)) return true;
  if(t.moves && t.job) for(const id of TKS.tasks){ const o=taskById(id); if(o && o.id!==t.id && o.moves && o.job===t.job) return true; }
  return false;
}
function tkFmtDur(ms){ const m=Math.floor(ms/60000), s=Math.floor(ms/1000)%60; return m+':'+String(s).padStart(2,'0'); }
function renderTaskSheet(first){
  if(!TKS.open) return;
  let s=$('tkSheet');
  if(!s){ s=document.createElement('div'); s.id='tkSheet'; s.className='tkSheet'; s.onclick=e=>{ if(e.target===s) closeTaskSheet(); }; document.body.appendChild(s); }
  const keepScroll=s.querySelector('.tkCard') ? s.querySelector('.tkCard').scrollTop : 0;
  // anything ticked that has become blocked is let go
  TASKS.forEach(t=>{ if(TKS.tasks.has(t.id) && tkTaskBlocked(t)) TKS.tasks.delete(t.id); });
  const people=tkPeople();
  const groups=TASK_AREAS.map(([a,label])=>{
    const list=TASKS.filter(t=>t.area===a); if(!list.length) return '';
    return `<div class="tkGroup"><div class="tkGroupT">${esc(label)}</div>${list.map(t=>{
      const blocked=tkTaskBlocked(t), on=TKS.tasks.has(t.id);
      return `<button type="button" class="tkPick ${on?'on':''}" ${blocked?'disabled':''} onclick="tkToggle('tasks','${t.id}')"><span class="tkBox">${on?icon('check'):''}</span><span><b>${esc(t.title)}</b><span>${esc(t.text)}</span></span></button>`;
    }).join('')}</div>`;
  }).join('');
  s.innerHTML=`<div class="tkCard${first?' enter':''}" role="dialog" aria-label="Practice Tasks">
    <div class="tkCardHead"><h2>Practice Tasks</h2><button class="iconBtn" aria-label="Close" onclick="closeTaskSheet()">${icon('x')}</button></div>
    <div id="tkProgBox"></div>
    <div class="tkSec"><div class="tkSecT">Assign To</div><div class="tkPeople">${people.map(p=>`<button type="button" class="tkPerson ${TKS.people.has(p.uid)?'on':''}" style="--pc:${colorFor(p.name)}" onclick="tkToggle('people','${p.uid}')"><span class="av">${esc(p.name.slice(0,1))}</span>${esc(p.name)}${p.here?'<span class="here"></span>':''}</button>`).join('')}</div></div>
    <div class="tkSec"><div class="tkSecT">Tasks <span class="count">${TKS.tasks.size}</span></div>${groups}</div>
    <div class="tkCardFoot"><button class="btn secondary" onclick="closeTaskSheet()">Cancel</button>
      <button class="btn tc" ${(TKS.people.size && TKS.tasks.size)?'':'disabled'} onclick="tkAssign()">Assign</button></div>
  </div>`;
  const c=s.querySelector('.tkCard'); if(c) c.scrollTop=keepScroll;
  renderTaskProgress();
}
/* who has which tasks, and how they are doing, kept up to date while open */
function renderTaskProgress(){
  const box=$('tkProgBox'); if(!box) return;
  const status={new:'Sent', active:'Working', done:'Done', cancelled:'Cancelled'};
  const prog=DATA.tasks.filter(d=>d.status!=='cancelled').sort((a,b)=>(b.at||0)-(a.at||0)).map(d=>{
    const done=d.done||{}, n=d.tasks.filter(id=>done[id]).length;
    const dur=d.startedAt ? tkFmtDur((d.doneAt||Date.now())-d.startedAt) : '';
    return `<div class="tkProg ${d.status}">
      <div class="tkProgTop"><span class="av" style="--pc:${colorFor(d.name)}">${esc(String(d.name||'?').slice(0,1))}</span><b>${esc(d.name||'')}</b>
        <span class="tkPill">${status[d.status]||''}</span><span class="grow"></span>
        <button class="iconBtn" aria-label="Remove" onclick="tkCancel('${d.id}')">${icon('x')}</button></div>
      <div class="tkBar"><span style="width:${d.tasks.length?Math.round(n/d.tasks.length*100):0}%"></span></div>
      <div class="tkProgList">${d.tasks.map(id=>{ const t=taskById(id); return t?`<span class="${done[id]?'ok':''} ${(d.answers||[]).includes(id)?'ans':''}">${done[id]?icon('check'):''}${esc(t.title)}</span>`:''; }).join('')}</div>
      <div class="tkStats">${dur?`<span>${dur}</span>`:''}<span>Tries ${d.attempts||0}</span><span>Hints ${d.hints||0}</span>${(d.answers||[]).length?`<span class="warn">Answer shown</span>`:''}</div>
    </div>`;
  }).join('');
  box.innerHTML=prog?`<div class="tkSec"><div class="tkSecT">Progress</div>${prog}</div>`:'';
}
function tkAssign(){
  if(!TKS.people.size || !TKS.tasks.size) return;
  const order=TASKS.map(t=>t.id).filter(id=>TKS.tasks.has(id));
  const people=tkPeople().filter(p=>TKS.people.has(p.uid));
  const b=db.batch();
  people.forEach(p=>b.set(SUB('tasks').doc(p.uid), {uid:p.uid, name:p.name, tasks:order, by:ME.uid, byName:ME.name, at:Date.now(), status:'new', done:{}, attempts:0, hints:0, answers:[]}));
  b.commit().then(()=>toast(people.length===1 ? 'Sent to '+people[0].name+'.' : 'Sent to '+people.length+' people.')).catch(fail);
  TKS.people.clear(); TKS.tasks.clear();
  renderTaskSheet();
}
async function tkCancel(uid){
  const d=DATA.tasks.find(x=>x.id===uid); if(!d) return;
  if(!await askYesNo('Remove these tasks?', d.name||'', 'Remove', true)) return;
  SUB('tasks').doc(uid).delete().catch(fail);
}
setInterval(()=>{ if(TKS.open && DATA.tasks.some(d=>d.status==='active')) renderTaskProgress(); }, 1000);
tkWideMQ.addEventListener('change', ()=>renderTaskPanel());

boot();
</script>
