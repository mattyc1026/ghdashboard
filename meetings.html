<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Good &amp; Handy Meetings</title>
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script>
/* Display settings are shared with the portal on this device. */
(function(){
  try{
    var r=document.documentElement;
    if(localStorage.getItem('gh_dark_mode')==='1') r.classList.add('dark');
    if(localStorage.getItem('gh_high_contrast')==='1') r.classList.add('hc');
    var M=[15,18,21,25,29], D=[14,16,18,21,24];
    var i=M.indexOf(parseInt(localStorage.getItem('gh_text_scale'),10));
    if(i<0) i=M.length-1;
    r.style.setProperty('--mScale', M[i]+'px');
    r.style.setProperty('--dScale', D[i]+'px');
  }catch(e){}
})();
</script>
<style>
/* ---- Colour ----
   Navy and orange come from the logo. Each of the three tools has a colour
   of its own, agenda orange, whiteboard blue and practice red. Like the
   portal's job cards, each tool's colour washes in from one side and fades
   away across its surfaces. */
:root{
  --navy:#0f2647; --navy-2:#1b3f73; --orange:#e8791a;
  --cream:#e9edf3; --paper:#ffffff; --ink:#141f33; --muted:#5f6e87;
  --line:#dbe2ec; --line-soft:#eaeef4; --grid-line:rgba(15,38,71,.045);
  --red:#c0392b; --green:#1f8a55; --blue:#2f6fd6;
  --c-agenda:#e8791a; --c-board:#2f6fd6; --c-actions:#1f8a55; --c-practice:#c0392b;
  --on-c:#ffffff;
  --board:#fbfcfe; --board-mark:rgba(47,111,214,.18);
  /* raised and recessed surfaces */
  --raise-hi:rgba(255,255,255,.95); --raise-lo:rgba(15,38,71,.07);
  --raise-sh:0 1px 2px rgba(15,38,71,.08),0 6px 16px rgba(15,38,71,.08);
  --well:#e3e8f0; --well-in:inset 0 2px 5px rgba(15,38,71,.13),inset 0 1px 1px rgba(15,38,71,.08),inset 0 -1px 0 rgba(255,255,255,.85);
  --f-display:'DM Serif Display',Georgia,serif;
  --f-body:'DM Sans',system-ui,-apple-system,sans-serif;
  --radius:14px; --radius-sm:9px;
  --sh-1:0 1px 2px rgba(15,38,71,.06),0 2px 6px rgba(15,38,71,.06);
  --sh-2:0 10px 28px rgba(15,38,71,.16);
  --ease:cubic-bezier(.2,.8,.2,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --tc:var(--c-agenda);
}
html.dark{
  color-scheme:dark;
  --navy:#dbe5f5; --navy-2:#16233a; --orange:#ff9a45;
  --cream:#0e1522; --paper:#161f30; --ink:#e7edf7; --muted:#94a3bb;
  --line:#2b3a54; --line-soft:#1f2c42; --grid-line:rgba(219,229,245,.04);
  --red:#ff8f7d; --green:#4fd48a; --blue:#7aa8ff;
  --c-agenda:#ff9a45; --c-board:#7aa8ff; --c-actions:#4fd48a; --c-practice:#ff8f7d;
  --on-c:#0e1522;
  --board:#121b2b; --board-mark:rgba(122,168,255,.18);
  --raise-hi:rgba(255,255,255,.07); --raise-lo:rgba(0,0,0,.35);
  --raise-sh:0 1px 2px rgba(0,0,0,.5),0 8px 18px rgba(0,0,0,.35);
  --well:#0b111c; --well-in:inset 0 2px 6px rgba(0,0,0,.6),inset 0 1px 1px rgba(0,0,0,.4),inset 0 -1px 0 rgba(255,255,255,.05);
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 12px 30px rgba(0,0,0,.55);
}
html.hc{ --line:#0f2647; --muted:#2b3a54; --ink:#000; }
html.dark.hc{ --line:#dbe5f5; --muted:#c9d4e6; --ink:#fff; }
body[data-tab=agenda]{--tc:var(--c-agenda);}
body[data-tab=board]{--tc:var(--c-board);}
body[data-tab=actions]{--tc:var(--c-actions);}
body[data-tab=practice]{--tc:var(--c-practice);}

*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:var(--f-body);color:var(--ink);font-size:var(--dScale,16px);line-height:1.5;
  background-color:var(--cream);
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:24px 24px;min-height:100vh;}
/* The open tool's colour washes down from the top of the page and fades. */
body::before{content:"";position:fixed;left:0;right:0;top:0;height:min(460px,60vh);pointer-events:none;z-index:0;
  background:linear-gradient(180deg,color-mix(in srgb, var(--tc) 16%, transparent),transparent);transition:background .4s;}
@media (max-width:900px){ body{font-size:var(--mScale,18px);} }
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
@media (max-width:900px){ input,select,textarea{font-size:max(16px,1em);} }
.hidden{display:none !important;}
:focus-visible{outline:2.5px solid var(--tc);outline-offset:2px;}

/* ---- top bar, with the tool colours as a stripe under it ---- */
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top));
  background:var(--navy);color:#fff;}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;
  background:linear-gradient(90deg,var(--c-agenda),var(--c-board) 35%,var(--c-actions) 65%,var(--c-practice));}
html.dark header.top{background:#0b1220;color:var(--ink);}
header.top a.back{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.9em;opacity:.92;
  padding:4px 8px 4px 2px;border-radius:8px;transition:background .15s;}
header.top a.back:hover{background:rgba(255,255,255,.1);}
header.top .ttl{flex:1 1 auto;}
header.top .who{font-size:.85em;opacity:.9;white-space:nowrap;}
main{position:relative;max-width:1280px;margin:0 auto;padding:22px 18px 18px;}
@media (max-width:900px){ main{padding:16px 12px 12px;} header.top{padding-left:12px;padding-right:12px;} }

/* ---- buttons, fields ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid var(--navy);background:var(--navy);color:#fff;
  font-weight:700;border-radius:var(--radius-sm);padding:9px 16px;min-height:40px;cursor:pointer;white-space:nowrap;
  transition:transform .12s var(--ease),filter .15s,background-color .15s,border-color .15s,box-shadow .15s;box-shadow:var(--sh-1);}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:scale(.96);}
html.dark .btn{color:var(--paper);}
.btn.tc{background:linear-gradient(135deg,var(--tc),color-mix(in srgb, var(--tc) 75%, #fff));border-color:var(--tc);color:var(--on-c);}
html.dark .btn.tc{background:linear-gradient(135deg,var(--tc),color-mix(in srgb, var(--tc) 70%, #000));}
.btn.secondary{background:var(--paper);color:var(--navy);border-color:var(--line);}
.btn.secondary:hover{border-color:var(--tc);filter:none;}
html.dark .btn.secondary{color:var(--navy);}
.btn.danger{background:color-mix(in srgb, var(--red) 12%, var(--paper));color:var(--red);border-color:var(--red);}
html.dark .btn.danger{color:var(--red);}
.btn.orange{background:linear-gradient(135deg,var(--orange),#f5a04f);border-color:var(--orange);color:#fff;}
html.dark .btn.orange{color:#1a0d00;}
.btn.sm{padding:6px 11px;min-height:34px;font-size:.85em;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.btn .ic,.iconBtn .ic{width:1.05em;height:1.05em;flex:0 0 auto;}
.iconBtn{display:inline-flex;align-items:center;justify-content:center;width:2.1em;height:2.1em;border-radius:var(--radius-sm);
  border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;flex:0 0 auto;transition:background-color .15s,color .15s,transform .12s var(--ease);}
.iconBtn:hover{background:color-mix(in srgb, var(--tc) 12%, transparent);color:var(--tc);}
.iconBtn:active{transform:scale(.9);}
.iconBtn[disabled]{opacity:.3;pointer-events:none;}
input[type=text],input[type=date],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:var(--radius-sm);
  padding:9px 11px;min-height:42px;outline:none;transition:border-color .15s,box-shadow .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--tc);box-shadow:0 0 0 3px color-mix(in srgb, var(--tc) 20%, transparent);}
textarea{resize:vertical;min-height:70px;line-height:1.45;}
input.chk{appearance:none;-webkit-appearance:none;width:1.3em;height:1.3em;margin:0;border:2px solid color-mix(in srgb, var(--tc) 55%, var(--line));
  border-radius:.4em;background:var(--paper);cursor:pointer;flex:0 0 auto;display:grid;place-items:center;
  transition:background-color .18s,border-color .18s,transform .18s var(--ease);}
input.chk::after{content:"";width:.62em;height:.34em;border:solid var(--on-c);border-width:0 0 .16em .16em;transform:translateY(-.06em) rotate(-45deg) scale(0);transition:transform .22s var(--ease-out);}
input.chk:checked{background:var(--tc);border-color:var(--tc);animation:pop .28s var(--ease-out);}
input.chk:checked::after{transform:translateY(-.06em) rotate(-45deg) scale(1);}
input.chk:disabled{cursor:default;opacity:.7;}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.strike{background:linear-gradient(currentColor,currentColor) 0 58%/0 .09em no-repeat;transition:background-size .3s var(--ease),color .3s;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;}
.done .strike{background-size:100% .09em;color:var(--muted);}
.panel{background:linear-gradient(100deg,color-mix(in srgb, var(--tc) 12%, var(--paper)),var(--paper) 60%);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh-1);padding:16px 18px 18px;}
.count{background:color-mix(in srgb, var(--tc) 14%, var(--paper));color:var(--tc);border-radius:999px;padding:0 9px;font-weight:700;font-size:.8em;min-width:1.8em;text-align:center;
  font-variant-numeric:tabular-nums;}
.small{font-size:.82em;color:var(--muted);}
.row{display:flex;gap:8px;align-items:center;}
.grow{flex:1 1 auto;min-width:0;}
.emptyMsg{color:var(--muted);font-size:.9em;padding:6px 2px;}

/* ---- meeting list ---- */
.listHead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 18px;}
.listHead h1{font-family:var(--f-display);font-weight:400;font-size:2.1em;margin:0;color:var(--navy);line-height:1.1;}
.mtgRow{display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,color-mix(in srgb, var(--muted) 10%, var(--paper)),var(--paper) 55%);border:1px solid var(--line);border-left:6px solid var(--line);
  border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;cursor:pointer;box-shadow:var(--sh-1);
  transition:transform .18s var(--ease),box-shadow .18s,border-color .18s;}
.mtgRow:hover{transform:translateY(-2px);box-shadow:var(--sh-2);}
.mtgRow:active{transform:scale(.99);}
.mtgRow.live{border-left-color:var(--orange);background:linear-gradient(90deg,color-mix(in srgb, var(--orange) 18%, var(--paper)),var(--paper) 65%);}
.mtgRow .name{font-family:var(--f-display);font-size:1.25em;color:var(--navy);line-height:1.25;}
.mtgRow .meta{font-size:.82em;color:var(--muted);}
.liveTag{display:inline-flex;align-items:center;gap:6px;background:var(--orange);color:#fff;font-size:.72em;font-weight:700;padding:3px 10px 3px 8px;border-radius:20px;}
html.dark .liveTag{color:#1a0d00;}
.liveTag::before{content:"";width:.5em;height:.5em;border-radius:50%;background:currentColor;animation:breathe 2.4s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
.endedTag{background:var(--line-soft);color:var(--muted);font-size:.72em;font-weight:700;padding:3px 10px;border-radius:20px;}
.sectionLabel{font-size:1em;font-weight:700;color:var(--navy);margin:26px 2px 10px;display:flex;align-items:center;gap:8px;}
.sectionLabel .count{--tc:var(--orange);}

/* ---- meeting screen ---- */
.mtgHead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:14px;}
.mtgHead h1{font-family:var(--f-display);font-weight:400;font-size:1.9em;margin:0;color:var(--navy);line-height:1.15;cursor:text;}
.mtgHead .when{font-size:.85em;color:var(--muted);}
.mtgHead .spacer{flex:1 1 auto;}
.people{display:flex;flex-wrap:wrap;gap:6px;}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid color-mix(in srgb, var(--pc) 45%, var(--line));
  background:linear-gradient(90deg,color-mix(in srgb, var(--pc) 18%, var(--paper)),var(--paper));border-radius:999px;padding:3px 11px 3px 4px;font-size:.8em;font-weight:700;color:var(--navy);
  animation:chipIn .3s var(--ease-out);}
.chip .dot{width:1.7em;height:1.7em;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:.78em;font-weight:700;
  text-transform:uppercase;background:var(--pc);position:relative;}
.chip .dot::after{content:"";position:absolute;right:-1px;bottom:-1px;width:.55em;height:.55em;border-radius:50%;background:#3bd16f;border:2px solid var(--paper);}
@keyframes chipIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.tabs{position:relative;display:flex;gap:6px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none;padding:2px;}
.tabs::-webkit-scrollbar{display:none;}
.tabs button{border:1.5px solid var(--line);background:var(--paper);padding:9px 16px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;
  border-radius:999px;display:inline-flex;align-items:center;gap:8px;position:relative;
  transition:background-color .22s var(--ease),color .22s,border-color .22s,transform .12s var(--ease),box-shadow .22s;}
.tabs button .ic{width:1.15em;height:1.15em;color:var(--c);transition:color .22s;}
.tabs button:hover{border-color:var(--c);color:var(--navy);}
.tabs button:active{transform:scale(.96);}
.tabs button.on{background:linear-gradient(120deg,var(--c),color-mix(in srgb, var(--c) 62%, var(--paper)));border-color:var(--c);color:var(--on-c);box-shadow:0 4px 14px color-mix(in srgb, var(--c) 35%, transparent);}
.tabs button.on .ic{color:var(--on-c);}
.tabs .liveDot{width:.55em;height:.55em;border-radius:50%;background:var(--c-practice);display:inline-block;animation:breathe 1.6s ease-in-out infinite;}
.tabs button.on .liveDot{background:var(--on-c);}
@media (max-width:900px){
  .tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible;gap:6px;}
  .tabs button{border-radius:var(--radius-sm);padding:8px 6px;justify-content:center;font-size:.76em;white-space:normal;text-align:left;line-height:1.15;gap:6px;min-width:0;}
  .tabs button .ic{flex:0 0 auto;}
}
.pane{animation:paneIn .26s var(--ease-out);}
/* action items: cards in the tool's green, turning orange when due soon and
   red when late; the round check fills and draws its tick when tapped */
.panelTitle{font-size:1.02em;font-weight:700;color:var(--tc);margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.aiPane{max-width:1000px;}
.aiCompose{position:relative;border-radius:18px;padding:16px 18px 18px;margin-bottom:22px;
  background:linear-gradient(105deg,color-mix(in srgb, var(--c-actions) 20%, var(--paper)),var(--paper) 62%);
  border:1px solid color-mix(in srgb, var(--c-actions) 32%, var(--line));
  box-shadow:inset 0 1px 0 var(--raise-hi),inset 0 -1px 0 var(--raise-lo),var(--raise-sh);}
.aiCompose .fieldLbl{color:var(--c-actions);}
.aiForm{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(9.5em,1fr) auto;gap:10px;align-items:end;}
.aiForm input,.aiForm select{width:100%;height:46px;min-height:46px;border-radius:12px;padding-top:0;padding-bottom:0;}
.aiForm input[type=date]{min-width:0;-webkit-appearance:none;appearance:none;display:block;}
@media (max-width:600px){ .ai{gap:11px;padding:12px 10px 12px 14px;} .aiCheck{width:1.85em;height:1.85em;} }
.aiForm .aiText{font-size:1.05em;font-weight:600;}
.aiForm .btn{min-height:44px;border-radius:12px;}
@media (max-width:900px){ .aiForm{grid-template-columns:minmax(0,1fr) minmax(0,1fr);} .aiForm .aiWhat,.aiForm .btn{grid-column:1/-1;} }
@media (max-width:600px){ .aiForm{grid-template-columns:minmax(0,1fr);} }
.aiHead{display:flex;align-items:center;gap:10px;margin:4px 2px 12px;}
.aiHead h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.55em;color:var(--navy);line-height:1.1;}
.aiHead .count{--tc:var(--c-actions);}
.aiHead.doneHead{margin-top:28px;}
.aiHead.doneHead h3{font-size:1.2em;color:var(--muted);}
.aiList{display:flex;flex-direction:column;gap:10px;}
.ai{--ac:var(--c-actions);position:relative;display:flex;align-items:center;gap:14px;padding:13px 14px 13px 18px;border-radius:16px;
  background:linear-gradient(90deg,color-mix(in srgb, var(--ac) 13%, var(--paper)),var(--paper) 62%);
  border:1px solid color-mix(in srgb, var(--ac) 28%, var(--line));
  box-shadow:inset 5px 0 0 var(--ac),inset 0 1px 0 var(--raise-hi),var(--raise-sh);
  transition:box-shadow .25s var(--ease),transform .2s var(--ease),opacity .3s,background .3s;}
.ai:hover{transform:translateY(-1px);box-shadow:inset 5px 0 0 var(--ac),inset 0 1px 0 var(--raise-hi),0 3px 6px rgba(15,38,71,.08),0 12px 26px color-mix(in srgb, var(--ac) 18%, transparent);}
.ai.soon{--ac:var(--orange);}
.ai.late{--ac:var(--red);}
.ai.done{--ac:color-mix(in srgb, var(--muted) 70%, var(--line));background:color-mix(in srgb, var(--paper) 70%, transparent);box-shadow:inset 5px 0 0 var(--ac);}
.ai.done:hover{transform:none;}
.aiCheck{flex:0 0 auto;width:2.05em;height:2.05em;border-radius:50%;border:0;padding:0;background:transparent;cursor:pointer;color:var(--ac);position:relative;}
.aiCheck svg{width:100%;height:100%;display:block;overflow:visible;}
.aiCheck circle{fill:color-mix(in srgb, var(--ac) 8%, var(--paper));stroke:currentColor;stroke-width:2.3;transition:fill .25s,stroke .25s;}
.aiCheck path{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset .3s var(--ease-out) .05s;}
.aiCheck:hover circle{fill:color-mix(in srgb, var(--ac) 22%, var(--paper));}
.aiCheck:active{transform:scale(.9);}
.aiCheck:disabled{cursor:default;opacity:.6;}
.ai.checked .aiCheck,.ai.done .aiCheck{color:var(--c-actions);}
.ai.checked .aiCheck circle,.ai.done .aiCheck circle{fill:var(--c-actions);stroke:var(--c-actions);}
.ai.checked .aiCheck path,.ai.done .aiCheck path{stroke-dashoffset:0;}
.ai.checked .aiCheck{animation:pop .35s var(--ease-out);}
.ai.checked{background:linear-gradient(90deg,color-mix(in srgb, var(--c-actions) 22%, var(--paper)),var(--paper) 70%);}
.aiBody{flex:1 1 auto;min-width:0;}
.ai .txt{overflow-wrap:anywhere;font-weight:700;font-size:1.1em;line-height:1.3;color:var(--navy);}
.ai .txt.edit{cursor:text;}
.ai.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb, var(--muted) 60%, transparent);font-weight:600;}
.ai .sub{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:7px;font-size:.8em;align-items:center;}
.ai .sub:empty{display:none;}
.aiChip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 4px;font-weight:700;line-height:1.3;
  background:color-mix(in srgb, var(--pc,var(--muted)) 13%, var(--paper));color:color-mix(in srgb, var(--pc,var(--muted)) 75%, var(--navy));
  border:1px solid color-mix(in srgb, var(--pc,var(--muted)) 22%, transparent);}
.aiChip .av{width:1.55em;height:1.55em;border-radius:50%;background:var(--pc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.85em;text-transform:uppercase;}
.aiChip.due{--pc:var(--muted);padding-left:8px;}
.aiChip .ic{width:1.15em;height:1.15em;}
.ai.soon .aiChip.due{--pc:var(--orange);}
.ai.late .aiChip.due{--pc:var(--red);}
.ai.done .aiChip{opacity:.75;}
.aiChip.mtg{--pc:var(--c-agenda);padding-left:8px;cursor:pointer;text-decoration:none;}
.aiChip.mtg:hover{background:color-mix(in srgb, var(--c-agenda) 22%, var(--paper));}
.aiChip.by{--pc:var(--c-actions);padding-left:8px;font-weight:600;}
.ai .del{opacity:.5;transition:opacity .15s;}
.ai:hover .del{opacity:1;}
@media (hover:none){ .ai .del{opacity:.8;} }
.aiEmpty{display:flex;align-items:center;gap:10px;padding:16px 18px;border-radius:16px;color:var(--muted);font-weight:600;
  background:color-mix(in srgb, var(--c-actions) 6%, var(--paper));border:1.5px dashed color-mix(in srgb, var(--c-actions) 30%, var(--line));}
.aiEmpty .ic{width:1.5em;height:1.5em;color:var(--c-actions);}
/* every open action item, on the Meetings page */
.aiAll{margin:6px 0 4px;}
.aiAll .sectionLabel .count{--tc:var(--c-actions);}
.aiAll .sectionLabel .switch{margin-left:auto;font-size:.82em;--tc:var(--c-actions);}
.mtgRow .dl{flex:0 0 auto;}
.aiEdit input,.aiEdit select{width:100%;margin-bottom:12px;}
.aeRow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;}
@media (max-width:420px){ .aeRow{grid-template-columns:minmax(0,1fr);} }
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- topics, agenda + notes ----
   Topics are the biggest headers. Agenda items are raised headers under
   them, and each item's notes sit under it, indented in a recessed well
   with the writer's name on the left. Replies are indented under the note
   they answer. */
.agenda{max-width:1000px;}
.fieldLbl{display:block;font-size:.78em;font-weight:700;color:var(--tc);margin:0 0 5px 2px;letter-spacing:.01em;}
.addRow{display:flex;gap:8px;align-items:stretch;}
.addRow .btn{flex:0 0 auto;}
.dgrip{display:inline-flex;align-items:center;justify-content:center;width:1.5em;align-self:stretch;margin:-6px 0 -6px -8px;color:color-mix(in srgb, var(--tc) 60%, var(--muted));
  cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border-radius:8px;flex:0 0 auto;transition:background-color .15s,color .15s;}
.dgrip:hover{background:color-mix(in srgb, var(--tc) 12%, transparent);color:var(--tc);}
.dgrip .ic{width:1.1em;height:1.1em;}
.topicSec{margin:0 0 26px;}
.looseHead{display:none;}
.looseSec.movable{position:relative;margin:0 0 26px;padding-left:1.6em;}
.looseSec.movable .looseHead{display:flex;position:absolute;left:0;top:0;bottom:0;width:1.5em;}
.looseSec.movable .looseHead .dgrip{margin:0;align-self:stretch;border-radius:10px;background:color-mix(in srgb, var(--tc) 7%, transparent);}
.looseSec.dragSrc .looseHead .dgrip{background:color-mix(in srgb, var(--tc) 18%, transparent);}
.topicHead{display:flex;align-items:center;gap:12px;padding:14px 16px 14px 18px;border-radius:18px;margin-bottom:14px;
  background:linear-gradient(95deg,color-mix(in srgb, var(--tc) 30%, var(--paper)),color-mix(in srgb, var(--tc) 8%, var(--paper)) 55%,var(--paper) 85%);
  border:1px solid color-mix(in srgb, var(--tc) 35%, var(--line));
  box-shadow:inset 0 1px 0 var(--raise-hi),inset 0 -1px 0 var(--raise-lo),0 2px 4px rgba(15,38,71,.08),0 10px 24px rgba(15,38,71,.10);}
.topicHead .ttx{flex:1 1 auto;min-width:0;font-family:var(--f-display);font-weight:400;font-size:1.95em;line-height:1.15;color:var(--navy);overflow-wrap:break-word;}
.topicHead .nc{font-size:.8em;font-weight:700;color:var(--tc);white-space:nowrap;}
.topicHead .ttx[onclick]{cursor:pointer;}
.topicHead.current{border:3px solid var(--tc);padding:12px 14px 12px 22px;
  background:linear-gradient(95deg,color-mix(in srgb, var(--tc) 48%, var(--paper)),color-mix(in srgb, var(--tc) 18%, var(--paper)) 60%,color-mix(in srgb, var(--tc) 8%, var(--paper)));
  box-shadow:inset 8px 0 0 var(--tc),0 0 0 5px color-mix(in srgb, var(--tc) 20%, transparent),0 14px 32px color-mix(in srgb, var(--tc) 30%, transparent);}
.topicHead.current .ttx{font-weight:700;font-size:2.15em;color:color-mix(in srgb, var(--tc) 25%, var(--navy));}
@media (max-width:900px){ .topicHead.current .ttx{font-size:1.6em;} .topicHead.current{padding:10px 10px 10px 18px;} }
.topicHead .tools{display:flex;opacity:0;pointer-events:none;transition:opacity .18s;}
.topicHead:hover .tools,.topicHead:focus-within .tools{opacity:1;pointer-events:auto;}
.topicBody{margin-left:1.4em;}
@media (max-width:900px){ .topicBody{margin-left:.5em;} .topicHead .ttx{font-size:1.4em;} }
.items{display:flex;flex-direction:column;min-height:6px;}
.agSec{margin-bottom:16px;}
.agItem{--ib:color-mix(in srgb, var(--tc) 16%, var(--paper));position:relative;display:flex;align-items:center;gap:12px;padding:13px 14px 13px 16px;border-radius:var(--radius);
  background:linear-gradient(90deg,var(--ib),var(--paper) 72%);border:1px solid color-mix(in srgb, var(--tc) 22%, var(--line));
  box-shadow:inset 0 1px 0 var(--raise-hi),inset 0 -1px 0 var(--raise-lo),var(--raise-sh);
  transition:box-shadow .25s var(--ease),border-color .25s var(--ease),transform .2s var(--ease);}
.agItem.current{--ib:color-mix(in srgb, var(--tc) 42%, var(--paper));border:2.5px solid var(--tc);padding:11.5px 12.5px 11.5px 22px;
  background:linear-gradient(90deg,var(--ib),color-mix(in srgb, var(--tc) 12%, var(--paper)) 78%);
  box-shadow:inset 7px 0 0 var(--tc),inset 0 1px 0 var(--raise-hi),0 0 0 4px color-mix(in srgb, var(--tc) 22%, transparent),0 10px 26px color-mix(in srgb, var(--tc) 30%, transparent);
  transform:scale(1.012);}
.agItem.current .txt{color:color-mix(in srgb, var(--tc) 30%, var(--navy));}
@media (max-width:900px){ .agItem.current{padding:9.5px 10.5px 9.5px 18px;transform:none;} }
.agItem .txt{flex:1 1 auto;min-width:0;cursor:pointer;overflow-wrap:break-word;font-size:1.45em;font-weight:700;line-height:1.22;color:var(--navy);letter-spacing:-.005em;}
.agItem .nc{font-size:.8em;font-weight:700;color:var(--tc);white-space:nowrap;}
.agItem .tools{display:flex;opacity:0;pointer-events:none;transition:opacity .18s;}
.agItem:hover .tools,.agItem:focus-within .tools{opacity:1;pointer-events:auto;}
@media (max-width:900px), (hover:none){
  .agItem .tools,.topicHead .tools{opacity:1;pointer-events:auto;}
}
@media (max-width:900px){ .agItem .txt{font-size:1.15em;} .agItem .nc{display:none;} .agItem{padding:11px 12px;gap:10px;} .topicHead{padding:12px;gap:10px;} }
/* on a phone the edit and delete buttons drop below the title so the title keeps the width */
@media (max-width:600px){
  .agItem,.topicHead{flex-wrap:wrap;row-gap:0;}
  .agItem .txt{flex:1 1 calc(100% - 4.6em);}
  .topicHead .ttx{flex:1 1 calc(100% - 2.6em);}
  .agItem .tools,.topicHead .tools{margin:-4px -4px -6px auto;font-size:.9em;order:5;}
  .topicHead .nc{order:4;margin-left:2.1em;}
  .topicBody{margin-left:0;}
  .well{margin-left:.6em;}
  .addAg{margin-left:.6em;}
}
.well{margin:10px 0 0 2.4em;border-radius:12px;background:linear-gradient(90deg,color-mix(in srgb, var(--tc) 8%, var(--well)),var(--well) 70%);box-shadow:var(--well-in);padding:6px 14px 12px;}
@media (max-width:900px){ .well{margin-left:1.1em;padding:4px 10px 10px;} }
.notes{display:flex;flex-direction:column;}
.noteWrap{border-bottom:1px solid color-mix(in srgb, var(--line) 70%, transparent);padding:2px 0 6px;}
.notes > .noteWrap:last-child{border-bottom:0;}
.note{display:grid;grid-template-columns:minmax(4.5em,max-content) 1fr;column-gap:14px;align-items:baseline;padding:8px 2px 2px;}
.note .who{font-weight:700;color:var(--pc);font-size:.86em;white-space:nowrap;}
.note .body{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0;}
.note .tm{display:block;font-size:.72em;color:var(--muted);font-weight:500;margin-top:1px;}
.nActs{grid-column:2;display:flex;align-items:center;gap:4px;margin-top:4px;flex-wrap:wrap;}
.nActs .sp{flex:1 1 auto;}
.likeBtn,.replyBtn{display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;background:transparent;color:var(--muted);font-weight:700;font-size:.8em;
  padding:3px 9px;border-radius:999px;cursor:pointer;transition:background-color .15s,color .15s,transform .12s var(--ease),border-color .15s;}
.likeBtn .ic{width:1.15em;height:1.15em;}
.likeBtn:hover,.replyBtn:hover{background:color-mix(in srgb, var(--tc) 12%, transparent);color:var(--tc);}
.likeBtn:active,.replyBtn:active{transform:scale(.92);}
.likeBtn.on{color:var(--tc);background:color-mix(in srgb, var(--tc) 14%, var(--paper));border-color:color-mix(in srgb, var(--tc) 35%, transparent);}
.likeBtn.on .ic{animation:pop .3s var(--ease-out);}
.likeBtn .lc:empty{display:none;}
.nActs .iconBtn{width:1.9em;height:1.9em;}
.nActs .own{display:flex;opacity:0;transition:opacity .15s;}
.noteWrap:hover .nActs .own,.note:focus-within .own{opacity:1;}
@media (hover:none){ .nActs .own{opacity:1;} }
@media (max-width:560px){ .note{grid-template-columns:1fr;} .note .who{display:flex;gap:8px;align-items:baseline;} .note .tm{display:inline;margin:0;} .nActs{grid-column:1;} }
.replies{margin:2px 0 0 calc(4.5em + 14px);padding-left:12px;border-left:2px solid color-mix(in srgb, var(--tc) 30%, var(--line));}
.replies:empty{display:none;}
.replies .note{font-size:.95em;padding-top:6px;}
@media (max-width:560px){ .replies{margin-left:10px;} }
.replyBox{margin:6px 0 4px calc(4.5em + 14px);}
.replyBox:empty{display:none;}
@media (max-width:560px){ .replyBox{margin-left:10px;} }
.note.editing{grid-template-columns:1fr;}
.note textarea{background:var(--paper);}
.compose{padding-top:10px;}
@media (max-width:600px){
  .compose .addRow,.replyBox .addRow{flex-wrap:wrap;}
  .compose .addRow textarea,.replyBox .addRow textarea{flex:1 1 100%;width:100%;}
  .compose .addRow .btn,.replyBox .addRow .btn{margin-left:auto;}
}
.compose textarea,.replyBox textarea{min-height:42px;height:42px;resize:none;background:color-mix(in srgb, var(--paper) 75%, var(--well));box-shadow:inset 0 1px 3px rgba(15,38,71,.08);overflow:hidden;}
.addAg{margin:2px 0 0 2.4em;max-width:760px;}
@media (max-width:900px){ .addAg{margin-left:1.1em;} }
.addAg input{border-radius:var(--radius-sm);font-weight:600;}
.addTopic{margin-top:8px;max-width:1000px;}
.addTopic input{font-size:1.15em;font-weight:700;border-radius:var(--radius);min-height:52px;
  background:linear-gradient(90deg,color-mix(in srgb, var(--tc) 10%, var(--paper)),var(--paper) 70%);box-shadow:inset 0 1px 0 var(--raise-hi),var(--sh-1);}
.addTopic .btn{min-height:52px;border-radius:var(--radius);}
/* dragging agenda items and topics */
.dragGhost{position:fixed;left:0;top:0;z-index:70;pointer-events:none;opacity:.96;transform-origin:20px 20px;
  box-shadow:0 18px 40px rgba(15,38,71,.28)!important;transition:none!important;}
.dragSrc{opacity:.35;transition:opacity .15s;}
.dropLine{position:fixed;z-index:69;height:4px;border-radius:4px;background:var(--tc);box-shadow:0 0 0 3px color-mix(in srgb, var(--tc) 25%, transparent);pointer-events:none;
  transition:top .12s var(--ease),left .12s var(--ease),width .12s var(--ease);}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important;}

/* ---- whiteboard ---- */
.wbWrap{position:relative;}
.wbBar{position:relative;display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;align-items:center;gap:2px;margin-bottom:10px;
  background:linear-gradient(90deg,color-mix(in srgb, var(--c-board) 14%, var(--paper)),var(--paper) 55%);border:1px solid var(--line);
  border-radius:16px;padding:6px;box-shadow:inset 0 1px 0 var(--raise-hi),var(--raise-sh);}
.wbBar .sep{width:1px;height:1.9em;background:var(--line);margin:0 3px;flex:0 0 auto;}
/* one row always, so picking a tool never moves the board; the menus open just below it */
.wbBar::-webkit-scrollbar{display:none;}
.wbMenus{position:relative;height:0;z-index:30;}
.wbMenus .menuPop{top:-4px;}
.shapePop{display:flex;gap:2px;min-width:0;padding:5px;}
.wbRight{display:flex;align-items:center;gap:2px;margin-left:auto;padding-left:6px;position:sticky;right:0;flex:0 0 auto;
  background:linear-gradient(90deg,transparent,var(--paper) 6px);border-left:1px solid var(--line);}
@media (max-width:900px){
  .wbBar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;font-size:.78em;border-radius:14px;}
  .wbBar::-webkit-scrollbar{display:none;}
  .wbBar .grow{display:none;}
  .menuPop{position:fixed;right:10px;top:auto;margin-top:6px;}
}
.tool{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:2.2em;height:2.35em;padding:0 6px;border-radius:11px;flex:0 0 auto;
  border:1.5px solid transparent;background:transparent;color:var(--navy);cursor:pointer;font-weight:700;font-size:.85em;
  transition:background-color .18s,border-color .18s,transform .12s var(--ease),color .18s,box-shadow .18s;}
.tool:hover{background:color-mix(in srgb, var(--c-board) 12%, transparent);}
.tool:active{transform:scale(.9);}
.tool.on{background:linear-gradient(135deg,var(--c-board),color-mix(in srgb, var(--c-board) 70%, #fff));color:var(--on-c);box-shadow:0 3px 10px color-mix(in srgb, var(--c-board) 35%, transparent);}
.tool .ic{width:1.3em;height:1.3em;}
.tool[disabled]{opacity:.35;pointer-events:none;}
.swatch{width:1.7em;height:1.7em;border-radius:50%;border:2.5px solid var(--paper);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0;
  transition:transform .18s var(--ease),box-shadow .18s;flex:0 0 auto;}
.swatch:hover{transform:scale(1.1);}
.swatch.on{box-shadow:0 0 0 2.5px var(--navy);transform:scale(1.12);}
.sizeDot{border-radius:50%;background:currentColor;display:inline-block;}
.menuPop{position:absolute;right:6px;top:calc(100% + 6px);z-index:30;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-2);
  padding:8px;min-width:220px;animation:modalIn .2s var(--ease-out);}
.menuPop .mi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--navy);text-align:left;}
.menuPop .mi:hover{background:color-mix(in srgb, var(--c-board) 10%, transparent);}
.menuPop .mi .ic{width:1.2em;height:1.2em;color:var(--c-board);}
.menuPop .seg{display:flex;gap:4px;padding:4px 6px 8px;}
.menuPop .seg button{flex:1;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 4px;font-weight:700;font-size:.8em;cursor:pointer;color:var(--navy);}
.menuPop .seg button.on{border-color:var(--c-board);background:color-mix(in srgb, var(--c-board) 12%, var(--paper));color:var(--c-board);}
.menuPop .lbl{font-size:.78em;font-weight:700;color:var(--muted);padding:6px 10px 2px;}
.board{position:relative;width:100%;height:560px;background-color:var(--board);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:inset 0 1px 0 var(--raise-hi),var(--sh-1);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;}
.board.bg-dots{background-image:radial-gradient(var(--board-mark) 1.3px, transparent 1.5px);}
.board.bg-grid{background-image:linear-gradient(var(--board-mark) 1px,transparent 1px),linear-gradient(90deg,var(--board-mark) 1px,transparent 1px);}
.board canvas{position:absolute;inset:0;width:100%;height:100%;}
.board.t-pen,.board.t-marker,.board.t-shape,.board.t-laser{cursor:crosshair;}
.board.t-eraser{cursor:none;} .board.t-sticky{cursor:copy;} .board.t-text{cursor:text;}
.board.t-hand,.board.panning{cursor:grab;} .board.panning{cursor:grabbing;}
.board.t-select{cursor:default;} .board.t-select.overItem{cursor:move;}
.stickyLayer,.cursorLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.stk{--rot:0deg;position:absolute;left:0;top:0;width:150px;pointer-events:auto;border-radius:4px 4px 12px 4px;transform-origin:0 0;
  box-shadow:0 2px 3px rgba(0,0,0,.12),0 8px 18px rgba(0,0,0,.14);display:flex;flex-direction:column;color:#1d1a00;
  background-image:linear-gradient(170deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%);
  transition:box-shadow .2s,background-color .2s;}
.stk .in{display:flex;flex-direction:column;transform:rotate(var(--rot));transform-origin:50% 50%;border-radius:inherit;background:inherit;box-shadow:inherit;
  animation:stkIn .34s var(--ease-out);transition:transform .2s var(--ease);}
.stk{background:none;box-shadow:none;}
.stk.dragging .in{transform:rotate(0deg) scale(1.04);box-shadow:0 6px 10px rgba(0,0,0,.14),0 22px 40px rgba(0,0,0,.24);}
.stk.dragging{z-index:5;}
.stk.glide{transition:transform .32s var(--ease);}
.stk.leaving .in{animation:stkOut .22s var(--ease) forwards;pointer-events:none;}
@keyframes stkIn{from{opacity:0;transform:translateY(8px) rotate(var(--rot)) scale(.6)}to{opacity:1}}
@keyframes stkOut{to{opacity:0;transform:rotate(var(--rot)) scale(.6)}}
.stk .grip{height:22px;cursor:grab;display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 9px;font-size:10px;font-weight:700;
  color:rgba(0,0,0,.5);touch-action:none;}
.stk.dragging .grip{cursor:grabbing;}
.stk .grip button{border:0;background:transparent;color:rgba(0,0,0,.5);cursor:pointer;font-size:17px;line-height:1;padding:0 4px;border-radius:6px;}
.stk .grip button:hover{background:rgba(0,0,0,.08);}
.stk textarea{border:0;background:transparent;resize:none;min-height:88px;padding:2px 10px 10px;font-size:14px;line-height:1.35;color:#1d1a00;box-shadow:none;font-weight:500;}
.stk textarea:focus{outline:none;box-shadow:none;}
.board.readonly .stk .grip{cursor:default;}
.textEdit{position:absolute;left:0;top:0;z-index:6;transform-origin:0 0;border:1.5px dashed var(--c-board);border-radius:6px;background:color-mix(in srgb, var(--board) 85%, transparent);
  font-weight:600;line-height:1.25;padding:2px 4px;min-width:60px;min-height:0;resize:none;overflow:hidden;white-space:pre;box-shadow:none;}
.cur{position:absolute;left:0;top:0;transition:transform .12s linear, opacity .5s;pointer-events:none;}
.cur svg{width:18px;height:18px;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3));}
.cur span{position:absolute;left:14px;top:14px;background:var(--pc);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap;}
.cur.idle{opacity:0;}
.zoomBox{position:absolute;right:10px;bottom:10px;z-index:7;display:flex;align-items:center;gap:2px;background:color-mix(in srgb, var(--paper) 92%, transparent);
  border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:var(--sh-1);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.zoomBox button{border:0;background:transparent;color:var(--navy);font-weight:700;min-width:2.1em;height:2.1em;border-radius:9px;cursor:pointer;font-size:.85em;font-variant-numeric:tabular-nums;}
.zoomBox button:hover{background:color-mix(in srgb, var(--c-board) 12%, transparent);}
.zoomBox .ic{width:1.15em;height:1.15em;vertical-align:middle;}
.selBar{position:absolute;z-index:8;display:flex;gap:4px;padding:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-2);
  transform:translate(-50%,-100%);animation:modalIn .18s var(--ease-out);}
.selBar .swatch{width:1.5em;height:1.5em;}
/* agenda pinned to the top of the board */
.pinBar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px;}
.pinBar:empty{display:none;}
.pin{position:relative;display:flex;align-items:center;gap:10px;max-width:100%;padding:8px 8px 8px 14px;border-radius:14px;
  background:linear-gradient(95deg,color-mix(in srgb, var(--c-agenda) 22%, var(--paper)),var(--paper) 80%);border:1px solid color-mix(in srgb, var(--c-agenda) 35%, var(--line));
  box-shadow:inset 0 1px 0 var(--raise-hi),var(--raise-sh);animation:modalIn .22s var(--ease-out);}
.pin .pt{min-width:0;overflow-wrap:anywhere;}
.pin .pk{display:block;font-size:.68em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c-agenda);}
.pin.topic .pt{font-family:var(--f-display);font-size:1.45em;line-height:1.15;color:var(--navy);}
.pin.agenda .pt{font-weight:700;font-size:1.1em;color:var(--navy);}
.pin.note{background:linear-gradient(95deg,color-mix(in srgb, var(--pc) 16%, var(--paper)),var(--paper) 80%);border-color:color-mix(in srgb, var(--pc) 35%, var(--line));}
.pin.note .pk{color:var(--pc);text-transform:none;letter-spacing:0;font-size:.78em;}
.pin.note .pt{white-space:pre-wrap;}
.pin .iconBtn{flex:0 0 auto;width:1.9em;height:1.9em;}
@media (max-width:900px){
  .pinBar{gap:6px;margin-bottom:8px;font-size:.8em;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;}
  .pinBar::-webkit-scrollbar{display:none;}
  .pin{padding:6px 6px 6px 10px;flex:0 0 auto;max-width:78%;}
  .pin.topic .pt{font-size:1.25em;}
  .pin .pt .tx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
}

/* the presenter's screen, live */
.mirror{position:absolute;inset:0;background:color-mix(in srgb, var(--tc) 6%, var(--cream));overflow:hidden;z-index:2;}
.mirrorBox{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 0 0 1px var(--line),var(--sh-2);background:var(--paper);overflow:hidden;}
.mirrorZoom{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;}
.mirrorZoom iframe{position:absolute;inset:0;border:0;display:block;pointer-events:none;background:var(--paper);}
.mirrorWait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;pointer-events:none;}
.mirrorWait:empty{display:none;}
.gestures{position:absolute;inset:0;pointer-events:none;overflow:visible;}
.gTouch{position:absolute;left:0;top:0;width:0;height:0;transition:transform 70ms linear;}
.gTouch span{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle, rgba(70,78,92,.30) 0 55%, rgba(70,78,92,.16) 70%, rgba(70,78,92,0) 72%);
  box-shadow:0 0 0 1.5px rgba(70,78,92,.28);animation:gDown .16s var(--ease-out) both;}
.gTouch.lift span{animation:gUp .4s var(--ease) forwards;}
@keyframes gDown{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes gUp{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.35)}}
.gWheel{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;background:rgba(70,78,92,.22);box-shadow:0 0 0 1.5px rgba(70,78,92,.3);
  animation:gWheel .55s var(--ease) forwards;}
@keyframes gWheel{0%{opacity:0;transform:translate(var(--x),var(--y)) scale(.7)}25%{opacity:1}100%{opacity:0;transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) scale(1)}}
.gCursor{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:rgba(70,78,92,.22);box-shadow:0 0 0 1.5px rgba(70,78,92,.35);
  transition:transform 90ms linear, opacity .4s;}
.gCursor.idle{opacity:0;}
.gTap{position:absolute;border-radius:8px;background:rgba(47,111,214,.14);box-shadow:0 0 0 2px rgba(47,111,214,.55);
  animation:gTap 1.25s var(--ease) forwards;}
@keyframes gTap{0%{opacity:0;transform:scale(.98)}12%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0}}
.gFocus{position:absolute;border-radius:8px;box-shadow:0 0 0 2.5px rgba(232,121,26,.75),0 0 14px rgba(232,121,26,.35);transition:all .15s var(--ease);}
.hlLayer{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden;}
.hlLayer.drawing{pointer-events:auto;cursor:crosshair;background:rgba(255,214,0,.04);}
.hlBox{position:absolute;left:0;top:0;border-radius:8px;background:rgba(255,212,0,.24);box-shadow:0 0 0 2.5px rgba(242,178,0,.9),0 0 18px rgba(255,200,0,.35);
  animation:hlIn .22s var(--ease-out);}
@keyframes hlIn{from{opacity:0}}
.hlLayer.drawing .hlBox:not(.draft){cursor:move;touch-action:none;}
.hlBox.moving{background:rgba(255,212,0,.32);box-shadow:0 0 0 2.5px rgba(242,178,0,1),0 8px 24px rgba(0,0,0,.18);}
.hlX,.hlRs{display:none;}
.hlLayer.drawing .hlX{display:flex;align-items:center;justify-content:center;position:absolute;right:-11px;top:-11px;width:24px;height:24px;border-radius:50%;
  border:0;background:#f2b200;color:#3a2a00;font-size:17px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25);padding:0;}
.hlLayer.drawing .hlRs{display:block;position:absolute;right:-7px;bottom:-7px;width:16px;height:16px;border-radius:5px;background:#fff;border:2.5px solid #f2b200;cursor:nwse-resize;box-shadow:0 1px 4px rgba(0,0,0,.25);}
@media (pointer:coarse){ .hlLayer.drawing .hlX{width:30px;height:30px;right:-14px;top:-14px;} .hlLayer.drawing .hlRs{width:22px;height:22px;right:-10px;bottom:-10px;} }
.hlBox.draft{background:rgba(255,212,0,.16);box-shadow:0 0 0 2px rgba(242,178,0,.7);}

<script>
/* ---- Daily database usage ----
   Every device keeps a running count of the documents it reads and saves and
   adds it to one shared tally for the day (Pacific time, when Google's free
   amounts reset). The owner gets a pop-up to acknowledge when a day reaches
   80% of a free amount, and again when it goes past it. The counts are this
   app's own estimate; Google's billing page has the exact figures. */
(function(){
  if(window.GH_USAGE) return;
  const OWNER='matthewc';
  const LIM={r:50000, w:20000, d:20000};
  const NAMES={r:'reads', w:'saves', d:'deletes'};
  let pend={r:0, w:0, d:0}, db=null, me='', show=false, unsub=null, day='', timer=0, last=null, installed=false;
  const today=()=>new Intl.DateTimeFormat('en-CA', {timeZone:'America/Los_Angeles', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date());
  const ref=d=>db.collection('gh_portal').doc('usage').collection('days').doc(d);
  function count(s){
    if(!s || !s.metadata || s.metadata.fromCache) return;
    if(typeof s.docChanges==='function'){
      let n=0; s.docChanges().forEach(c=>{ if(!(c.doc && c.doc.metadata && c.doc.metadata.hasPendingWrites)) n++; });
      pend.r+=n;
    } else if(!s.metadata.hasPendingWrites) pend.r+=1;
  }
  function install(){
    if(installed || !window.firebase || typeof firebase.firestore!=='function') return;
    const F=firebase.firestore;
    if(!F.DocumentReference || !F.Query) return;
    installed=true;
    const wrap=(proto, name, fn)=>{ if(!proto || typeof proto[name]!=='function' || proto[name]._ghu) return; const o=proto[name]; const w=fn(o); w._ghu=true; proto[name]=w; };
    const op=k=>o=>function(...a){ pend[k]++; return o.apply(this, a); };
    [F.DocumentReference && F.DocumentReference.prototype, F.WriteBatch && F.WriteBatch.prototype].forEach(p=>{
      wrap(p, 'set', op('w')); wrap(p, 'update', op('w')); wrap(p, 'delete', op('d'));
    });
    if(F.CollectionReference) wrap(F.CollectionReference.prototype, 'add', op('w'));
    const snap=o=>function(...a){
      const i=a.findIndex(x=>typeof x==='function');
      if(i>=0){ const cb=a[i]; a[i]=function(s){ try{ count(s); }catch(e){} return cb.apply(this, arguments); }; }
      else if(a[0] && typeof a[0].next==='function'){ const ob=a[0], nx=ob.next; a[0]=Object.assign({}, ob, {next:s=>{ try{ count(s); }catch(e){} return nx.call(ob, s); }}); }
      return o.apply(this, a);
    };
    const get=o=>function(...a){ return o.apply(this, a).then(s=>{ try{ pend.r+=Math.max(1, s && typeof s.size==='number' ? s.size : 1); }catch(e){} return s; }); };
    [F.Query && F.Query.prototype, F.CollectionReference && F.CollectionReference.prototype, F.DocumentReference && F.DocumentReference.prototype].forEach(p=>{
      if(!p) return;
      if(Object.prototype.hasOwnProperty.call(p, 'onSnapshot')) wrap(p, 'onSnapshot', snap);
      if(Object.prototype.hasOwnProperty.call(p, 'get')) wrap(p, 'get', get);
    });
  }
  function flush(){
    if(!db || !firebase.auth || !firebase.auth().currentUser) return;
    const d=today();
    if(show && d!==day) watch();
    if(!pend.r && !pend.w && !pend.d) return;
    const p=pend; pend={r:0, w:0, d:0};
    const inc=n=>firebase.firestore.FieldValue.increment(n);
    ref(d).set({r:inc(p.r), w:inc(p.w), d:inc(p.d), at:Date.now()}, {merge:true}).catch(()=>{ pend.r+=p.r; pend.w+=p.w; pend.d+=p.d; });
  }
  function watch(){
    if(unsub){ try{ unsub(); }catch(e){} unsub=null; }
    day=today();
    unsub=ref(day).onSnapshot(s=>{ last=s.exists ? s.data() : null; check(); }, ()=>{});
  }
  function check(){
    if(!show || !last || document.getElementById('ghUsageAlert')) return;
    const ack=last.ack||{};
    let pick=null;
    ['w','r','d'].forEach(k=>{
      const v=last[k]||0, lv=v>=LIM[k] ? 100 : v>=LIM[k]*0.8 ? 80 : 0;
      if(lv && !ack[k+lv] && (!pick || lv>pick.lv || (lv===pick.lv && v/LIM[k]>pick.v/LIM[pick.k]))) pick={k, lv, v};
    });
    if(!pick) return;
    const pct=Math.round(pick.v/LIM[pick.k]*100);
    const fmt=n=>Number(n).toLocaleString();
    const el=document.createElement('div');
    el.id='ghUsageAlert';
    el.setAttribute('role','alertdialog'); el.setAttribute('aria-modal','true');
    el.style.cssText='position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,18,32,.6);font-family:inherit;';
    el.innerHTML=`<div style="width:min(420px,100%);background:#fff;color:#141f33;border-radius:16px;padding:22px 22px 18px;box-shadow:0 20px 50px rgba(0,0,0,.35);border-top:6px solid ${pick.lv===100?'#c0392b':'#e8791a'};">
      <div style="font-size:1.3em;font-weight:800;color:#0f2647;margin-bottom:10px;">${pick.lv===100?'Free Amount Used':'Database Usage at '+pct+'%'}</div>
      <div style="line-height:1.5;margin-bottom:6px;">Today's ${NAMES[pick.k]}: <b>${fmt(pick.v)}</b> of ${fmt(LIM[pick.k])} free.</div>
      ${pick.lv===100?'<div style="line-height:1.5;">Anything more today is billed to your Blaze plan.</div>':''}
      <div style="display:flex;justify-content:flex-end;margin-top:16px;"><button type="button" id="ghUsageOk" style="font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 22px;background:#0f2647;color:#fff;cursor:pointer;">OK</button></div></div>`;
    document.body.appendChild(el);
    const key=pick.k+pick.lv;
    el.querySelector('#ghUsageOk').onclick=()=>{
      el.remove();
      if(last){ last.ack=Object.assign({}, last.ack||{}, {[key]:true}); }
      ref(day).set({ack:{[key]:true}}, {merge:true}).catch(()=>{});
      setTimeout(check, 50);
    };
    setTimeout(()=>{ const b=document.getElementById('ghUsageOk'); if(b) b.focus(); }, 30);
  }
  window.GH_USAGE={
    install,
    /* who is signed in, and the database to tally into; the owner also watches */
    user(name, database, canShow){
      install();
      db=database; me=String(name||'');
      if(!timer){ timer=setInterval(flush, 60000); window.addEventListener('pagehide', flush); }
      const s=canShow!==false && me===OWNER;
      if(s && !show){ show=true; watch(); }
      if(!s && show){ show=false; if(unsub){ unsub(); unsub=null; } }
    },
    flush, _pend:()=>pend, _check:check
  };
  install();
})();
</script>
<script>
'use strict';
/* =========================================================================
   MEETINGS
   A live workspace for in-person meetings: an agenda with shared notes, a
   whiteboard, and the practice copy of the portal. Every device in the
   meeting sees the same thing as it changes. It runs on the portal's
   Firebase project and sign-in, which this page shares because both sites
   live at the same address.

   Firestore layout, all under gh_portal/meetings/items/{meetingId}:
     the meeting itself  {title, createdAt, createdBy, status, presenter, hl, followLock, bg, currentAgenda,
                          boardPresenter, boardPins:[{k:'topic'|'agenda'|'note', id}]}
     topics/{id}         {text, order}
     agenda/{id}         {text, order, done, topicId}
     notes/{id}          {text, agendaId, parentId, by, byName, at}   parentId is set on replies
     likes/{noteId_uid}  {noteId, uid, name}
     strokes/{id}        {v:2, pts:[x,y,pressure,...], color, size, tool, by, at}
     shapes/{id}         {kind, x1, y1, x2, y2, color, size, by, at}
     texts/{id}          {x, y, text, color, size, by, at}
     stickies/{id}       {v:2, x, y, text, color, by, at}
     presence/{uid}      {name, at, ink, laser, cur}
     stream/{id}         the presenter's screen, while someone presents
   Whiteboard items are stored in board units. The first whiteboards stored
   positions as fractions of a 16:10 board; those are read as 1000 x 625.
========================================================================= */
const PORTAL_URL='../goodandhandyportal/';
const CFG_KEY='gh_portal_sync_cfg';
const PORTAL_DB_KEY='gh_portal_db_v1';
const SUBS=['topics','agenda','notes','likes','actions','tasks','strokes','shapes','texts','stickies','presence'];
const ALL_SUBS=SUBS.concat(['stream']);
const COLORS=['#0f2647','#e8791a','#c0392b','#1f8a55','#2f6fd6','#7b4bc4'];
const PEOPLE=['#e8791a','#2f6fd6','#1f8a55','#c0392b','#7b4bc4','#0e8f9a','#b8860b'];
const STICKY_COLORS=['#fff27a','#ffc9a8','#bdf0cf','#c9dcff','#ead3ff'];
const PRESENCE_MS=20000, ALIVE_MS=65000;
const RM=window.matchMedia('(prefers-reduced-motion: reduce)');
const EASE='cubic-bezier(.2,.8,.2,1)';

let db=null, ME=null, USERS={};
let MEETINGS=[], LIST_UNSUB=null;
let MTG=null, MTG_ID=null, MTG_UNSUBS=[];
let DATA={};
const emptyData=()=>({topics:[], agenda:[], notes:[], likes:[], actions:[], tasks:[], strokes:[], shapes:[], texts:[], stickies:[], presence:[]});
let TAB='agenda';
let presenceTimer=null;

/* ---------- small helpers ---------- */
const $=id=>document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function icon(n){ return `<svg class="ic"><use href="#i-${n}"/></svg>`; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmtDate(ms){ return new Date(ms).toLocaleDateString([], {weekday:'short', month:'short', day:'numeric', year:'numeric'}); }
function fmtTime(ms){ return new Date(ms).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }
function colorFor(name){
  const team=Object.values(USERS||{}).map(u=>u.username).filter(Boolean).sort();
  const i=team.indexOf(name);
  if(i>=0) return PEOPLE[i%PEOPLE.length];
  let h=0; for(const c of String(name||'')) h=(h*31+c.charCodeAt(0))>>>0; return PEOPLE[h%PEOPLE.length];
}
function nameOfUid(u){ const r=Object.values(USERS||{}).find(x=>x.uid===u); return r ? r.username : ''; }
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(), 300); }, 2600);
}
function closeModalAnimated(cb){
  const ov=document.querySelector('#modalRoot .overlay');
  if(!ov || RM.matches){ $('modalRoot').innerHTML=''; cb&&cb(); return; }
  ov.style.pointerEvents='none';
  ov.animate([{opacity:1},{opacity:0}], {duration:140, easing:'ease-in'}).onfinish=()=>{ $('modalRoot').innerHTML=''; cb&&cb(); };
}
function askYesNo(title, msg, yesLabel, danger){
  return new Promise(res=>{
    $('modalRoot').innerHTML=`<div class="overlay"><div class="modal"><h2>${esc(title)}</h2>${msg?`<p class="msg">${esc(msg)}</p>`:''}
      <div class="acts"><button class="btn secondary" id="mNo">Cancel</button><button class="btn ${danger?'danger':'tc'}" id="mYes">${esc(yesLabel||'OK')}</button></div></div></div>`;
    let settled=false;
    const done=v=>{ if(settled) return; settled=true; res(v); closeModalAnimated(); };
    $('mNo').onclick=()=>done(false); $('mYes').onclick=()=>done(true);
    $('mYes').focus();
    document.querySelector('#modalRoot .overlay').onclick=e=>{ if(e.target.classList.contains('overlay')) done(false); };
  });
}
function askText(title, value, yesLabel){
  return new Promise(res=>{
    $('modalRoot').innerHTML=`<div class="overlay"><div class="modal"><h2>${esc(title)}</h2>

/* ---------- lists that move smoothly ----------
   Lists are updated item by item instead of being redrawn. Items that move
   glide to their new place, new ones fade in, and removed ones fold away, so
   a change made on another device is easy to follow rather than a jump. */
function keyed(container, items, key, make, patch){
  if(!container) return;
  const animate=!RM.matches && container._ready;
  const old=new Map();
  [...container.children].forEach(el=>{ if(el.dataset.k && !el._leaving) old.set(el.dataset.k, el); else if(!el._leaving) el.remove(); });
  const first=new Map();
  if(animate) old.forEach((el,k)=>first.set(k, el.getBoundingClientRect()));
  const seen=new Set(), added=[];
  let prev=null;
  items.forEach((it,i)=>{
    const k=String(key(it)); seen.add(k);
    let el=old.get(k);
    if(!el){
      const t=document.createElement('template'); t.innerHTML=make(it,i).trim();
      el=t.content.firstElementChild; el.dataset.k=k; added.push(el);
    }
    if(patch) patch(el, it, i, items.length);
    const want=prev ? prev.nextSibling : container.firstChild;
    if(want!==el) container.insertBefore(el, want);
    prev=el;
  });
  old.forEach((el,k)=>{ if(!seen.has(k)) leave(el, animate); });
  container._ready=true;
  if(!animate) return;
  old.forEach((el,k)=>{
    if(!seen.has(k)) return;
    const a=first.get(k), b=el.getBoundingClientRect();
    const dx=a.left-b.left, dy=a.top-b.top;
    if(Math.abs(dx)>.5 || Math.abs(dy)>.5) el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}], {duration:320, easing:EASE});
  });
  added.forEach(el=>el.animate([{opacity:0, transform:'translateY(8px) scale(.98)'},{opacity:1, transform:'none'}], {duration:280, easing:EASE}));
}
function leave(el, animate){
  if(!animate){ el.remove(); return; }
  el._leaving=true;
  const h=el.offsetHeight, cs=getComputedStyle(el);
  el.style.overflow='hidden';
  el.animate([{opacity:1, height:h+'px', paddingTop:cs.paddingTop, paddingBottom:cs.paddingBottom},
              {opacity:0, height:'0px', paddingTop:'0px', paddingBottom:'0px', marginTop:'0px', marginBottom:'0px'}],
             {duration:240, easing:EASE}).onfinish=()=>el.remove();
}
function emptyState(container, show, text){
  if(!container) return;
  let e=container.parentNode.querySelector(`[data-empty-for="${container.id}"]`);
  if(show && !e){ e=document.createElement('div'); e.className='emptyMsg'; e.dataset.emptyFor=container.id; e.textContent=text; container.after(e); }
  if(!show && e) e.remove();
}

/* ---------- start-up: same Firebase project and sign-in as the portal ---------- */
function boot(){
  let cfg=null;
  try{ cfg=JSON.parse(localStorage.getItem(CFG_KEY)||'null'); }catch(e){}
  if(!cfg || typeof firebase==='undefined'){ gate('This device is not connected to the portal.'); return; }
  try{
    if(!cfg.storageBucket && cfg.projectId) cfg.storageBucket=cfg.projectId+'.appspot.com';
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    db=firebase.firestore();
  }catch(e){ gate('Meetings could not connect.', e && (e.message||e.code)); return; }
  try{ USERS=(JSON.parse(localStorage.getItem(PORTAL_DB_KEY)||'{}')||{}).users||{}; }catch(e){ USERS={}; }
  firebase.auth().onAuthStateChanged(user=>{
    if(!user){ ME=null; stopAll(); gate('Sign in to the portal on this device first.'); return; }
    const rec=Object.values(USERS).find(u=>u.uid===user.uid);
    ME={uid:user.uid, name:rec ? rec.username : (user.email||'').split('@')[0], isAdmin:!!(rec && rec.isAdmin)};
    try{ if(window.GH_USAGE) GH_USAGE.user(ME.name, db); }catch(e){}
    showMe();
    // The portal's user list, for names and colours.
    db.collection('gh_portal').doc('main').get().then(s=>{
      const raw=s.exists && s.data().meta;
      if(!raw) return;
      try{
        const u=JSON.parse(raw).users||{};
        if(Object.keys(u).length){ USERS=u; const r=Object.values(u).find(x=>x.uid===ME.uid); if(r){ ME.name=r.username; ME.isAdmin=!!r.isAdmin; showMe(); try{ if(window.GH_USAGE) GH_USAGE.user(ME.name, db); }catch(e){} } if(MTG) render(); }
      }catch(e){}
    }).catch(()=>{});
    route();
  });
  window.addEventListener('hashchange', route);
}

/* Fast-changing things (a line being drawn, the laser, cursors) go out
   through one write at a time, always the newest, so a slow connection
   never builds up a backlog. */
const LIVE={busy:false, pending:null};
const LIVE_GAP_MS=230;
function liveSend(fields){
  if(!MTG_ID || !ME) return;
  LIVE.pending=Object.assign(LIVE.pending||{}, fields);
  if(!LIVE.busy) liveFlush();
}
function liveFlush(){
  if(!LIVE.pending || !MTG_ID) return;
  const f=LIVE.pending; LIVE.pending=null; LIVE.busy=true;
  f.at=Date.now(); f.name=ME.name;
  // live updates go out at most about four times a second; each is the newest
  SUB('presence').doc(ME.uid).set(f, {merge:true}).catch(()=>{}).then(()=>setTimeout(()=>{ LIVE.busy=false; if(LIVE.pending) liveFlush(); }, LIVE_GAP_MS));
}

/* ----- dragging agenda items and topics -----
   Press the dotted handle and drag. A line shows where it will land; an
   agenda item can land in any topic or at the top. The page scrolls when
   you drag near its top or bottom edge. */
let DRAG=null;
function dragStart(e, kind, id){
  if(readOnly() || e.button>0) return;
  e.preventDefault(); e.stopPropagation();
  if(DRAG) dragEnd();
  const src=document.querySelector(kind==='agenda' ? `.items > .agSec[data-k="${id}"]` : `#agList > [data-k="${id}"]`);
  if(!src) return;
  DRAG={kind, id, src, sx:e.clientX, sy:e.clientY, started:false, pid:e.pointerId};
  window.addEventListener('pointermove', dragMove, true);
  window.addEventListener('pointerup', dragEnd, true);
  window.addEventListener('pointercancel', dragEnd, true);
  window.addEventListener('blur', dragEnd);
}
function dragBegin(){
  const d=DRAG, head=d.src.querySelector(d.kind==='agenda'?'.agItem':(d.id==='_loose'?'.items':'.topicHead')), r=head.getBoundingClientRect();
  d.ox=d.sx-r.left; d.oy=d.sy-r.top;
  const g=head.cloneNode(true); g.classList.add('dragGhost'); g.style.width=r.width+'px';
  // the ghost needs the tool's colour, which comes from the page
  document.body.appendChild(g); d.ghost=g;
  const line=document.createElement('div'); line.className='dropLine'; document.body.appendChild(line); d.line=line;
  d.src.classList.add('dragSrc'); document.body.classList.add('dragging');
  d.started=true;
  if(!RM.matches) g.animate([{transform:'scale(1)'},{transform:'scale(1.02)'}], {duration:150, fill:'forwards', easing:EASE});
}
function dragMove(e){
  const d=DRAG; if(!d || (e.pointerId!==d.pid)) return;
  if(d.started) e.preventDefault();
  d.x=e.clientX; d.y=e.clientY;
  if(!d.started){ if(Math.hypot(d.x-d.sx, d.y-d.sy)<4) return; dragBegin(); }
  d.ghost.style.left=(d.x-d.ox)+'px'; d.ghost.style.top=(d.y-d.oy)+'px';
  dragTarget();
  // scroll when near the edges
  const edge=70, vh=window.innerHeight;
  cancelAnimationFrame(d.scrollRaf);
  const sp = d.y<edge ? -(edge-d.y)/4 : d.y>vh-edge ? (d.y-(vh-edge))/4 : 0;
  if(sp){ const tick=()=>{ if(!DRAG) return; window.scrollBy(0, sp); dragTarget(); d.scrollRaf=requestAnimationFrame(tick); }; d.scrollRaf=requestAnimationFrame(tick); }
}
function dragTarget(){
  const d=DRAG; if(!d || !d.started) return;
  let list, cont, idx=0, lineAt;
  if(d.kind==='agenda'){
    const conts=[...document.querySelectorAll('#agList .items')];
    // the container whose section the pointer is over, else the nearest one
    let best=null, bd=Infinity;
    conts.forEach(c=>{
      const sec=c.closest('.topicSec')||c.closest('.looseSec'), r=sec.getBoundingClientRect();
      const dist = d.y<r.top ? r.top-d.y : d.y>r.bottom ? d.y-r.bottom : 0;
      if(dist<bd){ bd=dist; best=c; }
    });
    cont=best;
    list=[...cont.children].filter(x=>x.dataset.k && x!==d.src && !x._leaving);
  } else {
    cont=$('agList');
    list=[...cont.children].filter(x=>(x.classList.contains('topicSec') || x.classList.contains('movable')) && x!==d.src && !x._leaving);
  }
  idx=list.length;
  for(let i=0;i<list.length;i++){ const r=list[i].getBoundingClientRect(); if(d.y < r.top+r.height/2){ idx=i; break; } }
  const cr=cont.getBoundingClientRect();
  if(list.length===0) lineAt=cr.top+2;
  else if(idx<list.length) lineAt=list[idx].getBoundingClientRect().top-7;
  else lineAt=list[list.length-1].getBoundingClientRect().bottom+3;
  d.cont=cont; d.idx=idx; d.list=list;
  d.line.style.top=lineAt+'px'; d.line.style.left=cr.left+'px'; d.line.style.width=Math.max(60, cr.width)+'px';
}
function dragEnd(e){
  const d=DRAG; if(!d) return;
  if(e && e.pointerId!=null && e.pointerId!==d.pid) return;
  DRAG=null;
  cancelAnimationFrame(d.scrollRaf);
  window.removeEventListener('pointermove', dragMove, true);
  window.removeEventListener('pointerup', dragEnd, true);
  window.removeEventListener('pointercancel', dragEnd, true);
  window.removeEventListener('blur', dragEnd);
  document.body.classList.remove('dragging');
  if(!e || e.type==='blur' || e.type==='pointercancel'){
    // the drag was interrupted: put everything back as it was
    if(d.started){ d.src.classList.remove('dragSrc'); if(d.line) d.line.remove(); if(d.ghost) d.ghost.remove(); }
    return;
  }
  if(!d.started) return;
  d.src.classList.remove('dragSrc');
  if(d.line) d.line.remove();
  const g=d.ghost;
  if(g){ if(RM.matches) g.remove(); else g.animate([{opacity:.96},{opacity:0}], {duration:150}).onfinish=()=>g.remove(); }
  const ids=d.list.map(x=>x.dataset.k);
  ids.splice(d.idx, 0, d.id);
  const b=db.batch();
  if(d.kind==='agenda'){
    const tid=d.cont.dataset.topic||'';
    ids.forEach((id,i)=>{
      const a=DATA.agenda.find(x=>x.id===id); if(!a) return;
      const upd={};
      if((a.order||0)!==i+1) upd.order=i+1;
      if(id===d.id && topicOf(a)!==tid) upd.topicId=tid;
      if(Object.keys(upd).length){ Object.assign(a, upd); b.update(SUB('agenda').doc(id), upd); }
    });
  } else {
    ids.forEach((id,i)=>{
      if(id==='_loose'){ if(MTG.looseOrder!==i+1){ MTG.looseOrder=i+1; MREF().update({looseOrder:i+1}).catch(fail); } return; }
      const t=DATA.topics.find(x=>x.id===id); if(t && (t.order||0)!==i+1){ t.order=i+1; b.update(SUB('topics').doc(id), {order:i+1}); }
    });
    // the unfiled block, when it is empty, keeps its place at the top
    if(!ids.includes('_loose') && MTG.looseOrder!=null && MTG.looseOrder!==0){ MTG.looseOrder=0; MREF().update({looseOrder:0}).catch(fail); }
  }
  renderAgenda();
  b.commit().catch(fail);
}

/* how an item reads: when it is due, in words, and whether it is close or late */
function aiDueInfo(a){
  if(!a.due) return null;
  const today=todayISO(), d=new Date(a.due+'T00:00:00'), t=new Date(today+'T00:00:00');
  const days=Math.round((d-t)/864e5);
  let text, cls='';
  if(a.done) text='Due '+fmtShortDate(a.due);
  else if(days<0){ text=(-days)+(days===-1?' day late':' days late'); cls='late'; }
  else if(days===0){ text='Due today'; cls='soon'; }
  else if(days===1){ text='Due tomorrow'; cls='soon'; }
  else { text='Due '+fmtShortDate(a.due); if(days<=2) cls='soon'; }
  return {text, cls};
}

/* ---------- meeting summary (PDF) ----------
   Builds the PDF right here, with no outside tools: the agenda with every
   note, reply and like, the action items, and a picture of the whiteboard. */
function pdfWin(str){
  // the PDF's built-in fonts cover Western characters only
  const hi={'€':128,'‚':130,'ƒ':131,'„':132,'…':133,'†':134,'‡':135,'ˆ':136,'‰':137,'Š':138,'‹':139,'Œ':140,'Ž':142,'‘':145,'’':146,'“':147,'”':148,'•':149,'–':150,'—':151,'˜':152,'™':153,'š':154,'›':155,'œ':156,'ž':158,'Ÿ':159};
  let out='';
  for(const ch of String(str==null?'':str).replace(/\t/g,' ').replace(/\r/g,'')){
    const c=ch.codePointAt(0);
    if(c>=32 && c<127) out+=ch;
    else if(c>=160 && c<256) out+=ch;
    else if(hi[ch]) out+=String.fromCharCode(hi[ch]);
    else if(c===10) out+='\n';
  }
  return out;
}
function PdfDoc(){
  this.W=612; this.H=792; this.pages=[]; this.images=[];
  this.mc=document.createElement('canvas').getContext('2d');
}
PdfDoc.prototype.page=function(){ this.cur=[]; this.pages.push(this.cur); return this; };
PdfDoc.prototype.rgb=function(c){
  this.mc.fillStyle='#000'; this.mc.fillStyle=c||'#000'; const h=this.mc.fillStyle;
  if(h[0]==='#') return [1,3,5].map(i=>(parseInt(h.substr(i,2),16)/255).toFixed(3)).join(' ');
  const m=h.match(/[\d.]+/g)||[0,0,0]; return m.slice(0,3).map(v=>(v/255).toFixed(3)).join(' ');
};
PdfDoc.prototype.width=function(str, font, size){
  this.mc.font=(font==='B'?'bold ':font==='I'?'italic ':'')+'100px Helvetica, Arial, sans-serif';
  return this.mc.measureText(str).width*size/100;
};
PdfDoc.prototype.text=function(str, x, y, o){
  o=o||{}; const f={R:'F1',B:'F2',I:'F3'}[o.font||'R'], sz=o.size||11;
  const t=pdfWin(str).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
  this.cur.push(`BT /${f} ${sz} Tf ${this.rgb(o.color||'#141f33')} rg ${x.toFixed(2)} ${(this.H-y).toFixed(2)} Td (${t}) Tj ET`);
};
PdfDoc.prototype.line=function(x1,y1,x2,y2,o){
  o=o||{}; this.cur.push(`${(o.w||1).toFixed(2)} w ${this.rgb(o.color||'#dbe2ec')} RG ${x1.toFixed(2)} ${(this.H-y1).toFixed(2)} m ${x2.toFixed(2)} ${(this.H-y2).toFixed(2)} l S`);
};
PdfDoc.prototype.rect=function(x,y,w,h,fill){ this.cur.push(`${this.rgb(fill)} rg ${x.toFixed(2)} ${(this.H-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`); };
PdfDoc.prototype.box=function(x,y,w,h,color,lw){ this.cur.push(`${(lw||1).toFixed(2)} w ${this.rgb(color)} RG ${x.toFixed(2)} ${(this.H-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re S`); };
PdfDoc.prototype.image=function(jpeg, pw, ph, x, y, w, h){
  const n=this.images.length+1; this.images.push({jpeg, pw, ph});
  this.cur.push(`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${(this.H-y-h).toFixed(2)} cm /Im${n} Do Q`);
};
PdfDoc.prototype.wrap=function(str, font, size, maxW){
  const out=[];
  pdfWin(str).split('\n').forEach(par=>{
    const words=par.split(/ +/); let line='';
    words.forEach(w=>{
      const t=line?line+' '+w:w;
      if(this.width(t, font, size)<=maxW || !line){
        if(!line && this.width(w, font, size)>maxW){
          // a single very long word is broken up
          let part=''; for(const ch of w){ if(this.width(part+ch, font, size)>maxW && part){ out.push(part); part=''; } part+=ch; } line=part;
        } else line=t;
      } else { out.push(line); line=w; }
    });
    out.push(line);
  });
  return out;
};
PdfDoc.prototype.blob=function(){
  const parts=[], offs=[]; let len=0;
  const bytes=str=>{ const u=new Uint8Array(str.length); for(let i=0;i<str.length;i++) u[i]=str.charCodeAt(i)&255; return u; };
  const add=u=>{ if(typeof u==='string') u=bytes(u); parts.push(u); len+=u.length; };
  const obj=(n, body)=>{ offs[n]=len; add(n+' 0 obj\n'); (Array.isArray(body)?body:[body]).forEach(add); add('\nendobj\n'); };
  const nP=this.pages.length, nI=this.images.length;
  // 1 catalog, 2 pages, 3-5 fonts, then images, then a page and its contents for each page
  const imgBase=6, pageBase=imgBase+nI;
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, `<< /Type /Pages /Count ${nP} /Kids [${this.pages.map((p,i)=>(pageBase+i*2)+' 0 R').join(' ')}] >>`);
  ['Helvetica','Helvetica-Bold','Helvetica-Oblique'].forEach((f,i)=>obj(3+i, `<< /Type /Font /Subtype /Type1 /BaseFont /${f} /Encoding /WinAnsiEncoding >>`));
  this.images.forEach((im,i)=>obj(imgBase+i, [`<< /Type /XObject /Subtype /Image /Width ${im.pw} /Height ${im.ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.jpeg.length} >>\nstream\n`, im.jpeg, '\nendstream']));
  const xo=nI ? `/XObject << ${this.images.map((im,i)=>`/Im${i+1} ${imgBase+i} 0 R`).join(' ')} >>` : '';
  this.pages.forEach((ops,i)=>{
    const pn=pageBase+i*2, cn=pn+1, content=ops.join('\n');
    obj(pn, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R >> ${xo} >> /Contents ${cn} 0 R >>`);
    obj(cn, [`<< /Length ${content.length} >>\nstream\n`, content, '\nendstream']);
  });
  const total=pageBase+nP*2, xref=len;
  let x=`xref\n0 ${total}\n0000000000 65535 f \n`;
  for(let i=1;i<total;i++) x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  add(x+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, {type:'application/pdf'});
};
async function loadMeetingAll(id){
  const ref=ROOT().doc(id), snap=await ref.get();
  if(!snap.exists) throw new Error('This meeting could not be found.');
  const names=['topics','agenda','notes','likes','actions','strokes','shapes','texts','stickies'];
