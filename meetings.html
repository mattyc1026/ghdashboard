}
/* the whiteboard as a picture, drawn the same way Save as Image draws it */
function boardJpeg(d){
  const saved=DATA; DATA=Object.assign(emptyData(), d);
  try{
    const b=wbBounds(); if(!b) return null;
    const pad=40, W=b[2]-b[0]+pad*2, H=b[3]-b[1]+pad*2, sc=Math.min(2, 2200/W, 2200/H);
    const c=document.createElement('canvas'); c.width=Math.max(1,Math.ceil(W*sc)); c.height=Math.max(1,Math.ceil(H*sc));
    const ctx=c.getContext('2d');
    ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,c.width,c.height);
    ctx.setTransform(sc,0,0,sc,(pad-b[0])*sc,(pad-b[1])*sc);
    const dark=document.documentElement.classList.contains('dark');
    if(dark) document.documentElement.classList.remove('dark');
    [...DATA.strokes.map(s=>['s',s]), ...DATA.shapes.map(s=>['h',s]), ...DATA.texts.map(s=>['t',s])].sort((a,b)=>(a[1].at||0)-(b[1].at||0))
      .forEach(([k,s])=>{ if(k==='s') drawStroke(ctx, ptsOf(s), s.color, s.size, s.tool); else if(k==='h') drawShape(ctx, s); else drawText(ctx, s); });
    DATA.stickies.forEach(s=>{
      const [x,y]=stickyPos(s);
      ctx.save(); ctx.fillStyle=s.color||STICKY_COLORS[0]; ctx.shadowColor='rgba(0,0,0,.18)'; ctx.shadowBlur=10; ctx.shadowOffsetY=3; ctx.fillRect(x,y,150,120); ctx.restore();
      ctx.save(); ctx.fillStyle='#1d1a00'; ctx.font="500 14px 'DM Sans', system-ui, sans-serif"; ctx.textBaseline='top';
      let line='', yy=y+26; String(s.text||'').split(/(\s+)/).forEach(w=>{ if(w.includes('\n')){ ctx.fillText(line,x+10,yy); yy+=19; line=''; return; } const t=line+w; if(ctx.measureText(t).width>130 && line){ ctx.fillText(line,x+10,yy); yy+=19; line=w.trimStart(); } else line=t; });
      if(line) ctx.fillText(line,x+10,yy); ctx.restore();
    });
    if(dark) document.documentElement.classList.add('dark');
    const url=c.toDataURL('image/jpeg', .88), bin=atob(url.split(',')[1]), u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    return {jpeg:u, w:c.width, h:c.height};
  } finally { DATA=saved; }
}
function summaryPdf(m, d){
  const P=new PdfDoc(), M=54, CW=P.W-M*2, BOTTOM=P.H-54;
  const NAVY='#0f2647', ORANGE='#e8791a', MUTED='#5f6e87', LINE='#dbe2ec', GREEN='#1f8a55';
  let y=0;
  P.page();
  const room=h=>{ if(y+h>BOTTOM){ P.page(); y=M; } };
  const para=(str, x, w, font, size, color, lh)=>{
    const lines=P.wrap(str, font, size, w); lh=lh||size*1.35;
    lines.forEach(l=>{ room(lh); P.text(l, x, y+size, {font, size, color}); y+=lh; });
  };
  const section=(title, color)=>{
    room(46); y+=14;
    P.text(title.toUpperCase(), M, y+11, {font:'B', size:10.5, color});
    y+=17; P.line(M, y, M+CW, y, {w:1.2, color}); y+=12;
  };
  // header band
  P.rect(0, 0, P.W, 96, NAVY);
  P.rect(0, 96, P.W*.25, 4, ORANGE); P.rect(P.W*.25, 96, P.W*.25, 4, '#2f6fd6'); P.rect(P.W*.5, 96, P.W*.25, 4, GREEN); P.rect(P.W*.75, 96, P.W*.25, 4, '#c0392b');
  const tl=P.wrap(m.title||'Meeting', 'B', 22, CW).slice(0,2);
  tl.forEach((l,i)=>P.text(l, M, 40+i*25, {font:'B', size:22, color:'#ffffff'}));
  const when=fmtDate(m.createdAt||Date.now())+', '+fmtTime(m.createdAt||Date.now())+(m.endedAt?'  to  '+fmtTime(m.endedAt):'');
  P.text(when, M, tl.length>1?88:68, {size:10.5, color:'#c9d4e6'});
  P.text('Good & Handy', P.W-M-P.width('Good & Handy','B',10), 30, {font:'B', size:10, color:'#ff9a45'});
  y=122;
  // who attended
  const who=new Set(Object.values(m.attendees||{}));
  if(m.createdByName) who.add(m.createdByName);
  d.notes.forEach(n=>n.byName && who.add(n.byName)); d.likes.forEach(l=>l.name && who.add(l.name)); d.actions.forEach(a=>a.byName && who.add(a.byName));
  if(who.size){ P.text('ATTENDED', M, y+9, {font:'B', size:8.5, color:MUTED}); y+=14; para([...who].sort().join(', '), M, CW, 'R', 11, NAVY); y+=4; }

  // agenda, in the order it was shown
  section('Agenda & Notes', ORANGE);
  const bySort=(a,b)=>(a.order||0)-(b.order||0)||(a.at||0)-(b.at||0);
  const topics=d.topics.slice().sort(bySort), ag=d.agenda.slice().sort(bySort);
  const tOf=a=>(a.topicId && topics.some(t=>t.id===a.topicId)) ? a.topicId : '';
  const loose=ag.filter(a=>!tOf(a));
  let blocks=topics.map(t=>({t, order:t.order||0}));
  if(loose.length) blocks.push({loose:true, order:m.looseOrder!=null?m.looseOrder:0});
  blocks.sort((a,b)=>a.order-b.order || (a.loose?-1:b.loose?1:0));
  const notesAll=d.notes.slice().sort((a,b)=>(a.at||0)-(b.at||0));
  const likeLine=id=>{ const L=d.likes.filter(l=>l.noteId===id); return L.length ? 'Liked by '+L.map(l=>l.name).join(', ') : ''; };
  const note=(n, x)=>{
    const w=CW-(x-M), head=(n.byName||'')+'   '+fmtTime(n.at||0);
    room(30);
    P.text(n.byName||'', x, y+9, {font:'B', size:9, color:colorFor(n.byName)});
    P.text(fmtTime(n.at||0), x+P.width((n.byName||'')+'  ','B',9), y+9, {size:8.5, color:MUTED});
    y+=13;
    para(n.text, x, w, 'R', 10.5, '#141f33');
    const lk=likeLine(n.id); if(lk) para(lk, x, w, 'I', 8.5, MUTED);
    y+=5;
  };
  const item=a=>{
    room(40); y+=4;
    const bx=M+2, by=y+2;
    P.box(bx, by, 10, 10, a.done?GREEN:'#9aa7bb', 1.2);
    if(a.done){ P.line(bx+2, by+5.2, bx+4.3, by+7.6, {w:1.6, color:GREEN}); P.line(bx+4.3, by+7.6, bx+8.2, by+2.6, {w:1.6, color:GREEN}); }
    const lines=P.wrap(a.text, 'B', 12.5, CW-20);
    lines.forEach((l,i)=>{ if(i) room(17); P.text(l, M+20, y+11, {font:'B', size:12.5, color:a.done?MUTED:NAVY}); y+=17; });
    y+=3;
    const top=notesAll.filter(n=>n.agendaId===a.id && !n.parentId);
    top.forEach(n=>{
      note(n, M+20);
      notesAll.filter(r=>r.parentId===n.id).forEach(r=>{
        const y0=y; note(r, M+44);
        P.line(M+34, y0+2, M+34, y-6, {w:1.5, color:'#f3c9a3'});
      });
    });
    y+=4;
  };
  if(!ag.length && !topics.length) para('No agenda items.', M, CW, 'I', 10.5, MUTED);
  blocks.forEach(b=>{
    if(b.loose){ loose.forEach(item); return; }
    room(44); y+=8;
    para(b.t.text, M, CW, 'B', 16, NAVY, 20);
    P.line(M, y+1, M+CW, y+1, {w:.8, color:'#f3c9a3'}); y+=10;
    const its=ag.filter(a=>tOf(a)===b.t.id);
    if(!its.length) para('No agenda items.', M+20, CW-20, 'I', 10, MUTED);
    its.forEach(item);
  });

  // action items
  section('Action Items', GREEN);
  const open=d.actions.filter(a=>!a.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||(a.at||0)-(b.at||0));
  const done=d.actions.filter(a=>a.done).sort((a,b)=>(a.doneAt||0)-(b.doneAt||0));
  if(!d.actions.length) para('No action items.', M, CW, 'I', 10.5, MUTED);
  [['Open', open], ['Done', done]].forEach(([lbl, list])=>{
    if(!list.length) return;
    room(30); P.text(lbl+' ('+list.length+')', M, y+10, {font:'B', size:10, color:GREEN}); y+=18;
    list.forEach(a=>{
      room(30);
      const bx=M+2, by=y+1.5;
      P.box(bx, by, 9, 9, a.done?GREEN:'#9aa7bb', 1.1);
      if(a.done){ P.line(bx+1.8, by+4.7, bx+3.9, by+6.9, {w:1.5, color:GREEN}); P.line(bx+3.9, by+6.9, bx+7.4, by+2.3, {w:1.5, color:GREEN}); }
      P.wrap(a.text, 'R', 11, CW-20).forEach((l,i)=>{ if(i) room(15); P.text(l, M+18, y+9.5, {size:11, color:a.done?MUTED:'#141f33'}); y+=15; });
      const meta=[a.assignee?'Assigned to '+a.assignee:'', a.due?'Due '+fmtShortDate(a.due):'', a.done&&a.doneBy?'Done by '+a.doneBy:''].filter(Boolean).join(', ');
      if(meta) para(meta, M+18, CW-18, 'R', 9, MUTED);
      y+=5;
    });
    y+=4;
  });

  // whiteboard
  const img=boardJpeg(d);
  if(img){
    const maxH=BOTTOM-M-40;
    let w=CW, h=img.h*w/img.w;
    if(h>maxH){ h=maxH; w=img.w*h/img.h; }
    if(y+40+h>BOTTOM){ P.page(); y=M-14; }
    section('Whiteboard', '#2f6fd6');
    P.box(M+(CW-w)/2-.5, y-.5, w+1, h+1, LINE, 1);
    P.image(img.jpeg, img.w, img.h, M+(CW-w)/2, y, w, h);
    y+=h+10;
  }

  // page numbers
  const n=P.pages.length;
  P.pages.forEach((ops,i)=>{
    P.cur=ops;
    const t=(m.title||'Meeting')+'   |   Page '+(i+1)+' of '+n;
    P.text(t, P.W-M-P.width(t,'R',8.5), P.H-28, {size:8.5, color:MUTED});
  });
  return P.blob();
}
async function downloadSummary(id, btn){
  if(btn){ if(btn.disabled) return; btn.disabled=true; }
  try{
    const {m, d}=await loadMeetingAll(id);
    const blob=summaryPdf(m, d);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=((m.title||'Meeting').replace(/[^\w ,.&'-]+/g,'').trim()||'Meeting')+' summary.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 8000);
  }catch(e){ fail(e); }
  finally{ if(btn) btn.disabled=false; }
}

/* =========================================================================
   WHITEBOARD
   An endless board: drag with two fingers (or the hand tool, the space bar,
   or a trackpad) to move around, pinch or ctrl-scroll to zoom. Pen lines are
   smoothed and, with a stylus, get thinner and thicker with pressure; while
   a stylus is in use, a resting hand or finger moves the board instead of
   drawing. There are shapes, text, sticky notes, a laser pointer for
   pointing things out, and a select tool for moving and recolouring things.
   Everyone sees lines, shapes and the laser as they are being drawn, and
   each person's cursor with their name.
========================================================================= */
const WB_UNIT_W=1000, WB_UNIT_H=625;      // the first whiteboards' size
const SIZES=[2.5,5,10];
const ERASE_R=[6,14,30];                     // the area eraser's sizes, in screen pixels
const WB={shapeMenu:false, tool:'pen', color:COLORS[0], size:1, sticky:STICKY_COLORS[0], shape:'rect',
  view:{x:0, y:0, z:1}, w:0, h:0, dpr:1, sel:null, penSeen:false, space:false, menu:false, pinMenu:false, follow:null, followRaf:0, eraseMode:'object', eSize:1,
  ptrs:new Map(), gesture:null, act:null, undo:[], redo:[], raf:0, mainDirty:true, ro:null};
const INK={remote:new Map(), lasers:new Map(), fading:[], myLaser:[]};

/* ----- coordinates ----- */
const K=()=>WB.view.z*WB.w/WB_UNIT_W;                  // screen pixels per board unit
const toScreen=(x,y)=>[(x-WB.view.x)*K(), (y-WB.view.y)*K()];
function toWorld(cx,cy){ const r=$('board').getBoundingClientRect(); return [(cx-r.left)/K()+WB.view.x, (cy-r.top)/K()+WB.view.y]; }
/* Lines from the first whiteboards stored fractions; newer ones store board
   units with a pressure value per point. Both come out as [x,y,p,...]. */
function ptsOf(s){
  if(s._w && s._wsrc===s.pts) return s._w;
  let out;
  if(s.v===2) out=s.pts||[];
  else{ out=[]; const p=s.pts||[]; for(let i=0;i<p.length;i+=2) out.push(p[i]*WB_UNIT_W, p[i+1]*WB_UNIT_H, .5); }
  s._w=out; s._wsrc=s.pts; return out;
}
function stickyPos(s){ return s.v===2 ? [s.x, s.y] : [s.x*WB_UNIT_W, s.y*WB_UNIT_H]; }

/* ----- the board on screen ----- */

        <button onclick="wbZoomBy(1.25)" aria-label="Zoom in">${icon('plus')}</button>

function wbTeardown(){

/* On a computer the board fills the rest of the window, so the page
   itself never scrolls while you draw. */
function wbFit(){

function wbSetFull(on){

function wbSize(){
  const b=$('board'); if(!b) return;
  const r=b.getBoundingClientRect(); if(!r.width) return;
  const first=!WB.w;
  WB.w=r.width; WB.h=r.height; WB.dpr=Math.min(window.devicePixelRatio||1, 3);
  ['cvMain','cvLive'].forEach(id=>{ const c=$(id); c.width=Math.round(r.width*WB.dpr); c.height=Math.round(r.height*WB.dpr); });

function wbApplyBg(){
  const b=$('board'); if(!b) return;

function wbBgPos(){
  const b=$('board'); if(!b) return;
  if(!WB.w || !(K()>0)) return;
  const step=25*K(); let s=step; while(s<12) s*=2; while(s>60) s/=2;
  b.style.backgroundSize=`${s}px ${s}px`;
  b.style.backgroundPosition=`${-WB.view.x*K()%s}px ${-WB.view.y*K()%s}px`;
}
function wbViewChanged(user){
  if(user) WB.userMoved=true;
  wbSendView();
  WB.mainDirty=true; wbBgPos(); renderStickies(); wbCursors(); wbPlaceTextEdit(); wbPlaceSelBar();
  const z=$('zoomPct'); if(z) z.textContent=Math.round(WB.view.z*100)+'%';
  wbKick();
}
function wbZoomAt(cx, cy, z){
  z=Math.max(.15, Math.min(6, z));
  const r=$('board').getBoundingClientRect();
  const [wx,wy]=toWorld(cx,cy);
  WB.view.z=z;
  WB.view.x=wx-(cx-r.left)/K(); WB.view.y=wy-(cy-r.top)/K();
  wbViewChanged(true);
}
function wbZoomBy(f){ const r=$('board').getBoundingClientRect(); wbAnimateView(()=>{ wbZoomAt(r.left+r.width/2, r.top+r.height/2, WB.view.z*f); }); }
function wbZoomTo(z){ const r=$('board').getBoundingClientRect(); wbAnimateView(()=>wbZoomAt(r.left+r.width/2, r.top+r.height/2, z)); }
/* Zoom buttons glide to the new view instead of jumping. */
function wbAnimateView(apply){
  const from=Object.assign({}, WB.view); apply(); const to=Object.assign({}, WB.view);
  if(RM.matches) return;
  const t0=performance.now(), D=260;
  const step=now=>{
    const t=Math.min(1,(now-t0)/D), e=1-Math.pow(1-t,3);
    // zoom changes geometrically so the motion feels even
    WB.view.z=from.z*Math.pow(to.z/from.z, e);
    WB.view.x=from.x+(to.x-from.x)*e; WB.view.y=from.y+(to.y-from.y)*e;
    wbViewChanged();
    if(t<1) requestAnimationFrame(step);
  };
  WB.view=from; requestAnimationFrame(step);
}
function wbBounds(){
  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  const add=(a,b,c,d)=>{ x1=Math.min(x1,a); y1=Math.min(y1,b); x2=Math.max(x2,c); y2=Math.max(y2,d); };
  DATA.strokes.forEach(s=>{ const p=ptsOf(s); for(let i=0;i<p.length;i+=3) add(p[i],p[i+1],p[i],p[i+1]); });
  DATA.shapes.forEach(s=>add(Math.min(s.x1,s.x2),Math.min(s.y1,s.y2),Math.max(s.x1,s.x2),Math.max(s.y1,s.y2)));
  DATA.texts.forEach(t=>{ const b=textBox(t); add(b[0],b[1],b[2],b[3]); });
  DATA.stickies.forEach(s=>{ const [x,y]=stickyPos(s); add(x,y,x+150,y+120); });
  return x1===Infinity ? null : [x1,y1,x2,y2];
}
function wbFitContent(instant){
  if(!WB.w) return;
  const b=wbBounds();
  const apply=()=>{
    if(!b){ WB.view={x:0, y:0, z:1}; wbViewChanged(); return; }
    const pad=40, bw=Math.max(b[2]-b[0], 200), bh=Math.max(b[3]-b[1], 120);
    const z=Math.max(.15, Math.min(1.25, Math.min((WB.w-pad*2)/(bw*WB.w/WB_UNIT_W), (WB.h-pad*2)/(bh*WB.w/WB_UNIT_W))));
    WB.view.z=z;
    const k=K();
    WB.view.x=b[0]+bw/2-(WB.w/2)/k; WB.view.y=b[1]+bh/2-(WB.h/2)/k;
    if(b[2]-b[0]<200) WB.view.x=(b[0]+b[2])/2-(WB.w/2)/k;
    if(b[3]-b[1]<120) WB.view.y=(b[1]+b[3])/2-(WB.h/2)/k;
    wbViewChanged();
  };
  if(instant) apply(); else wbAnimateView(apply);
}

/* ----- agenda pinned to the top of the board ----- */
function pinTarget(p){

/* ----- presenting the board -----
   While someone presents, everyone else's board follows the presenter's view
   and no one else can draw, type or move things. */
function boardPresenterLive(){
  const p=MTG && MTG.boardPresenter;
  if(!p || !p.uid || readOnly()) return null;
  if(p.uid===ME.uid) return p;
  const pres=DATA.presence.find(x=>x.id===p.uid);
  return (pres && (Date.now()-(pres.at||0))<ALIVE_MS) ? p : null;
}
function wbLocked(){ const p=boardPresenterLive(); return !!(p && p.uid!==ME.uid); }
function startBoardPresenting(){
  if(readOnly()) return;
  MTG.boardPresenter={uid:ME.uid, name:ME.name, at:Date.now()};
  MREF().update({boardPresenter:MTG.boardPresenter}).catch(fail);
  renderWbBar(); wbSendView(true);
}
function stopBoardPresenting(){ MTG.boardPresenter=null; MREF().update({boardPresenter:null}).catch(fail); renderWbBar(); }
function wbSendView(now){
  const p=boardPresenterLive(); if(!p || p.uid!==ME.uid || !WB.w || TAB!=='board') return;
  const k=K();
  const v={cx:+(WB.view.x+WB.w/2/k).toFixed(1), cy:+(WB.view.y+WB.h/2/k).toFixed(1), vw:+(WB.w/k).toFixed(1), vh:+(WB.h/k).toFixed(1)};
  const t=Date.now();
  clearTimeout(WB.viewT);
  if(now || t-(WB.viewSent||0)>90){ WB.viewSent=t; liveSend({bview:v}); }
  else WB.viewT=setTimeout(()=>wbSendView(true), 100);
}
/* Followers glide to the presenter's view, showing the same area of the board. */
function wbFollowView(){
  if(!wbLocked() || !WB.w) return;
  const p=boardPresenterLive(), pres=DATA.presence.find(x=>x.id===p.uid);
  const v=pres && pres.bview; if(!v) return;
  const k=Math.min(WB.w/v.vw, WB.h/v.vh), z=Math.max(.05, Math.min(8, k*WB_UNIT_W/WB.w));
  WB.follow={x:v.cx-WB.w/2/k, y:v.cy-WB.h/2/k, z};
  if(RM.matches){ Object.assign(WB.view, WB.follow); wbViewChanged(); return; }
  if(!WB.followRaf) WB.followRaf=requestAnimationFrame(wbFollowStep);
}
function wbFollowStep(){
  WB.followRaf=0;
  const f=WB.follow; if(!f || !wbLocked()) return;
  const v=WB.view, a=.22;
  const nz=v.z*Math.pow(f.z/v.z, a);
  // keep the middle of the screen moving straight toward the target's middle
  const cx=v.x+WB.w/2/K(), cy=v.y+WB.h/2/K();
  const tcx=f.x+WB.w/2/(f.z*WB.w/WB_UNIT_W), tcy=f.y+WB.h/2/(f.z*WB.w/WB_UNIT_W);
  const ncx=cx+(tcx-cx)*a, ncy=cy+(tcy-cy)*a;
  v.z=nz; const k=K(); v.x=ncx-WB.w/2/k; v.y=ncy-WB.h/2/k;
  const done=Math.abs(Math.log(f.z/nz))<.002 && Math.hypot(tcx-ncx, tcy-ncy)*k<.5;
  if(done){ Object.assign(v, f); }
  wbViewChanged();
  if(!done) WB.followRaf=requestAnimationFrame(wbFollowStep);
}
function wbOnBoardPresenter(prev){
  const pp=(prev.boardPresenter||{}).uid, np=(MTG.boardPresenter||{}).uid;
  if(pp!==np){
    if(np && np!==ME.uid){
      if(WB.textEdit) wbCommitText();
      WB.act=null; wbSelect(null);
      if(TAB!=='board') toast(MTG.boardPresenter.name+' is presenting the whiteboard.');
    }
    WB.follow=null;
  }
  renderWbBar(); wbFollowView(); wbSendView(true);
}

document.addEventListener('pointerdown', e=>{ if((WB.menu || WB.pinMenu || WB.shapeMenu) && !e.target.closest('#wbBar,.wbMenus')){ WB.menu=false; WB.pinMenu=false; WB.shapeMenu=false; renderWbBar(); } });
/* The shape button opens a small menu of shapes just below it. */
function wbShapeBtn(){
  const open=!(WB.tool==='shape' && WB.shapeMenu);
  if(WB.tool!=='shape') setTool('shape');
  WB.shapeMenu=open; WB.menu=false; WB.pinMenu=false; renderWbBar();
}
function wbRenderShapeMenu(){
  const m=$('wbShapeMenu'); if(!m) return;
  const btn=$('wbShapeBtn');
  if(!WB.shapeMenu || !btn || WB.tool!=='shape'){ m.innerHTML=''; return; }
  const wrap=$('wbWrap').getBoundingClientRect(), r=btn.getBoundingClientRect();
  m.innerHTML=`<div class="menuPop shapePop" style="left:${Math.max(0, r.left-wrap.left-6)}px;right:auto">${['rect','ellipse','line','arrow'].map(k=>
    `<button class="tool ${WB.shape===k?'on':''}" aria-label="${k}" onclick="WB.shape='${k}';WB.shapeMenu=false;renderWbBar()">${icon(k)}</button>`).join('')}</div>`;
}
function setTool(k){
  if(WB.textEdit) wbCommitText();
  WB.tool=k; WB.menu=false; if(k!=='shape') WB.shapeMenu=false;
  if(k!=='select') wbSelect(null);
  const b=$('board'); if(b){ b.className=b.className.replace(/\bt-\w+/g,'').trim()+' t-'+k; }
  renderWbBar(); wbKick();
}
function setColor(c){
  if(WB.tool==='sticky') WB.sticky=c; else WB.color=c;
  renderWbBar();
}

/* ----- drawing ----- */
function bColor(c){
  // dark inks are drawn light on the dark board so they stay visible
  if(document.documentElement.classList.contains('dark') && (c===COLORS[0] || c==='#111111')) return '#dbe5f5';
  return c;
}
function setCtx(ctx){ const k=K()*WB.dpr; ctx.setTransform(k,0,0,k,-WB.view.x*k,-WB.view.y*k); }
/* A smooth line through the points; with pressure, segment widths follow it. */
function drawStroke(ctx, pts, color, size, tool, upto, alpha){
  const n=Math.min(pts.length, upto==null?Infinity:upto*3);
  if(n<3) return;
  ctx.save();
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle=bColor(color); ctx.globalAlpha=(tool==='marker'?.35:1)*(alpha==null?1:alpha);
  const base=size*(tool==='marker'?3:1);
  let varying=false;
  if(tool!=='marker') for(let i=5;i<n;i+=3) if(Math.abs(pts[i]-pts[2])>.04){ varying=true; break; }
  if(!varying){
    ctx.lineWidth=base;
    ctx.beginPath(); ctx.moveTo(pts[0],pts[1]);
    if(n===3) ctx.lineTo(pts[0]+.01,pts[1]);
    else if(n===6) ctx.lineTo(pts[3],pts[4]);
    else{
      for(let i=3;i<n-3;i+=3) ctx.quadraticCurveTo(pts[i],pts[i+1],(pts[i]+pts[i+3])/2,(pts[i+1]+pts[i+4])/2);
      ctx.lineTo(pts[n-3],pts[n-2]);
    }
    ctx.stroke();
  } else {
    let px=pts[0], py=pts[1];
    for(let i=3;i<n;i+=3){
      const mx=i+3<n?(pts[i]+pts[i+3])/2:pts[i], my=i+3<n?(pts[i+1]+pts[i+4])/2:pts[i+1];
      ctx.lineWidth=Math.max(.6, base*(0.35+pts[i+2]*1.3));
      ctx.beginPath(); ctx.moveTo(px,py); ctx.quadraticCurveTo(pts[i],pts[i+1],mx,my); ctx.stroke();
      px=mx; py=my;
    }
  }
  ctx.restore();
}
function drawShape(ctx, s, alpha){
  ctx.save();
  ctx.strokeStyle=bColor(s.color); ctx.lineWidth=s.size; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.globalAlpha=alpha==null?1:alpha;
  const x=Math.min(s.x1,s.x2), y=Math.min(s.y1,s.y2), w=Math.abs(s.x2-s.x1), h=Math.abs(s.y2-s.y1);
  ctx.beginPath();
  if(s.kind==='rect'){ const r=Math.min(10, w/4, h/4); if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h); }
  else if(s.kind==='ellipse'){ ctx.ellipse(x+w/2, y+h/2, w/2, h/2, 0, 0, Math.PI*2); }
  else { ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); }
  ctx.stroke();
  if(s.kind==='arrow'){
    const a=Math.atan2(s.y2-s.y1, s.x2-s.x1), L=Math.max(12, s.size*4);
    ctx.beginPath();
    ctx.moveTo(s.x2-L*Math.cos(a-.45), s.y2-L*Math.sin(a-.45)); ctx.lineTo(s.x2,s.y2); ctx.lineTo(s.x2-L*Math.cos(a+.45), s.y2-L*Math.sin(a+.45));
    ctx.stroke();
  }
  ctx.restore();
}
const TEXT_FONT=size=>`600 ${size}px 'DM Sans', system-ui, sans-serif`;
function textBox(t){
  const lines=String(t.text||'').split('\n'), size=t.size||28;
  const c=textBox.c||(textBox.c=document.createElement('canvas').getContext('2d'));
  c.font=TEXT_FONT(size);
  const w=Math.max(20, ...lines.map(l=>c.measureText(l).width));
  return [t.x, t.y, t.x+w, t.y+lines.length*size*1.25];
}
function drawText(ctx, t, alpha){
  ctx.save();
  ctx.globalAlpha=alpha==null?1:alpha;
  ctx.fillStyle=bColor(t.color); ctx.font=TEXT_FONT(t.size||28); ctx.textBaseline='top';
  String(t.text||'').split('\n').forEach((l,i)=>ctx.fillText(l, t.x, t.y+i*(t.size||28)*1.25));
  ctx.restore();
}
function wbDrawMain(){
  const c=$('cvMain'); if(!c || !WB.w) return;
  const ctx=c.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,c.width,c.height);
  setCtx(ctx);
  const moving=WB.act && WB.act.kind==='move' ? WB.act : null;
  const all=[...DATA.strokes.map(s=>['s',s]), ...DATA.shapes.map(s=>['h',s]), ...DATA.texts.map(s=>['t',s])].sort((a,b)=>(a[1].at||0)-(b[1].at||0));
  all.forEach(([k,s])=>{
    if(moving && moving.id===s.id) return;
    if(WB.textEdit && WB.textEdit.id===s.id) return;
    if(k==='s') drawStroke(ctx, ptsOf(s), s.color, s.size, s.tool);
    else if(k==='h') drawShape(ctx, s);
    else drawText(ctx, s);
  });
  WB.mainDirty=false;
}
function wbKick(){ if(!WB.raf) WB.raf=requestAnimationFrame(wbFrame); }
function wbFrame(){
  WB.raf=0;
  if(WB.mainDirty) wbDrawMain();
  const c=$('cvLive'); if(!c || !WB.w) return;
  const ctx=c.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,c.width,c.height);
  setCtx(ctx);
  const now=performance.now();
  let again=false;
  // other people's lines and shapes in progress, revealed smoothly
  INK.remote.forEach((r,u)=>{
    if(r.shape){ drawShape(ctx, r.shape); }
    else{
      const total=r.pts.length/3;
      if(r.shown<total){ r.shown=Math.min(total, r.shown+Math.max(1,(total-r.shown)*.22)); again=true; }
      drawStroke(ctx, r.pts, r.color, r.size, r.tool, Math.floor(r.shown));
    }
    if(r.ended){ if(now-r.ended>1500) INK.remote.delete(u); else again=true; }
  });
  // erased or undone things fade out
  INK.fading=INK.fading.filter(f=>{
    const t=(now-f.t0)/220; if(t>=1) return false;
    if(f.k==='s') drawStroke(ctx, ptsOf(f.s), f.s.color, f.s.size, f.s.tool, null, 1-t);
    else if(f.k==='h') drawShape(ctx, f.s, 1-t);
    else drawText(ctx, f.s, 1-t);
    again=true; return true;
  });
  // the thing being moved follows the finger
  const a=WB.act;
  if(a && a.kind==='move'){
    const it=a.item;
    ctx.save(); ctx.translate(a.dx, a.dy);
    if(a.col==='strokes') drawStroke(ctx, ptsOf(it), it.color, it.size, it.tool);
    else if(a.col==='shapes') drawShape(ctx, it);
    else if(a.col==='texts') drawText(ctx, it);
    ctx.restore();
  }
  if(a && a.kind==='draw') drawStroke(ctx, a.pts, a.color, a.size, a.tool);
  if(a && a.kind==='shape' && a.s) drawShape(ctx, a.s);
  // laser trails, mine and everyone else's
  const laser=(pts, color)=>{
    const life=750;
    const live=pts.filter(p=>now-p[2]<life);
    if(live.length<1) return false;
    ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
    for(let i=1;i<live.length;i++){
      const age=(now-live[i][2])/life;
      ctx.strokeStyle=color; ctx.globalAlpha=Math.max(0,1-age)*.85;
      ctx.lineWidth=(5/K())*(1-age*.6);
      ctx.shadowColor=color; ctx.shadowBlur=12;
      ctx.beginPath(); ctx.moveTo(live[i-1][0],live[i-1][1]); ctx.lineTo(live[i][0],live[i][1]); ctx.stroke();
    }
    const h=live[live.length-1];
    if(now-h[2]<life){ ctx.globalAlpha=Math.max(0,1-(now-h[2])/life); ctx.fillStyle=color; ctx.shadowBlur=16; ctx.beginPath(); ctx.arc(h[0],h[1],6/K(),0,Math.PI*2); ctx.fill(); }
    ctx.restore();
    return true;
  };
  if(laser(INK.myLaser, colorFor(ME.name))) again=true; else INK.myLaser=[];
  INK.lasers.forEach((l,u)=>{ if(laser(l.pts, l.color)) again=true; else INK.lasers.delete(u); });
  // selection outline
  if(WB.sel){
    const it=findItem(WB.sel.col, WB.sel.id);
    if(it){
      const b=itemBox(WB.sel.col, it), d=(a && a.kind==='move')?[a.dx,a.dy]:[0,0], pad=8/K();
      ctx.save(); ctx.setLineDash([6/K(),4/K()]); ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--c-board').trim()||'#2f6fd6';
      ctx.lineWidth=1.5/K(); ctx.strokeRect(b[0]-pad+d[0], b[1]-pad+d[1], b[2]-b[0]+pad*2, b[3]-b[1]+pad*2); ctx.restore();
    } else wbSelect(null);
  }
  // the eraser's circle
  if(WB.hover && WB.tool==='eraser' && !readOnly()){
    const er=(WB.eraseMode==='area' ? ERASE_R[WB.eSize] : 14)/K();
    ctx.save(); ctx.beginPath(); ctx.arc(WB.hover[0], WB.hover[1], er, 0, Math.PI*2);
    ctx.strokeStyle='#2f6fd6'; ctx.lineWidth=1.5/K(); ctx.setLineDash([3/K(),3/K()]);
    ctx.fillStyle='rgba(47,111,214,.08)'; ctx.fill(); ctx.stroke(); ctx.restore();
  }
  if(again) wbKick();
}
function wbOnItems(){
  // a board that already has things on it opens showing all of them, once everything has loaded
  if(!WB.autoFit && !WB.userMoved && !wbLocked()){
    clearTimeout(WB.fitT);
    WB.fitT=setTimeout(()=>{ if(!WB.autoFit && !WB.userMoved && WB.w && wbBounds()){ WB.autoFit=true; wbFitContent(true); } }, 350);
  }
  DATA.strokes.forEach(s=>{ const r=INK.remote.get(s.by); if(r && r.id===s.id) INK.remote.delete(s.by); });
  DATA.shapes.forEach(s=>{ const r=INK.remote.get(s.by); if(r && r.id===s.id) INK.remote.delete(s.by); });
  WB.mainDirty=true; wbKick(); wbPlaceSelBar();
}

/* ----- finding things on the board ----- */
function findItem(col, id){ return (DATA[col]||[]).find(x=>x.id===id); }
function itemBox(col, it){
  if(col==='strokes'){ const p=ptsOf(it); let a=[Infinity,Infinity,-Infinity,-Infinity]; for(let i=0;i<p.length;i+=3){ a=[Math.min(a[0],p[i]),Math.min(a[1],p[i+1]),Math.max(a[2],p[i]),Math.max(a[3],p[i+1])]; } const h=it.size*(it.tool==='marker'?1.5:.5); return [a[0]-h,a[1]-h,a[2]+h,a[3]+h]; }
  if(col==='shapes') return [Math.min(it.x1,it.x2),Math.min(it.y1,it.y2),Math.max(it.x1,it.x2),Math.max(it.y1,it.y2)];
  return textBox(it);
}
function distSeg(px,py,ax,ay,bx,by){ const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy; let t=L?((px-ax)*dx+(py-ay)*dy)/L:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(px-ax-t*dx, py-ay-t*dy); }
function hitItem(x,y,r){
  const cand=[];
  DATA.texts.forEach(t=>{ const b=textBox(t); if(x>=b[0]-r && x<=b[2]+r && y>=b[1]-r && y<=b[3]+r) cand.push(['texts',t]); });
  DATA.shapes.forEach(s=>{
    const x1=Math.min(s.x1,s.x2), y1=Math.min(s.y1,s.y2), x2=Math.max(s.x1,s.x2), y2=Math.max(s.y1,s.y2), rr=r+s.size/2;
    let hit=false;
    if(s.kind==='line'||s.kind==='arrow') hit=distSeg(x,y,s.x1,s.y1,s.x2,s.y2)<rr;
    else if(s.kind==='rect') hit=(x>=x1-rr&&x<=x2+rr&&y>=y1-rr&&y<=y2+rr) && !(x>x1+rr&&x<x2-rr&&y>y1+rr&&y<y2-rr);
    else { const cx=(x1+x2)/2, cy=(y1+y2)/2, ax=Math.max(1,(x2-x1)/2), ay=Math.max(1,(y2-y1)/2); const d=Math.hypot((x-cx)/ax,(y-cy)/ay); hit=Math.abs(d-1)*Math.min(ax,ay)<rr; }
    if(hit) cand.push(['shapes',s]);
  });
  DATA.strokes.forEach(s=>{
    const p=ptsOf(s), rr=r+s.size*(s.tool==='marker'?1.5:.5);
    for(let i=0;i<p.length;i+=3){
      const d=i+3<p.length ? distSeg(x,y,p[i],p[i+1],p[i+3],p[i+4]) : Math.hypot(x-p[i],y-p[i+1]);
      if(d<rr){ cand.push(['strokes',s]); break; }
    }
  });
  cand.sort((a,b)=>(b[1].at||0)-(a[1].at||0));   // the newest is on top
  return cand[0]||null;
}

/* ----- pointer input ----- */
function wbDown(e){
  if(wbLocked()){ e.preventDefault(); return; }
  if(e.target.closest('.stk,.zoomBox,.selBar,.textEdit')) return;
  if(e.button>0 && e.button!==1) return;
  const b=$('board');
  b.setPointerCapture(e.pointerId);
  if(e.pointerType==='pen') WB.penSeen=true;
  WB.ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY, type:e.pointerType});
  // two fingers: move and zoom the board, dropping a line just started
  if(WB.ptrs.size===2){
    if(WB.act && (WB.act.kind==='draw' && WB.act.pts.length<30 || WB.act.kind==='shape' || WB.act.kind==='pan')) WB.act=null;
    if(!WB.act){ wbStartPinch(); wbKick(); return; }
  }
  if(WB.ptrs.size>2) return;
  const [x,y]=toWorld(e.clientX, e.clientY);
  const touchPan = e.pointerType==='touch' && WB.penSeen;
  const tool = (e.button===1 || WB.space || touchPan || readOnly() && WB.tool!=='laser') ? 'hand' : WB.tool;
  if(WB.textEdit && tool!=='text') wbCommitText();
  e.preventDefault();
  if(tool==='hand'){ WB.act={kind:'pan', sx:e.clientX, sy:e.clientY, vx:WB.view.x, vy:WB.view.y}; b.classList.add('panning'); return; }
  if(tool==='pen'||tool==='marker'){
    WB.act={kind:'draw', id:uid(), pts:[+x.toFixed(1), +y.toFixed(1), pressureOf(e)], color:WB.color, size:SIZES[WB.size], tool};
    wbKick(); return;
  }
  if(tool==='eraser' && WB.eraseMode==='area'){
    WB.act={kind:'aerase', last:[x,y], orig:new Map(), created:new Set(), pendAdd:new Map(), pendDel:{strokes:new Set(), shapes:new Set()}, flushT:0};
    WB.hover=[x,y]; wbAreaErase(x,y,x,y); wbKick(); return;
  }
  if(tool==='eraser'){ WB.act={kind:'erase', hit:new Set()}; WB.hover=[x,y]; wbEraseAt(x,y); wbKick(); return; }
  if(tool==='shape'){ WB.act={kind:'shape', id:uid(), x0:x, y0:y, s:null}; return; }
  if(tool==='laser'){ WB.act={kind:'laser'}; INK.myLaser.push([x,y,performance.now()]); wbSendLaser(); wbKick(); return; }
  /* Text opens when the finger lifts, so phones and tablets bring up the
     keyboard. A tap while a box is open just finishes that box. */
  if(tool==='text'){
    if(WB.textEdit){ wbCommitText(); return; }
    const h=hitItem(x,y,6/K());
    WB.act={kind:'text', item:(h && h[0]==='texts') ? h[1] : null, x, y, sx:e.clientX, sy:e.clientY};
    return;
  }
  if(tool==='sticky'){ addSticky(x-75, y-20); return; }
  if(tool==='select'){
    const h=hitItem(x,y,8/K());
    if(h){ wbSelect({col:h[0], id:h[1].id}); WB.act={kind:'move', col:h[0], id:h[1].id, item:h[1], sx:x, sy:y, dx:0, dy:0}; WB.mainDirty=true; }
    else { wbSelect(null); WB.act={kind:'pan', sx:e.clientX, sy:e.clientY, vx:WB.view.x, vy:WB.view.y}; b.classList.add('panning'); }
    wbKick();
  }
}
const pressureOf=e=>+((e.pointerType==='pen' && e.pressure>0) ? e.pressure : .5).toFixed(2);
function wbStartPinch(){
  const [a,b]=[...WB.ptrs.values()];
  const r=$('board').getBoundingClientRect();
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  WB.gesture={d:Math.hypot(a.x-b.x,a.y-b.y)||1, z:WB.view.z, world:toWorld(mx,my), mx, my, left:r.left, top:r.top};
}
function wbMove(e){
  const p=WB.ptrs.get(e.pointerId);
  if(p){ p.x=e.clientX; p.y=e.clientY; }
  const [x,y]=toWorld(e.clientX, e.clientY);
  if(e.pointerType!=='touch'){ WB.hover=[x,y]; wbSendCursor(x,y); }
  if(WB.gesture && WB.ptrs.size>=2){
    const [a,b]=[...WB.ptrs.values()], g=WB.gesture;
    const d=Math.hypot(a.x-b.x,a.y-b.y)||1, mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    WB.view.z=Math.max(.15, Math.min(6, g.z*d/g.d));
    WB.view.x=g.world[0]-(mx-g.left)/K(); WB.view.y=g.world[1]-(my-g.top)/K();
    wbViewChanged(true); return;
  }
  const a=WB.act;
  if(!a){ if(WB.tool==='eraser') wbKick(); else if(WB.tool==='select'){ const b=$('board'); b.classList.toggle('overItem', !!hitItem(x,y,8/K())); } return; }
  if(a.kind==='pan'){ WB.view.x=a.vx-(e.clientX-a.sx)/K(); WB.view.y=a.vy-(e.clientY-a.sy)/K(); wbViewChanged(true); return; }
  const evs=(e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
  if(a.kind==='draw'){
    const min=1.1/K();
    evs.forEach(ev=>{
      const [wx,wy]=toWorld(ev.clientX, ev.clientY), n=a.pts.length;
      if(Math.hypot(a.pts[n-3]-wx, a.pts[n-2]-wy)<min) return;
      a.pts.push(+wx.toFixed(1), +wy.toFixed(1), pressureOf(ev));
    });
    liveSend({ink:{id:a.id, v:2, pts:a.pts.slice(0,4500), color:a.color, size:a.size, tool:a.tool}, cur:{x:+x.toFixed(1), y:+y.toFixed(1)}});
    wbKick(); return;
  }
  if(a.kind==='erase'){ evs.forEach(ev=>{ const w=toWorld(ev.clientX, ev.clientY); WB.hover=w; wbEraseAt(w[0],w[1]); }); wbKick(); return; }
  if(a.kind==='aerase'){ evs.forEach(ev=>{ const w=toWorld(ev.clientX, ev.clientY); wbAreaErase(a.last[0], a.last[1], w[0], w[1]); a.last=w; WB.hover=w; }); wbKick(); return; }
  if(a.kind==='shape'){
    let x2=x, y2=y;
    if(e.shiftKey){
      if(WB.shape==='line'||WB.shape==='arrow'){ const ang=Math.round(Math.atan2(y-a.y0,x-a.x0)/(Math.PI/4))*(Math.PI/4), L=Math.hypot(x-a.x0,y-a.y0); x2=a.x0+L*Math.cos(ang); y2=a.y0+L*Math.sin(ang); }
      else{ const s=Math.max(Math.abs(x-a.x0),Math.abs(y-a.y0)); x2=a.x0+Math.sign(x-a.x0||1)*s; y2=a.y0+Math.sign(y-a.y0||1)*s; }
    }
    a.s={kind:WB.shape, x1:+a.x0.toFixed(1), y1:+a.y0.toFixed(1), x2:+x2.toFixed(1), y2:+y2.toFixed(1), color:WB.color, size:SIZES[WB.size]};
    liveSend({ink:{id:a.id, shape:a.s}, cur:{x:+x.toFixed(1), y:+y.toFixed(1)}});
    wbKick(); return;
  }
  if(a.kind==='laser'){ evs.forEach(ev=>{ const w=toWorld(ev.clientX, ev.clientY); INK.myLaser.push([w[0],w[1],performance.now()]); }); wbSendLaser(); wbKick(); return; }
  if(a.kind==='move'){ a.dx=x-a.sx; a.dy=y-a.sy; wbKick(); wbPlaceSelBar(); }
}
function wbUp(e){
  WB.ptrs.delete(e.pointerId);
  const b=$('board'); if(b) b.classList.remove('panning');
  if(WB.gesture){ if(WB.ptrs.size<2){ WB.gesture=null; WB.act=null; } return; }
  const a=WB.act; WB.act=null;
  if(!a) return;
  if(a.kind==='draw'){
    liveSend({ink:null});
    if(a.pts.length<3){ wbKick(); return; }
    const doc={v:2, pts:a.pts, color:a.color, size:a.size, tool:a.tool, by:ME.uid, at:Date.now()};
    DATA.strokes.push(Object.assign({id:a.id}, doc)); WB.mainDirty=true; wbKick();
    wbAdd('strokes', a.id, doc);
  } else if(a.kind==='shape'){
    liveSend({ink:null});
    const s=a.s;
    if(s && Math.hypot(s.x2-s.x1, s.y2-s.y1)>4/K()){
      const doc=Object.assign({}, s, {by:ME.uid, at:Date.now()});
      DATA.shapes.push(Object.assign({id:a.id}, doc)); WB.mainDirty=true;
      wbAdd('shapes', a.id, doc);
    }
    wbKick();
  } else if(a.kind==='laser'){ wbSendLaser(true); }
  else if(a.kind==='text'){ if(Math.hypot(e.clientX-a.sx, e.clientY-a.sy)<14){ if(a.item) wbOpenText(a.item); else wbOpenText(null, a.x, a.y); } }
  else if(a.kind==='aerase'){ wbAreaFlush(a, true); wbKick(); }
  else if(a.kind==='move'){
    if(Math.abs(a.dx)>.5 || Math.abs(a.dy)>.5) wbMoveItem(a.col, a.item, a.dx, a.dy);
    WB.mainDirty=true; wbKick(); wbPlaceSelBar();
  } else wbKick();
}
function wbWheel(e){
  e.preventDefault();
  if(wbLocked()) return;
  if(e.ctrlKey || e.metaKey){
    wbZoomAt(e.clientX, e.clientY, WB.view.z*Math.exp(-e.deltaY*(e.deltaMode===1?.05:.0025)));
  } else {
    const f=e.deltaMode===1?16:1;
    WB.view.x+=e.deltaX*f/K(); WB.view.y+=e.deltaY*f/K(); wbViewChanged(true);
  }
}
function wbDbl(e){
  if(readOnly() || wbLocked() || WB.tool!=='select') return;
  const [x,y]=toWorld(e.clientX, e.clientY);
  const h=hitItem(x,y,6/K());
  if(h && h[0]==='texts') wbOpenText(h[1]);
}
document.addEventListener('keydown', e=>{
  if(!MTG || TAB!=='board') return;
  const typing=e.target.closest && e.target.closest('input,textarea,select,[contenteditable]');
  if(e.code==='Space' && !typing){ if(!WB.space){ WB.space=true; const b=$('board'); if(b) b.classList.add('t-hand'); } e.preventDefault(); return; }
  if(typing || readOnly() || wbLocked()) return;
  const mod=e.metaKey||e.ctrlKey;
  if(mod && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey ? wbRedo() : wbUndo(); }
  else if(mod && e.key.toLowerCase()==='y'){ e.preventDefault(); wbRedo(); }
  else if((e.key==='Delete'||e.key==='Backspace') && WB.sel){ e.preventDefault(); wbDeleteSel(); }

});
document.addEventListener('keyup', e=>{ if(e.code==='Space' && WB.space){ WB.space=false; const b=$('board'); if(b) b.classList.remove('t-hand'); } });

/* ----- saving, with undo and redo ----- */
function pushUndo(entry){ WB.undo.push(entry); if(WB.undo.length>100) WB.undo.shift(); WB.redo=[]; renderWbBar(); }
function wbAdd(col, id, doc, noUndo){
  SUB(col).doc(id).set(doc).catch(fail);
  if(!noUndo) pushUndo({t:'add', col, id, doc});
}
function wbRemove(col, it, noUndo){
  INK.fading.push({k:col==='strokes'?'s':col==='shapes'?'h':'t', s:it, t0:performance.now()});
  DATA[col]=DATA[col].filter(x=>x.id!==it.id); WB.mainDirty=true; wbKick();
  const {id, _w, _wsrc, ...doc}=it;
  SUB(col).doc(it.id).delete().catch(fail);
  if(!noUndo) pushUndo({t:'del', col, id:it.id, doc});
}
function movedDoc(col, it, dx, dy){
  if(col==='strokes'){ const p=ptsOf(it).slice(); for(let i=0;i<p.length;i+=3){ p[i]=+(p[i]+dx).toFixed(1); p[i+1]=+(p[i+1]+dy).toFixed(1); } return {v:2, pts:p}; }
  if(col==='shapes') return {x1:+(it.x1+dx).toFixed(1), y1:+(it.y1+dy).toFixed(1), x2:+(it.x2+dx).toFixed(1), y2:+(it.y2+dy).toFixed(1)};
  return {x:+(it.x+dx).toFixed(1), y:+(it.y+dy).toFixed(1)};
}
function wbMoveItem(col, it, dx, dy){
  const before=col==='strokes' ? {v:it.v||1, pts:it.pts} : col==='shapes' ? {x1:it.x1,y1:it.y1,x2:it.x2,y2:it.y2} : {x:it.x, y:it.y};
  const after=movedDoc(col, it, dx, dy);
  Object.assign(it, after); WB.mainDirty=true;
  SUB(col).doc(it.id).update(after).catch(fail);
  pushUndo({t:'upd', col, id:it.id, before, after});
}
function wbUndo(){
  const u=WB.undo.pop(); if(!u) return;
  wbApplyHistory(u, true); WB.redo.push(u); renderWbBar();
}
function wbRedo(){
  const u=WB.redo.pop(); if(!u) return;
  wbApplyHistory(u, false); WB.undo.push(u); renderWbBar();
}
function wbApplyHistory(u, back){
  const add=(u.t==='add')!==back;
  if(u.t==='add' || u.t==='del'){
    if(add){ SUB(u.col).doc(u.id).set(u.doc).catch(fail); if(u.col!=='stickies'){ DATA[u.col].push(Object.assign({id:u.id}, u.doc)); WB.mainDirty=true; } }
    else{
      const it=findItem(u.col, u.id);
      if(u.col==='stickies'){ SUB('stickies').doc(u.id).delete().catch(fail); }
      else if(it) wbRemove(u.col, it, true); else SUB(u.col).doc(u.id).delete().catch(fail);
    }
  } else if(u.t==='multi'){
    const put=back?u.del:u.add, drop=back?u.add:u.del, ops=[];
    drop.forEach(x=>{
      ops.push(b=>b.delete(SUB(x.col).doc(x.id)));
      const it=findItem(x.col, x.id);
      if(it){ INK.fading.push({k:x.col==='strokes'?'s':'h', s:it, t0:performance.now()}); DATA[x.col]=DATA[x.col].filter(y=>y.id!==x.id); }
    });
    put.forEach(x=>{ ops.push(b=>b.set(SUB(x.col).doc(x.id), x.doc)); if(!findItem(x.col, x.id)) DATA[x.col].push(Object.assign({id:x.id}, x.doc)); });
    wbBatch(ops); WB.mainDirty=true;
  } else if(u.t==='upd'){
    const it=findItem(u.col, u.id), v=back?u.before:u.after;
    if(it){ Object.assign(it, v); WB.mainDirty=true; }
    SUB(u.col).doc(u.id).update(v).catch(fail);
    if(u.col==='stickies') renderStickies();
  }
  if(WB.sel && !findItem(WB.sel.col, WB.sel.id)) wbSelect(null);
  wbKick(); wbPlaceSelBar();
}
function wbEraseAt(x,y){
  const r=14/K();
  for(;;){
    const h=hitItem(x,y,r);
    if(!h || WB.act.hit.has(h[1].id)) break;
    WB.act.hit.add(h[1].id); wbRemove(h[0], h[1]);
  }
}
/* ----- the area eraser -----
   Rubbing removes only the part of a line under the eraser, splitting it into
   pieces. A shape it touches becomes lines so only the rubbed part goes too.
   Changes are shown at once and saved in small bundles while you rub. */
function wbBatch(ops){
  for(let i=0;i<ops.length;i+=400){ const b=db.batch(); ops.slice(i,i+400).forEach(f=>f(b)); b.commit().catch(fail); }
}
function splitPts(p, ax, ay, bx, by, R, closed){
  const n=p.length; if(n<3) return null;
  const ex1=Math.min(ax,bx)-R, ey1=Math.min(ay,by)-R, ex2=Math.max(ax,bx)+R, ey2=Math.max(ay,by)+R;
  let x1=Infinity, y1=Infinity, x2=-Infinity, y2=-Infinity;
  for(let i=0;i<n;i+=3){ if(p[i]<x1) x1=p[i]; if(p[i]>x2) x2=p[i]; if(p[i+1]<y1) y1=p[i+1]; if(p[i+1]>y2) y2=p[i+1]; }
  if(x2<ex1 || x1>ex2 || y2<ey1 || y1>ey2) return null;
  // points are added along any part of the line near the eraser, so the cut lands where it was rubbed
  const step=Math.max(.4, R/3), q=[];
  for(let i=0;i<n;i+=3){
    if(i>0){
      const px=p[i-3], py=p[i-2], pp=p[i-1], dx=p[i]-px, dy=p[i+1]-py;
      if(!(Math.max(px,p[i])<ex1 || Math.min(px,p[i])>ex2 || Math.max(py,p[i+1])<ey1 || Math.min(py,p[i+1])>ey2)){
        const k=Math.floor(Math.hypot(dx,dy)/step);
        for(let j=1;j<k;j++){ const t=j/k; q.push(px+dx*t, py+dy*t, pp+(p[i+2]-pp)*t); }
      }
    }
    q.push(p[i], p[i+1], p[i+2]);
  }
  const keep=[]; let hit=false;
  for(let i=0;i<q.length;i+=3){ const k=distSeg(q[i],q[i+1],ax,ay,bx,by)>R; keep.push(k); if(!k) hit=true; }
  if(!hit) return null;
  const out=[]; let cur=[];
  keep.forEach((k,j)=>{
    if(k) cur.push(+q[j*3].toFixed(1), +q[j*3+1].toFixed(1), +(+q[j*3+2]).toFixed(2));
    else { if(cur.length>=6) out.push(cur); cur=[]; }
  });
  if(cur.length>=6) out.push(cur);
  // an outline that goes all the way round joins up again where it started
  if(closed && keep[0] && keep[keep.length-1] && out.length>=2) out[0]=out.pop().concat(out[0].slice(3));
  return out;
}
function densePoly(pts, closed){
  const out=[], step=2, list=closed ? pts.concat([pts[0]]) : pts;
  for(let i=0;i<list.length;i++){
    const [x,y]=list[i];
    if(i>0){
      const [px,py]=list[i-1], k=Math.max(1, Math.floor(Math.hypot(x-px,y-py)/step));
      for(let j=1;j<k;j++) out.push(px+(x-px)*j/k, py+(y-py)*j/k, .5);
    }
    out.push(x, y, .5);
  }
  return out;
}
function shapePolys(h){
  const x=Math.min(h.x1,h.x2), y=Math.min(h.y1,h.y2), w=Math.abs(h.x2-h.x1), hh=Math.abs(h.y2-h.y1);
  const closed=p=>(p.closed=true, p);
  if(h.kind==='rect') return [closed(densePoly([[x,y],[x+w,y],[x+w,y+hh],[x,y+hh]], true))];
  if(h.kind==='ellipse'){ const c=[], N=96; for(let i=0;i<N;i++){ const t=i/N*Math.PI*2; c.push([x+w/2+Math.cos(t)*w/2, y+hh/2+Math.sin(t)*hh/2]); } return [closed(densePoly(c, true))]; }
  const out=[densePoly([[h.x1,h.y1],[h.x2,h.y2]])];
  if(h.kind==='arrow'){
    const a=Math.atan2(h.y2-h.y1, h.x2-h.x1), L=Math.max(12, h.size*4);
    out.push(densePoly([[h.x2-L*Math.cos(a-.45), h.y2-L*Math.sin(a-.45)],[h.x2,h.y2],[h.x2-L*Math.cos(a+.45), h.y2-L*Math.sin(a+.45)]]));
  }
  return out;
}
function wbAreaErase(ax, ay, bx, by){
  const a=WB.act; if(!a) return;
  const r=ERASE_R[WB.eSize]/K();
  let changed=false;
  const drop=(col, it)=>{
    if(a.pendAdd.has(it.id)) a.pendAdd.delete(it.id); else a.pendDel[col].add(it.id);
    if(!a.created.has(it.id)){ const {id, _w, _wsrc, ...doc}=it; a.orig.set(it.id, {col, id:it.id, doc}); }
    DATA[col]=DATA[col].filter(x=>x.id!==it.id);
  };
  const add=(base, pts)=>{
    const id=uid(), doc={v:2, pts, color:base.color, size:base.size, tool:base.tool, by:base.by||ME.uid, at:base.at||Date.now()};
    a.created.add(id); a.pendAdd.set(id, doc); DATA.strokes.push(Object.assign({id}, doc));
  };
  DATA.strokes.slice().forEach(s=>{
    const pieces=splitPts(ptsOf(s), ax, ay, bx, by, r+s.size*(s.tool==='marker'?1.5:.5));
    if(!pieces) return;
    drop('strokes', s); pieces.forEach(pts=>add(s, pts)); changed=true;
  });
  DATA.shapes.slice().forEach(h=>{
    const polys=shapePolys(h), out=[]; let any=false;
    polys.forEach(pl=>{ const sp=splitPts(pl, ax, ay, bx, by, r+h.size/2, pl.closed); if(sp){ any=true; out.push(...sp); } else out.push(pl); });
    if(!any) return;
    drop('shapes', h);
    out.forEach(pts=>add({color:h.color, size:h.size, tool:'pen', by:h.by, at:h.at}, pts.map((v,i)=>i%3===2?v:+v.toFixed(1))));
    changed=true;
  });
  if(changed){
    WB.mainDirty=true; wbKick();
    if(!a.flushT) a.flushT=setTimeout(()=>wbAreaFlush(a), 160);
  }
}
/* Anything not yet saved stays as it is on screen while new copies of the
   board arrive. */
function wbAreaOverlay(a, n){
  DATA[n]=DATA[n].filter(x=>!a.pendDel[n].has(x.id));
  if(n==='strokes') a.pendAdd.forEach((doc,id)=>{ if(!DATA.strokes.some(x=>x.id===id)) DATA.strokes.push(Object.assign({id}, doc)); });
}
function wbAreaFlush(a, final){
  clearTimeout(a.flushT); a.flushT=0;
  const ops=[];
  ['strokes','shapes'].forEach(col=>{ a.pendDel[col].forEach(id=>ops.push(b=>b.delete(SUB(col).doc(id)))); a.pendDel[col].clear(); });
  a.pendAdd.forEach((doc,id)=>ops.push(b=>b.set(SUB('strokes').doc(id), doc))); a.pendAdd.clear();
  if(ops.length) wbBatch(ops);
  if(final){
    const add=[...a.created].map(id=>findItem('strokes', id)).filter(Boolean).map(it=>{ const {id, _w, _wsrc, ...doc}=it; return {col:'strokes', id, doc}; });
    const del=[...a.orig.values()];
    if(add.length || del.length) pushUndo({t:'multi', add, del});
  }
}
async function clearBoard(){
  if(!DATA.strokes.length && !DATA.stickies.length && !DATA.shapes.length && !DATA.texts.length) return;
  if(!await askYesNo('Clear the whiteboard?', 'Everything on it is erased for everyone.', 'Clear', true)) return;
  const now=performance.now();
  DATA.strokes.forEach(s=>INK.fading.push({k:'s', s, t0:now})); DATA.shapes.forEach(s=>INK.fading.push({k:'h', s, t0:now})); DATA.texts.forEach(s=>INK.fading.push({k:'t', s, t0:now}));
  const refs=[...['strokes','shapes','texts','stickies'].flatMap(c=>DATA[c].map(s=>SUB(c).doc(s.id)))];
  DATA.strokes=[]; DATA.shapes=[]; DATA.texts=[]; WB.mainDirty=true; wbSelect(null); wbKick();
  WB.undo=[]; WB.redo=[]; renderWbBar();
  try{ for(let i=0;i<refs.length;i+=400){ const b=db.batch(); refs.slice(i,i+400).forEach(r=>b.delete(r)); await b.commit(); } }catch(e){ fail(e); }
}

/* ----- selection ----- */
function wbSelect(sel){
  WB.sel=sel; wbPlaceSelBar(); wbKick();
}
function wbPlaceSelBar(){
  const board=$('board'); if(!board) return;
  let bar=$('selBar');
  const it=WB.sel && findItem(WB.sel.col, WB.sel.id);
  if(!it || readOnly() || (WB.act && WB.act.kind==='move')){ if(bar) bar.remove(); return; }
  if(!bar){
    bar=document.createElement('div'); bar.id='selBar'; bar.className='selBar';
    bar.innerHTML=COLORS.map(c=>`<button class="swatch" style="background:${c}" aria-label="Color" onclick="wbRecolor('${c}')"></button>`).join('')
      +`<button class="tool" aria-label="Delete" onclick="wbDeleteSel()">${icon('trash')}</button>`;
    board.appendChild(bar);
  }
  const b=itemBox(WB.sel.col, it), [sx,sy]=toScreen((b[0]+b[2])/2, b[1]);
  bar.style.left=Math.max(110, Math.min(WB.w-110, sx))+'px'; bar.style.top=Math.max(52, sy-14)+'px';
  bar.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('on', s.style.backgroundColor && it.color && s.getAttribute('style').includes(it.color)));
}
function wbRecolor(c){
  const it=WB.sel && findItem(WB.sel.col, WB.sel.id); if(!it) return;
  const before={color:it.color}, after={color:c};
  it.color=c; WB.mainDirty=true; wbKick();
  SUB(WB.sel.col).doc(it.id).update(after).catch(fail);
  pushUndo({t:'upd', col:WB.sel.col, id:it.id, before, after}); wbPlaceSelBar();
}
function wbDeleteSel(){
  const it=WB.sel && findItem(WB.sel.col, WB.sel.id); if(!it) return;
  const col=WB.sel.col; wbSelect(null); wbRemove(col, it);
}

/* ----- text ----- */
function wbOpenText(t, x, y){
  if(readOnly()) return;
  wbCommitText();
  const board=$('board');
  const ta=document.createElement('textarea');
  ta.className='textEdit'; ta.spellcheck=true; ta.setAttribute('aria-label','Text');
  WB.textEdit=t ? {id:t.id, x:t.x, y:t.y, color:t.color, size:t.size||28, el:ta, old:t.text} : {id:null, x, y, color:WB.color, size:28, el:ta};
  ta.value=t ? t.text : '';
  board.appendChild(ta);
  wbPlaceTextEdit();
  WB.mainDirty=true; wbKick();
  ta.addEventListener('input', wbPlaceTextEdit);
  ta.addEventListener('keydown', e=>{ if(e.key==='Escape' || (e.key==='Enter' && (e.metaKey||e.ctrlKey))){ e.preventDefault(); wbCommitText(); } e.stopPropagation(); });
  ta.addEventListener('blur', ()=>setTimeout(()=>{ if(WB.textEdit && WB.textEdit.el===ta) wbCommitText(); }, 0));
  try{ ta.focus({preventScroll:true}); }catch(e){}
  setTimeout(()=>{ if(WB.textEdit && WB.textEdit.el===ta && document.activeElement!==ta) ta.focus({preventScroll:true}); }, 20);
}
function wbPlaceTextEdit(){
  const te=WB.textEdit; if(!te) return;
  const k=K(), [sx,sy]=toScreen(te.x, te.y), ta=te.el;
  ta.style.color=bColor(te.color);
  ta.style.font=TEXT_FONT(te.size);
  ta.style.transform=`translate(${sx-5*k}px,${sy-3*k}px) scale(${k})`;
  ta.style.width='10px'; ta.style.height='10px';
  ta.style.width=(ta.scrollWidth+12)+'px'; ta.style.height=(ta.scrollHeight+4)+'px';
}
function wbCommitText(){
  const te=WB.textEdit; if(!te) return;
  WB.textEdit=null;
  const text=te.el.value.replace(/\s+$/,'');
  te.el.remove();
  if(te.id){
    const it=findItem('texts', te.id);
    if(!text){ if(it) wbRemove('texts', it); }
    else if(it && text!==te.old){ it.text=text; SUB('texts').doc(te.id).update({text}).catch(fail); pushUndo({t:'upd', col:'texts', id:te.id, before:{text:te.old}, after:{text}}); }
  } else if(text){
    const id=uid(), doc={x:+te.x.toFixed(1), y:+te.y.toFixed(1), text, color:te.color, size:te.size, by:ME.uid, at:Date.now()};
    DATA.texts.push(Object.assign({id}, doc)); wbAdd('texts', id, doc);
  }
  WB.mainDirty=true; wbKick();
}

/* ----- live: lines in progress, laser, cursors ----- */
function wbSendLaser(end){
  const now=performance.now();
  const pts=INK.myLaser.filter(p=>now-p[2]<750).slice(-40).map(p=>[+p[0].toFixed(1), +p[1].toFixed(1)]);
  liveSend({laser:end?null:{id:LASER_ID, pts:[].concat(...pts)}});
}
const LASER_ID=uid();
function wbSendCursor(x,y){
  const now=Date.now(); if(now-(wbSendCursor.t||0)<90) return; wbSendCursor.t=now;
  liveSend({cur:{x:+x.toFixed(1), y:+y.toFixed(1)}});
}
function wbOnPresence(){
  const now=performance.now();
  DATA.presence.forEach(p=>{
    if(p.id===ME.uid) return;
    const cur=INK.remote.get(p.id);
    if(p.ink && p.ink.id){
      if(p.ink.shape){ INK.remote.set(p.id, {id:p.ink.id, shape:p.ink.shape, ended:0}); }
      else if(p.ink.pts){
        const pts=p.ink.v===2 ? p.ink.pts : [];
        if(!cur || cur.id!==p.ink.id){
          if(DATA.strokes.some(s=>s.id===p.ink.id)) return;
          INK.remote.set(p.id, {id:p.ink.id, pts, color:p.ink.color, size:p.ink.size, tool:p.ink.tool, shown:0, ended:0});
        } else if(pts.length>cur.pts.length){ cur.pts=pts; cur.ended=0; }
      }
    } else if(cur && !cur.ended){ cur.ended=now; }
    // laser: newly arrived points get a fresh time so the trail fades here too
    if(p.laser && p.laser.pts){
      let l=INK.lasers.get(p.id);
      if(!l){ l={pts:[], color:colorFor(p.name)}; INK.lasers.set(p.id, l); }
      const flat=p.laser.pts, last=l.pts[l.pts.length-1];
      // each update repeats the last few points; only the new ones are added
      let start=0;
      if(last) for(let i=flat.length-2;i>=0;i-=2){ if(flat[i]===last[0] && flat[i+1]===last[1]){ start=i+2; break; } }
      for(let i=start;i<flat.length;i+=2) l.pts.push([flat[i], flat[i+1], now]);
      if(l.pts.length>120) l.pts=l.pts.slice(-120);
    }
  });
  wbCursors(); wbKick();
  if(wbLocked()) wbFollowView();
  if(MTG && MTG.boardPresenter && MTG.boardPresenter.uid!==ME.uid){ const l=wbLocked(); if(l!==!!WB.wasLocked){ WB.wasLocked=l; renderWbBar(); } }
}
function wbCursors(){
  const L=$('cursorLayer'); if(!L) return;
  const now=Date.now();
  const list=DATA.presence.filter(p=>p.id!==ME.uid && p.cur && now-(p.at||0)<8000);
  const seen=new Set();
  list.forEach(p=>{
    seen.add(p.id);
    let el=L.querySelector(`.cur[data-id="${p.id}"]`);
    const [sx,sy]=toScreen(p.cur.x, p.cur.y);

/* ----- sticky notes ----- */
const STK_TIMERS={};
function tiltOf(id){ let h=0; for(const c of String(id)) h=(h*33+c.charCodeAt(0))>>>0; return ((h%31)/10-1.5).toFixed(2)+'deg'; }
function addSticky(x,y){
  const id=uid();
  const doc={v:2, x:+x.toFixed(1), y:+y.toFixed(1), text:'', color:WB.sticky, by:ME.uid, at:Date.now()};
  DATA.stickies.push(Object.assign({id}, doc));
  renderStickies();
  wbAdd('stickies', id, doc);
  setTimeout(()=>{ const t=document.querySelector(`.stk[data-id="${id}"] textarea`); if(t) t.focus({preventScroll:true}); }, 40);
}
function renderStickies(){
  const layer=$('stickyLayer'); if(!layer || !WB.w) return;
  const ro=readOnly(), k=K();
  const have=new Set();
  DATA.stickies.forEach(s=>{
    have.add(s.id);
    let el=layer.querySelector(`.stk[data-id="${s.id}"]`);
    if(!el){
      el=document.createElement('div'); el.className='stk'; el.dataset.id=s.id; el.style.setProperty('--rot', tiltOf(s.id));
      el.innerHTML=`<div class="in"><div class="grip"><span class="by"></span>${ro?'':`<button aria-label="Delete sticky note">&times;</button>`}</div><textarea aria-label="Sticky note" ${ro?'readonly':''}></textarea></div>`;
      layer.appendChild(el);
      const ta=el.querySelector('textarea');
      ta.addEventListener('input', ()=>{
        clearTimeout(STK_TIMERS[s.id]);
        STK_TIMERS[s.id]=setTimeout(()=>SUB('stickies').doc(s.id).update({text:ta.value}).catch(fail), 250);
      });
      ta.addEventListener('blur', ()=>{ clearTimeout(STK_TIMERS[s.id]); const cur=DATA.stickies.find(x=>x.id===s.id); if(cur && cur.text!==ta.value) SUB('stickies').doc(s.id).update({text:ta.value}).catch(fail); });
      if(!ro){
        el.querySelector('.grip button').addEventListener('click', ev=>{
          ev.stopPropagation();
          const cur=DATA.stickies.find(x=>x.id===s.id); if(!cur) return;
          const {id, ...doc}=cur;
          SUB('stickies').doc(s.id).delete().catch(fail);
          pushUndo({t:'del', col:'stickies', id:s.id, doc});
        });
        dragSticky(el, s.id);
      }
    }
    if(!el.classList.contains('dragging')){
      const [wx,wy]=stickyPos(s), [sx,sy]=toScreen(wx,wy);
      el.style.transform=`translate(${sx}px,${sy}px) scale(${k})`;
    }
    el.style.backgroundColor=s.color||STICKY_COLORS[0];
    el.querySelector('.in').style.backgroundColor=s.color||STICKY_COLORS[0];
    el.querySelector('.by').textContent=nameOfUid(s.by);
    const ta=el.querySelector('textarea');
    if(document.activeElement!==ta && ta.value!==(s.text||'')) ta.value=s.text||'';
  });
  layer.querySelectorAll('.stk').forEach(el=>{
    if(have.has(el.dataset.id) || el.classList.contains('leaving')) return;
    if(RM.matches) el.remove(); else { el.classList.add('leaving'); setTimeout(()=>el.remove(), 240); }
  });
}
/* Dragging moves the note with the finger and sets its place when let go.
   Other people see it glide there. */
function dragSticky(el, id){
  const grip=el.querySelector('.grip');
  let st=null;
  grip.addEventListener('pointerdown', e=>{
    if(e.target.tagName==='BUTTON') return;
    e.preventDefault(); e.stopPropagation();
    const s=DATA.stickies.find(x=>x.id===id); if(!s) return;
    const [x,y]=stickyPos(s);
    st={px:e.clientX, py:e.clientY, x, y, before:{v:s.v||1, x:s.x, y:s.y}};
    el.classList.add('dragging');
    grip.setPointerCapture(e.pointerId);
  });
  grip.addEventListener('pointermove', e=>{
    if(!st) return;
    const k=K();
    st.nx=st.x+(e.clientX-st.px)/k; st.ny=st.y+(e.clientY-st.py)/k;
    const [sx,sy]=toScreen(st.nx, st.ny);
    el.style.transform=`translate(${sx}px,${sy}px) scale(${k})`;
  });
  const end=()=>{
    if(!st) return;
    const d=st; st=null;
    el.classList.remove('dragging');
    const s=DATA.stickies.find(x=>x.id===id);
    if(s && d.nx!=null){
      const after={v:2, x:+d.nx.toFixed(1), y:+d.ny.toFixed(1)};
      Object.assign(s, after);
      SUB('stickies').doc(id).update(after).catch(fail);
      pushUndo({t:'upd', col:'stickies', id, before:d.before, after});
    }
  };
  grip.addEventListener('pointerup', end); grip.addEventListener('pointercancel', end);
}

/* ----- save as image ----- */
function wbExport(){
  const b=wbBounds();
  if(!b){ toast('The whiteboard is empty.'); return; }
  const pad=40, sc=2, W=Math.ceil((b[2]-b[0]+pad*2)*sc), H=Math.ceil((b[3]-b[1]+pad*2)*sc);
  const lim=8000, f=Math.min(1, lim/W, lim/H);
  const c=document.createElement('canvas'); c.width=Math.ceil(W*f); c.height=Math.ceil(H*f);
  const ctx=c.getContext('2d');
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,c.width,c.height);
  ctx.setTransform(sc*f,0,0,sc*f,(pad-b[0])*sc*f,(pad-b[1])*sc*f);
  const dark=document.documentElement.classList.contains('dark');
  if(dark) document.documentElement.classList.remove('dark');
  [...DATA.strokes.map(s=>['s',s]), ...DATA.shapes.map(s=>['h',s]), ...DATA.texts.map(s=>['t',s])].sort((a,b)=>(a[1].at||0)-(b[1].at||0))
    .forEach(([k,s])=>{ if(k==='s') drawStroke(ctx, ptsOf(s), s.color, s.size, s.tool); else if(k==='h') drawShape(ctx, s); else drawText(ctx, s); });
  DATA.stickies.forEach(s=>{
    const [x,y]=stickyPos(s);
    ctx.save(); ctx.fillStyle=s.color||STICKY_COLORS[0]; ctx.shadowColor='rgba(0,0,0,.18)'; ctx.shadowBlur=10; ctx.shadowOffsetY=3;
    ctx.fillRect(x,y,150,120); ctx.restore();
    ctx.save(); ctx.fillStyle='#1d1a00'; ctx.font="500 14px 'DM Sans', system-ui, sans-serif"; ctx.textBaseline='top';
    let line='', yy=y+26; const words=String(s.text||'').split(/(\s+)/);
    words.forEach(w=>{ if(w.includes('\n')){ ctx.fillText(line,x+10,yy); yy+=19; line=''; return; } const t=line+w; if(ctx.measureText(t).width>130 && line){ ctx.fillText(line,x+10,yy); yy+=19; line=w.trimStart(); } else line=t; });
    if(line) ctx.fillText(line,x+10,yy);
    ctx.restore();
  });
  if(dark) document.documentElement.classList.add('dark');
  c.toBlob(blob=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=((MTG && MTG.title) || 'Whiteboard').replace(/[^\w ,.-]+/g,'')+' whiteboard.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
}
