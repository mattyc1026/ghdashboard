<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good &amp; Handy &mdash; Leads</title>
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="favicon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --blueprint:#0F2A3D;
    --blueprint-line:#3D6B8A;
    --paper:#EDEAE1;
    --safety:#F4611E;
    --safety-dim:#c94f16;
    --ink:#1A1A1A;
    --ok:#2E7D5B;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:var(--blueprint);
    background-image:
      linear-gradient(var(--blueprint-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--blueprint-line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-attachment: fixed;
    font-family:'Inter', sans-serif;
    color: var(--paper);
    min-height:100vh;
    padding: 28px 18px 60px;
  }

  .wrap{max-width:640px; margin:0 auto;}

  header{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height: clamp(56px, 18vw, 96px);
    border-bottom: 2px dashed rgba(237,234,225,0.35);
    padding-bottom:18px;
    margin-bottom: 22px;
  }

  .brand-mark{display:block; text-align:left;}

  .brand-mark .icon{
    position:absolute;
    left:0;
    top:50%;
    transform:translateY(-50%);
    margin-top:-9px;
    width: clamp(56px, 18vw, 96px);
    height: clamp(56px, 18vw, 96px);
  }

  h1{
    font-family:'Archivo Black', sans-serif;
    font-size: clamp(20px, 6.6vw, 32px);
    letter-spacing:0.5px;
    margin:0;
    line-height:1.05;
    white-space:nowrap;
  }

  .subtitle{
    font-weight:600;
    font-size: clamp(10px, 3.1vw, 14px);
    color:#AFC7D8;
    text-transform:uppercase;
    letter-spacing:1.2px;
    margin-top:5px;
    white-space:nowrap;
  }

  .backRow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .back{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--paper);
    text-decoration:none;
    border:1px solid rgba(237,234,225,0.4);
    border-radius:3px;
    padding:7px 11px;
  }
  .back:active{transform:translateY(1px);}
  .stat{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:1px;
    color:#AFC7D8;
  }

  .panel{
    background:var(--paper);
    color:var(--ink);
    border-radius:4px;
    border:1px solid rgba(0,0,0,0.08);
    box-shadow:4px 4px 0 rgba(0,0,0,0.25);
    padding:16px 16px 14px;
    margin-bottom:14px;
  }

  .bar{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  input[type=text], input[type=tel], input[type=email], textarea{
    font-family:'Inter', sans-serif;
    font-size:14px;
    color:var(--ink);
    background:#fff;
    border:1px solid rgba(0,0,0,0.22);
    border-radius:3px;
    padding:9px 10px;
    width:100%;
    -webkit-appearance:none;
  }
  input:focus, textarea:focus{
    outline:none;
    border-color:var(--safety);
    box-shadow:0 0 0 2px rgba(244,97,30,0.18);
  }
  .search{flex:1 1 160px; min-width:0;}

  button{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    border-radius:3px;
    padding:9px 12px;
    cursor:pointer;
    border:1px solid rgba(0,0,0,0.25);
    background:#fff;
    color:var(--ink);
    flex-shrink:0;
  }
  button:active{transform:translateY(1px);}
  button.primary{
    background:var(--safety);
    border-color:var(--safety-dim);
    color:#fff;
    font-weight:700;
  }

  .sort{display:flex; border:1px solid rgba(0,0,0,0.25); border-radius:3px; overflow:hidden;}
  .sort button{border:0; border-radius:0; background:#fff;}
  .sort button + button{border-left:1px solid rgba(0,0,0,0.18);}
  .sort button.on{background:var(--blueprint); color:var(--paper);}

  .form{
    display:none;
    gap:8px;
    grid-template-columns:1fr 1fr;
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed rgba(0,0,0,0.28);
  }
  .form.open{display:grid;}
  .form .full{grid-column:1 / -1;}
  .actions{grid-column:1 / -1; display:flex; gap:8px; justify-content:flex-end;}
  .err{grid-column:1 / -1; font-size:12.5px; color:#B3261E; font-weight:600; display:none;}
  .err.on{display:block;}

  .cfg{display:none; margin-top:12px; padding-top:12px; border-top:1px dashed rgba(0,0,0,0.28);}
  .cfg.open{display:block;}
  .cfg textarea{
    min-height:104px;
    font-family:'Space Mono', monospace;
    font-size:11.5px;
  }
  .cfg .actions{display:flex; gap:8px; justify-content:flex-end; margin-top:8px;}

  .list{padding:4px 16px 6px;}
  .row{
    display:flex;
    align-items:flex-start;
    gap:11px;
    padding:12px 0;
    border-top:1px solid rgba(0,0,0,0.10);
  }
  .row:first-child{border-top:0;}
  .initial{
    width:34px; height:34px;
    flex-shrink:0;
    border-radius:3px;
    background:var(--blueprint);
    color:var(--paper);
    font-family:'Archivo Black', sans-serif;
    font-size:15px;
    display:flex; align-items:center; justify-content:center;
  }
  .row.manual .initial{background:var(--safety);}
  .body{flex:1; min-width:0;}
  .nm{font-weight:700; font-size:15.5px; line-height:1.25; word-break:break-word;}
  .meta{display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:3px; font-size:13px;}
  .meta a{
    color:var(--blueprint);
    text-decoration:none;
    border-bottom:1px dotted rgba(15,42,61,0.45);
    word-break:break-all;
  }
  .lbl{
    font-family:'Space Mono', monospace;
    font-size:10px;
    color:#8a8a8a;
    letter-spacing:0.6px;
    margin-right:3px;
  }
  .addr{font-size:12px; color:#5a5a5a; margin-top:3px; word-break:break-word;}
  .rowActs{display:flex; gap:2px; flex-shrink:0;}
  .iconBtn{
    border:0;
    background:transparent;
    color:#9a9a9a;
    font-size:15px;
    line-height:1;
    padding:5px 6px;
    letter-spacing:0;
  }
  .iconBtn.del{font-size:17px;}
  .iconBtn:hover{color:var(--blueprint);}
  .iconBtn.del:hover{color:#B3261E;}
  .row.editing{background:rgba(244,97,30,0.10);}
  .empty{font-size:13.5px; color:#5a5a5a; padding:16px 2px;}

  .alpha{
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:1.5px;
    color:#8a8a8a;
    padding:12px 0 4px;
    border-top:1px solid rgba(0,0,0,0.10);
  }
  .alpha:first-child{border-top:0; padding-top:4px;}
  .alpha + .row{border-top:0;}

  @media (max-width:420px){
    .form{grid-template-columns:1fr;}
  }

<script>
/* =========================================================================
   LEADS
   Contacts pulled from the portal's Job History. A job only counts once it
   carries a SURVEY note, the same condition the portal uses to move a work
   order out of Surveys and into Job History. Hand-entered leads sit in the
   same list, and every lead can be edited or removed here.

   Job History is the portal's record, so this page never writes back to it.
   Edits to a lead that came from a work order are kept as an overlay, and
   removals as a hidden list, both stored beside the manual leads. The work
   order itself is left exactly as the portal has it.
========================================================================= */
(function(){
'use strict';

var PORTAL_DB_KEY = 'gh_portal_db_v1';
var SYNC_CFG_KEY  = 'gh_portal_sync_cfg';
var LEADS_KEY     = 'gh_dash_leads_v1';
var LEGACY_KEY    = 'gh_dash_manual_leads_v1';

var portalDB = {workOrders:[]};
var store    = {manual:[], overrides:{}, hidden:[]};
var sortBy   = 'last';
var query    = '';
var editing  = '';
var db       = null;

/* ---------------------------------------------------------------- utils -- */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function readJSON(key, fallback){
  try{ var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
function firstName(name){
  var n = String(name || '').trim();
  return n ? n.split(/\s+/)[0] : '';
}
function lastName(name){
  var n = String(name || '').trim();
  if(!n) return '';
  var p = n.split(/\s+/);
  return p.length > 1 ? p[p.length - 1] : p[0];
}
function digits(s){ return String(s || '').replace(/\D/g, ''); }
function formatPhone(s){
  var d = digits(s);
  if(d.length === 11 && d.charAt(0) === '1') d = d.slice(1);
  if(d.length === 10) return '(' + d.slice(0,3) + ') ' + d.slice(3,6) + '-' + d.slice(6);
  return String(s || '').trim();
}
function normalizeStore(raw){
  /* An older build saved a bare array of manual leads. */
  if(Array.isArray(raw)) return {manual:raw, overrides:{}, hidden:[]};
  if(!raw || typeof raw !== 'object') return {manual:[], overrides:{}, hidden:[]};
  return {
    manual:    Array.isArray(raw.manual) ? raw.manual : [],
    overrides: (raw.overrides && typeof raw.overrides === 'object') ? raw.overrides : {},
    hidden:    Array.isArray(raw.hidden) ? raw.hidden : []
  };
}

/* -------------------------------------------------------------- sources -- */
function hasSurveyNote(wo){
  var notes = (wo && wo.notes) || [];
  for(var i = 0; i < notes.length; i++){
    if(String((notes[i] && notes[i].type) || '').toUpperCase() === 'SURVEY') return true;
  }
  return false;
}
function jobLeads(){
  var wos = (portalDB && portalDB.workOrders) || [];
  var out = [];
  for(var i = 0; i < wos.length; i++){
    var wo = wos[i];
    if(!wo || !wo.movedToHistoryAt) continue;   /* Job History only */
    if(!hasSurveyNote(wo)) continue;            /* survey note required */
    var c = wo.customer || {};
    if(!(c.name || c.phone || c.email)) continue;
    out.push({
      key:'wo-' + wo.id,
      name:(c.name || '').trim(),
      phone:(c.phone || '').trim(),
      altPhone:(c.altPhone || '').trim(),
      email:(c.email || '').trim(),
      address:(c.address || '').trim(),
      manual:false
    });
  }
  return out;
}
function manualLeads(){
  return (store.manual || []).map(function(m){
    return {
      key:m.id,
      name:(m.name || '').trim(),
      phone:(m.phone || '').trim(),
      altPhone:'',
      email:(m.email || '').trim(),
      address:(m.address || '').trim(),
      manual:true
    };
  });
}
function applyOverride(r){
  var o = store.overrides[r.key];
  if(!o) return r;
  return {
    key:r.key,
    name:     o.name     != null ? o.name     : r.name,
    phone:    o.phone    != null ? o.phone    : r.phone,
    altPhone: o.altPhone != null ? o.altPhone : r.altPhone,
    email:    o.email    != null ? o.email    : r.email,
    address:  o.address  != null ? o.address  : r.address,
    manual:   r.manual,
    edited:   true
  };
}
/* A customer in Job History more than once, or one also entered by hand,
   should still read as a single line. Match on phone digits, then email,
   then name, and let the fuller record fill the other's gaps. */
function allLeads(){
  var hidden = {};
  for(var h = 0; h < store.hidden.length; h++) hidden[store.hidden[h]] = true;

  var rows = manualLeads().concat(jobLeads())
    .filter(function(r){ return !hidden[r.key]; })
    .map(applyOverride);

  var seen = {}, out = [];
  for(var i = 0; i < rows.length; i++){
    var r = rows[i];
    var id = digits(r.phone) || (r.email || '').toLowerCase() || (r.name || '').toLowerCase();
    if(!id){ out.push(r); continue; }
    if(seen[id]){
      var prev = seen[id];
      if(!prev.email && r.email) prev.email = r.email;
      if(!prev.altPhone && r.altPhone) prev.altPhone = r.altPhone;
      if(!prev.address && r.address) prev.address = r.address;
      if(!prev.name && r.name) prev.name = r.name;
      continue;
    }
    seen[id] = r;
    out.push(r);
  }
  return out;
}
function findLead(key){
  var all = allLeads();
  for(var i = 0; i < all.length; i++) if(all[i].key === key) return all[i];
  return null;
}
function matches(r){
  if(!query) return true;
  var q = query.toLowerCase();
  var qd = digits(q);
  if((r.name || '').toLowerCase().indexOf(q) !== -1) return true;
  if((r.email || '').toLowerCase().indexOf(q) !== -1) return true;
  if((r.address || '').toLowerCase().indexOf(q) !== -1) return true;
  if(qd && (digits(r.phone).indexOf(qd) !== -1 || digits(r.altPhone).indexOf(qd) !== -1)) return true;
  return false;
}
function sortKey(r){
  var k = sortBy === 'first' ? firstName(r.name) : lastName(r.name);
  return (k || r.name || r.email || r.phone || '').toLowerCase();
}

/* --------------------------------------------------------------- render -- */
function render(){
  var everything = allLeads();
  var list = everything.filter(matches).sort(function(a, b){
    var ka = sortKey(a), kb = sortKey(b);
    if(ka < kb) return -1;
    if(ka > kb) return 1;
    return (a.name || '').toLowerCase() < (b.name || '').toLowerCase() ? -1 : 1;
  });

  document.getElementById('count').textContent =
    query ? (list.length + ' / ' + everything.length)
          : (everything.length + (everything.length === 1 ? ' LEAD' : ' LEADS'));

  var host = document.getElementById('list');
  if(!list.length){
    host.innerHTML = '<div class="empty">' + (everything.length ? 'No matches.' : 'No leads yet.') + '</div>';
    return;
  }

  var html = '', letter = '';
  for(var i = 0; i < list.length; i++){
    var r = list[i];
    var sortName = (sortBy === 'first' ? firstName(r.name) : lastName(r.name)) || r.name || r.email || '?';
    var first = sortName.charAt(0).toUpperCase() || '?';
    if(first !== letter){
      letter = first;
      html += '<div class="alpha">' + esc(letter) + '</div>';
    }
    var meta = '';
    if(r.phone){
      meta += '<span><span class="lbl">P</span><a href="tel:' + esc(digits(r.phone)) + '">' + esc(formatPhone(r.phone)) + '</a></span>';
    }
    if(r.altPhone){
      meta += '<span><span class="lbl">ALT</span><a href="tel:' + esc(digits(r.altPhone)) + '">' + esc(formatPhone(r.altPhone)) + '</a></span>';
    }
    if(r.email){
      meta += '<span><span class="lbl">E</span><a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a></span>';
    }
    html += '<div class="row' + (r.manual ? ' manual' : '') + (editing === r.key ? ' editing' : '') + '">' +
              '<div class="initial">' + esc(first) + '</div>' +
              '<div class="body">' +
                '<div class="nm">' + (esc(r.name) || '(No name)') + '</div>' +
                (meta ? '<div class="meta">' + meta + '</div>' : '') +
                (r.address ? '<div class="addr">' + esc(r.address) + '</div>' : '') +
              '</div>' +
              '<div class="rowActs">' +
                '<button type="button" class="iconBtn" data-edit="' + esc(r.key) + '" aria-label="Edit lead">&#9998;</button>' +
                '<button type="button" class="iconBtn del" data-del="' + esc(r.key) + '" aria-label="Remove lead">&times;</button>' +
              '</div>' +
            '</div>';
  }
  host.innerHTML = html;

  var eds = host.querySelectorAll('[data-edit]');
  for(var j = 0; j < eds.length; j++){
    eds[j].addEventListener('click', function(){ openEdit(this.getAttribute('data-edit')); });
  }
  var dels = host.querySelectorAll('[data-del]');
  for(var k = 0; k < dels.length; k++){
    dels[k].addEventListener('click', function(){ removeLead(this.getAttribute('data-del')); });
  }
}

/* ------------------------------------------------------------- persist --- */
function save(){
  try{ localStorage.setItem(LEADS_KEY, JSON.stringify(store)); }catch(e){}
  if(db){
    db.collection('gh_portal').doc('leads')
      .set({leads: JSON.stringify(store), updatedAt: Date.now()})
      .catch(function(e){ console.error('Lead sync failed', e); });
  }
  render();
}

/* ----------------------------------------------------- add / edit / del -- */
function submitForm(){
  var name    = document.getElementById('fName').value.trim();
  var phone   = document.getElementById('fPhone').value.trim();
  var email   = document.getElementById('fEmail').value.trim();
  var address = document.getElementById('fAddress').value.trim();
  var err     = document.getElementById('formErr');

  if(!name){ err.textContent = 'Enter a name.'; err.classList.add('on'); return; }
  if(!phone && !email){ err.textContent = 'Enter a phone number or an email.'; err.classList.add('on'); return; }
  err.classList.remove('on');

  if(editing){
    var idx = -1;
    for(var i = 0; i < store.manual.length; i++){
      if(store.manual[i].id === editing){ idx = i; break; }
    }
    if(idx > -1){
      store.manual[idx].name    = name;
      store.manual[idx].phone   = phone;
      store.manual[idx].email   = email;
      store.manual[idx].address = address;
    }else{
      /* A work order lead: keep the change as an overlay, leave the portal's
         own record untouched. */
      var prev = store.overrides[editing] || {};
      prev.name = name; prev.phone = phone; prev.email = email; prev.address = address;
      store.overrides[editing] = prev;
    }
  }else{
    store.manual.push({
      id:'m-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      name:name, phone:phone, email:email, address:address,
      createdAt:Date.now()
    });
  }
  closeForm();
  save();
}
function removeLead(key){
  var r = findLead(key);
  var label = (r && r.name) ? r.name : 'this lead';
  if(!window.confirm('Remove ' + label + ' from the leads list?')) return;

  var before = store.manual.length;
  store.manual = store.manual.filter(function(m){ return m.id !== key; });
  if(store.manual.length === before && store.hidden.indexOf(key) === -1){
    /* From Job History: hide it here, leave the work order alone. */
    store.hidden.push(key);
  }
  if(store.overrides[key]) delete store.overrides[key];
  if(editing === key) closeForm();
  save();
}
function openEdit(key){
  var r = findLead(key);
  if(!r) return;
  editing = key;
  document.getElementById('fKey').value = key;
  document.getElementById('fName').value    = r.name || '';
  document.getElementById('fPhone').value   = r.phone || '';
  document.getElementById('fEmail').value   = r.email || '';
  document.getElementById('fAddress').value = r.address || '';
  document.getElementById('formErr').classList.remove('on');
  document.getElementById('saveBtn').textContent = 'Update';
  document.getElementById('form').classList.add('open');
  document.getElementById('fName').focus();
  window.scrollTo({top:0, behavior:'smooth'});
  render();
}
function openForm(){
  editing = '';
  document.getElementById('fKey').value = '';
  document.getElementById('saveBtn').textContent = 'Save';
  document.getElementById('form').classList.add('open');
  document.getElementById('fName').focus();
}
function closeForm(){
  editing = '';
  document.getElementById('fKey').value = '';
  document.getElementById('form').classList.remove('open');
  document.getElementById('formErr').classList.remove('on');
  document.getElementById('saveBtn').textContent = 'Save';
  ['fName','fPhone','fEmail','fAddress'].forEach(function(id){
    document.getElementById(id).value = '';
  });
  render();
}

/* ----------------------------------------------------------------- sync -- */
/* The portal keeps its whole database in one Firestore document and its web
   config in localStorage. On the same origin this page reads both, so the
   list stays current without a second copy of the data. When the config is
   not there yet, the Sync button takes it. */
function getCfg(){ return readJSON(SYNC_CFG_KEY, null); }

function loadLocal(){
  portalDB = readJSON(PORTAL_DB_KEY, {workOrders:[]}) || {workOrders:[]};
  if(!portalDB.workOrders) portalDB.workOrders = [];

  var saved = readJSON(LEADS_KEY, null);
  if(saved == null) saved = readJSON(LEGACY_KEY, null);
  store = normalizeStore(saved);
}

function initSync(){
  var cfg = getCfg();
  var btn = document.getElementById('syncBtn');
  if(!cfg || typeof firebase === 'undefined'){ btn.style.display = ''; return; }
  btn.style.display = 'none';
  try{
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    db = firebase.firestore();

    db.collection('gh_portal').doc('main').onSnapshot(function(snap){
      if(!snap.exists) return;
      var raw = snap.data() && snap.data().db;
      if(!raw) return;
      try{
        var parsed = JSON.parse(raw);
        portalDB = (parsed && parsed.workOrders) ? parsed : {workOrders:[]};
        render();
      }catch(e){ console.error('Bad portal payload', e); }
    }, function(e){
      console.error('Leads sync error', e);
      document.getElementById('syncBtn').style.display = '';
    });

    db.collection('gh_portal').doc('leads').onSnapshot(function(snap){
      if(!snap.exists) return;
      var raw = snap.data() && snap.data().leads;
      if(!raw) return;
      try{
        store = normalizeStore(JSON.parse(raw));
        try{ localStorage.setItem(LEADS_KEY, JSON.stringify(store)); }catch(e2){}
        render();
      }catch(e){ console.error('Bad leads payload', e); }
    }, function(e){ console.error('Leads sync error', e); });
  }catch(e){
    console.error(e);
    db = null;
    document.getElementById('syncBtn').style.display = '';
  }
}

function saveCfg(){
  var box = document.getElementById('cfgInput');
  var err = document.getElementById('cfgErr');
  var txt = box.value.trim();
  if(!txt){ err.textContent = 'Paste the firebaseConfig object.'; err.classList.add('on'); return; }
  var cfg = null;
  try{ cfg = JSON.parse(txt); }
  catch(e){
    try{ cfg = (new Function('return (' + txt.replace(/^[^{]*/, '') + ');'))(); }
    catch(e2){ cfg = null; }
  }
  if(!cfg || typeof cfg !== 'object' || !cfg.apiKey || !cfg.projectId){
    err.textContent = 'That config is missing apiKey or projectId.';
    err.classList.add('on');
    return;
  }
  err.classList.remove('on');
  try{ localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(cfg)); }catch(e3){}
  document.getElementById('cfg').classList.remove('open');
  initSync();
  render();
}

/* ------------------------------------------------------------------ wire -- */
function wire(){
  document.getElementById('addBtn').addEventListener('click', function(){
    var f = document.getElementById('form');
    if(f.classList.contains('open') && !editing) closeForm(); else openForm();
  });
  document.getElementById('saveBtn').addEventListener('click', submitForm);
  document.getElementById('cancelBtn').addEventListener('click', closeForm);

  ['fName','fPhone','fEmail','fAddress'].forEach(function(id){
    document.getElementById(id).addEventListener('keydown', function(e){
      if(e.key === 'Enter') submitForm();
      if(e.key === 'Escape') closeForm();
    });
  });

  document.getElementById('search').addEventListener('input', function(){
    query = this.value.trim();
    render();
  });

  document.getElementById('sortLast').addEventListener('click', function(){
    sortBy = 'last';
    this.classList.add('on');
    document.getElementById('sortFirst').classList.remove('on');
    render();
  });
  document.getElementById('sortFirst').addEventListener('click', function(){
    sortBy = 'first';
    this.classList.add('on');
    document.getElementById('sortLast').classList.remove('on');
    render();
  });

  document.getElementById('syncBtn').addEventListener('click', function(){
    var c = document.getElementById('cfg');
    c.classList.toggle('open');
    if(c.classList.contains('open')){
      var cfg = getCfg();
      if(cfg) document.getElementById('cfgInput').value = JSON.stringify(cfg, null, 2);
      document.getElementById('cfgInput').focus();
    }
  });
  document.getElementById('cfgSave').addEventListener('click', saveCfg);
  document.getElementById('cfgCancel').addEventListener('click', function(){
    document.getElementById('cfg').classList.remove('open');
    document.getElementById('cfgErr').classList.remove('on');
  });

  /* Another tab on this origin, the portal included, writing to storage. */
  window.addEventListener('storage', function(e){
    if(e.key === PORTAL_DB_KEY || e.key === LEADS_KEY){
      loadLocal();
      render();
    }
  });
}

loadLocal();
wire();
render();
initSync();

})();
</script>
</body>
</html>
